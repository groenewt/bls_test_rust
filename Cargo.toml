[package]
name = "rusty"
version = "0.1.0"
edition = "2024"
description = "A data processing system for Bureau of Labor Statistics (BLS) survey data"

[dependencies]
# Configuration parsing
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Logging and monitoring
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

# File processing and I/O
csv = "1.2"
memmap2 = "0.7"  # For memory-mapped file I/O
arrow = "56.0"   # For Parquet support
parquet = "56.0"
flate2 = "1.0"   # For compression support

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1.9"
uuid = { version = "1.0", features = ["v4"] }
rayon = "1.7"    # For parallel processing
num_cpus = "1.0" # For CPU detection

# Plugin system
libloading = "0.8"  # For dynamic library loading

# Security
secrecy = "0.8"  # For secure handling of sensitive data

# Validation
validator = { version = "0.16", features = ["derive"] }

# Random number generation
fastrand = "2.0"
get-file-size = "0.1.2"
once_cell = "1.21.3"

[dev-dependencies]
tempfile = "3.8"  # For temporary files in tests
