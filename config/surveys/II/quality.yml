# II Survey Quality Configuration
# Validations, expectations, thresholds
config_version: 1

expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "supersector_code", "industry_code", "data_type_code", "case_type_code", "area_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 2000, max: 2067 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "series", column: "begin_year", min: 2000, max: 2067 }
    - { file: "series", column: "end_year", min: 2000, max: 2067 }
  
  patterns:
    - { file: "main", column: "series_id", pattern: "^IIU\\d{15}$" }
    - { file: "main", column: "period", pattern: "^A01$" }
    - { file: "series", column: "series_id", pattern: "^IIU\\d{15}$" }
    - { file: "series", column: "begin_period", pattern: "^A01$" }
    - { file: "series", column: "end_period", pattern: "^A01$" }
  
  lengths:
    - { file: "series", column: "series_id", exact: 17 }
    - { file: "series", column: "supersector_code", exact: 3 }
    - { file: "series", column: "industry_code", exact: 6 }
    - { file: "series", column: "data_type_code", exact: 1 }
    - { file: "series", column: "case_type_code", exact: 1 }
    - { file: "series", column: "area_code", exact: 3 }
    - { file: "series", column: "begin_year", exact: 4 }
    - { file: "series", column: "begin_period", exact: 3 }
    - { file: "series", column: "end_year", exact: 4 }
    - { file: "series", column: "end_period", exact: 3 }
  
  values:
    - { file: "main", column: "period", allowed: ["A01"] }
    - { file: "series", column: "begin_period", allowed: ["A01"] }
    - { file: "series", column: "end_period", allowed: ["A01"] }
  
  cross_field:
    - field: "end_year"
      rule: "greater_than_or_equal"
      compare_field: "begin_year"
      file: "series"
      message: "End year must be >= begin year"

row_count:
  min: 1
  warn_below: 100

uniqueness:
  - { file: "series", columns: ["series_id"] }
  - { file: "main", columns: ["series_id", "year", "period"] }

completeness:
  required_fields:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "supersector_code", "industry_code", "data_type_code", "case_type_code", "area_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  nullable_fields:
    - { file: "main", columns: ["value", "footnote_codes"] }
    - { file: "series", columns: [] }

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "min(year)", "max(year)", "avg(value)"]
  persist: true

policy:
  mode: "fail_on_error"  # warn_only|fail_on_error
  sample_on_fail_rows: 50
  max_errors: 5000  # Stop if too many errors (increased for larger dataset)

# Error handling for quality checks
error_handling:
  on_error: "continue"  # Continue processing other records
  log_errors: true
  error_file: "ii_quality_errors.log"