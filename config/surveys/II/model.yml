# II Survey Data Model Configuration
# Data model: files, schemas, relationships
config_version: 1

series:
  path: "ii.series"
  index: "series_id"
  estimated_size_gb: 2.0
  schema:
    series_id:
      type: "string"
      length: 17
      nullable: false
      example_value: "IIU00000000001100"
    supersector_code:
      type: "string"
      length: 3
      nullable: false
      example_value: "000"
    industry_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "000000"
    data_type_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "0"
    case_type_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "1"
    area_code:
      type: "string"
      length: 3
      nullable: false
      example_value: "100"
    begin_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2000"
    begin_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"
    end_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2003"
    end_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"

data_files:
  - id: "main"
    pattern: "ii.data.*"
    index: "series_id"
    schema:
      series_id:
        type: "string"
        length: 17
        nullable: false
        example_value: "IIU00000000001100"
      year:
        type: "int32"
        min: 2000
        max: 2067
        nullable: false
        example_value: "2003"
      period:
        type: "string"
        length: 3
        pattern: "^A01$"
        nullable: false
        example_value: "A01"
      value:
        type: "decimal"
        precision: 18
        scale: 4
        nullable: true
        example_value: "0.4"
      footnote_codes:
        type: "string"
        length: 10
        nullable: true
        example_value: ""

lookups:
  - id: "area"
    path: "ii.area"
    index: "area_code"
    schema:
      area_code:
        type: "string"
        length: 3
        nullable: false
        example_value: "100"
      area_name:
        type: "string"
        length: 100
        nullable: false
        example_value: "Private Industry, National"
      display_level:
        type: "string"
        length: 2
        nullable: false
        example_value: "0"
      selectable:
        type: "string"
        length: 1
        nullable: false
        example_value: "T"
      sort_sequence:
        type: "string"
        length: 5
        nullable: false
        example_value: "00000"

  - id: "case_type"
    path: "ii.case_type"
    index: "case_type_code"
    schema:
      case_type_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "1"
      case_type_text:
        type: "string"
        length: 100
        nullable: false
        example_value: "Injury, illness"

  - id: "data_type"
    path: "ii.data_type"
    index: "data_type_code"
    schema:
      data_type_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "3"
      data_type_text:
        type: "string"
        length: 100
        nullable: false
        example_value: "Lost workdays"

  - id: "footnote"
    path: "ii.footnote"
    index: "footnote_code"
    schema:
      footnote_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "C"
      footnote_text:
        type: "string"
        length: 100
        nullable: true
        example_value: ""

  - id: "industry"
    path: "ii.industry"
    index: "industry_code"
    schema:
      supersector_code:
        type: "string"
        length: 3
        nullable: false
        example_value: "000"
      industry_code:
        type: "string"
        length: 6
        nullable: false
        example_value: "000000"
      industry_name:
        type: "string"
        length: 100
        nullable: false
        example_value: "All Workers"
      display_level:
        type: "string"
        length: 2
        nullable: false
        example_value: "0"
      selectable:
        type: "string"
        length: 1
        nullable: false
        example_value: "T"
      sort_sequence:
        type: "string"
        length: 5
        nullable: false
        example_value: "00001"

  - id: "supersector"
    path: "ii.supersector"
    index: "supersector_code"
    schema:
      supersector_code:
        type: "string"
        length: 3
        nullable: false
        example_value: "000"
      supersector_name:
        type: "string"
        length: 100
        nullable: false
        example_value: "Total private"
      display_level:
        type: "string"
        length: 2
        nullable: false
        example_value: "0"
      selectable:
        type: "string"
        length: 1
        nullable: false
        example_value: "T"
      sort_sequence:
        type: "string"
        length: 5
        nullable: false
        example_value: "00001"

  - id: "seasonal"
    path: "ii.seasonal"
    index: "seasonal_code"
    schema:
      seasonal_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "U"
      seasonal_text:
        type: "string"
        length: 100
        nullable: false
        example_value: "Not seasonally adjusted"

relationships:
  - from: { file: "main", column: "series_id" }
    to: { file: "series", column: "series_id" }
    type: "many-to-one"
  - from: { file: "series", column: "supersector_code" }
    to: { file: "supersector", column: "supersector_code" }
    type: "many-to-one"
  - from: { file: "series", column: "industry_code" }
    to: { file: "industry", column: "industry_code" }
    type: "many-to-one"
  - from: { file: "series", column: "data_type_code" }
    to: { file: "data_type", column: "data_type_code" }
    type: "many-to-one"
  - from: { file: "series", column: "case_type_code" }
    to: { file: "case_type", column: "case_type_code" }
    type: "many-to-one"
  - from: { file: "series", column: "area_code" }
    to: { file: "area", column: "area_code" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
  required_fields:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "supersector_code", "industry_code", "data_type_code", "case_type_code", "area_code", "begin_year", "begin_period", "end_year", "end_period"] }

types:
  Year: { base: "int32", range: [2000, 2067] }
  Rate: { base: "decimal", precision: 18, scale: 4 }
  Code: { base: "string", max_length: 10 }