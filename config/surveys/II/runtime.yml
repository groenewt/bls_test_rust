# II Survey Runtime Configuration
# Feature flags, env overrides mapping, logging
config_version: 1

feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  enable_checkpoints: true  # Enable checkpoints for large-sized data
  enable_statistics_collection: true
  enable_profiling: false

environment_overrides:
  - key: "BLS_II_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_PARTITION_STRATEGY"
    maps_to: "partition_hints.strategy"
  - key: "BLS_MAX_THREADS"
    maps_to: "resources.max_threads"
  - key: "BLS_CHUNK_SIZE_MB"
    maps_to: "io.chunk_size_mb"

logging:
  level: "info"  # trace|debug|info|warn|error
  structured: true

# Checkpoint settings for large dataset processing
checkpoint:
  enabled: true
  interval_records: 100000
  checkpoint_dir: "checkpoints/ii"

# Error recovery settings
error_recovery:
  on_error: "continue"  # Continue processing other records
  max_errors: 5000      # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "ii_errors.log"
# Performance monitoring
monitoring:
  enabled: true  # Required field for MonitoringConfig
  metrics_endpoint: null
  health_check_interval: 60
