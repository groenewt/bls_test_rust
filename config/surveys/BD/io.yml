# BD Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/bd"
  include: ["bd.series", "bd.data.*", "bd.county", "bd.dataclass", "bd.footnote", "bd.industry", "bd.msa", "bd.sizeclass", "bd.state"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year", "state_code"]

mmap:
  enable_for_mb_greater_than: 100

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
