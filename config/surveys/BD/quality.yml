# BD Survey Quality Configuration
# Data quality expectations, validations, and thresholds
config_version: 1

# Required checks field for QualityConfig
checks:
  - name: "series_id_not_null"
    check_type: "completeness"
    parameters:
      columns: ["series_id"]
    severity: "error"
  
  - name: "year_range_check" 
    check_type: "validity"
    parameters:
      column: "year"
      min: 1992
      max: 2055
    severity: "error"
    
  - name: "unique_series_combination"
    check_type: "uniqueness"
    parameters:
      columns: ["series_id", "year", "period"]
    severity: "error"

# Required validation field for QualityConfig
validation:
  strict_mode: true
  fail_on_error: false
  max_errors: 2000

expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "seasonal", "state_code", "county_code", "industry_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 1992, max: 2055 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "series", column: "begin_year", min: 1992, max: 2067 }
    - { file: "series", column: "end_year", min: 1992, max: 2067 }
  
  enums:
    - { file: "main", column: "period", values: ["Q01", "Q02", "Q03", "Q04"] }
    - { file: "series", column: "begin_period", values: ["Q01", "Q02", "Q03", "Q04"] }
    - { file: "series", column: "end_period", values: ["Q01", "Q02", "Q03", "Q04"] }
  
  regex:
    - { file: "series", column: "series_id", pattern: "^BD[SU]\\d{28}$" }
    - { file: "series", column: "state_code", pattern: "^[0-9]{2}$" }
    - { file: "series", column: "county_code", pattern: "^[0-9]{3}$" }
    - { file: "series", column: "industry_code", pattern: "^[0-9]{6}$" }
  
  length:
    - { file: "series", column: "series_id", exact: 30 }
    - { file: "series", column: "state_code", exact: 2 }
    - { file: "series", column: "county_code", exact: 3 }
    - { file: "series", column: "industry_code", exact: 6 }
  
  lookup_exists:
    - { file: "series", column: "state_code", lookup_table: "state" }
    - { file: "series", column: "county_code", lookup_table: "county" }
    - { file: "series", column: "industry_code", lookup_table: "industry" }
    - { file: "series", column: "msa_code", lookup_table: "msa" }
    - { file: "series", column: "sizeclass_code", lookup_table: "sizeclass" }
    - { file: "series", column: "dataclass_code", lookup_table: "dataclass" }
  
  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }
    - { file: "series", validation: "(end_year > begin_year) OR (end_year == begin_year AND end_period >= begin_period)", message: "End date must be after or equal to begin date" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "distinct(state_code)", "distinct(industry_code)"]
  persist: true

policy:
  mode: "continue"
  max_errors: 2000
  sample_on_fail_rows: 50
  log_errors: true
  error_file: "bd_errors.log"

actions:
  value_range_violation: "flag"
  year_range_violation: "reject"
  series_id_format_violation: "flag"
  period_enum_violation: "flag"
  state_code_format_violation: "flag"
  county_code_format_violation: "flag"
  industry_code_format_violation: "flag"
  lookup_missing: "flag"
  cross_field_violation: "reject"
  length_violation: "reject"
  required_field_missing: "reject"