# MW Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/mw"
  include: ["mw.series", "mw.data.*", "mw.area", "mw.item", "mw.contacts"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 50

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 1000
  partition_by: ["year", "area_code"]

mmap:
  enable_for_mb_greater_than: 200

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
