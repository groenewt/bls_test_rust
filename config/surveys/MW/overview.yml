definition: |
  The following is a definition of: CONSUMER PRICE INDEX - Urban Wage Earners and Clerical Workers (MW)

  Survey Description: The Consumer Price Index (CPI) is a statistical measure
  of change, over time, of the prices of goods and services in major 
  expenditure groups--such as food, housing, apparel, transportation, and 
  medical care--typically purchased by urban consumers. Essentially, it 
  compares the cost of a sample "market basket" of goods and services in a 
  specific month relative to the cost of the same "market basket" in an 
  earlier reference period. This reference period is designated as the base 
  period.

  The CPI introduced by the BLS in 1987 includes indexes for two 
  populations; urban wage earners and clerical workers (MW), and all urban 
  consumers (MU).

  Summary Data Available: U.S. average indexes for both populations are 
  available for about 350 consumer items and groups of items. In addition, 
  over 100 of the indexes have been adjusted for seasonality. The indexes 
  are monthly with some beginning in 1913.

  Area indexes are available for 27 urban places with about 65 items and groups
  per area. Regional indexes are available for four regions with about 95 items
  and groups per region. City-size indexes are available for four size classes
  with about 95 items and groups per class.