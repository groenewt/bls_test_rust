  name: "Consumer Price Index - Urban Wage Earners and Clerical Workers"
  description: "The Consumer Price Index (CPI) is a statistical measure of change, over time, of the prices of goods and services in major expenditure groups typically purchased by urban consumers. This index covers urban wage earners and clerical workers."
  size_class: "large"
  characteristics:
    frequency: "monthly"
    coverage: "U.S. average indexes for about 350 consumer items and groups, area indexes for 27 urban places, regional and city-size classifications"
    time_series_count: "Consumer Price Index series for urban wage earners and clerical workers"
    classification_system: "Consumer expenditure categories (food, housing, apparel, transportation, medical care, etc.)"
