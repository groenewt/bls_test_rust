# LN Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/ln"
  include: [
    "ln.series",
    "ln.data.*",
    "ln.periodicity",
    "ln.seasonal",
    "ln.footnote",
    "ln.sexs",
    "ln.race",
    "ln.ages",
    "ln.education",
    "ln.occupation",
    "ln.indy",
    "ln.class",
    "ln.lfst",
    "ln.tdat",
    "ln.orig"
  ]
  exclude: ["*.tmp", ".*", "*~", "*.bak"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 25

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year"]
  
mmap:
  enable_for_mb_greater_than: 200
  
# Lookup file loading strategy
lookup_config:
  preload: ["seasonal", "periodicity", "sexs", "race"]  # small, frequently used
  lazy: ["footnote", "ages", "education", "occupation", "indy", "class", "lfst", "orig", "tdat"]  # load on demand
  mmap: []  # use for large files if any
  cache_all: true  # small enough to keep in memory

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
