tags: ["government_employment", "state_local", "quarterly", "payroll", "employment"]

definition: |
  The following is a definition of: State and Local Government Employment and Payrolls (SI)

  Survey Description: The State and Local Government Employment and Payrolls survey 
  collects quarterly employment and payroll data from state and local government units. 
  The survey covers employment by function for all 50 states and the District of Columbia.

  Data are collected through quarterly surveys covering employment counts and payroll 
  totals by government function categories including education, highways, public welfare, 
  hospitals, police protection, fire protection, corrections, parks and recreation, 
  and other functions.

  Summary Data Available: Employment and payroll data for state and local governments
  by function and geographic area. Data include full-time and part-time employment
  counts and total payroll amounts.

  Frequency of Observations: All data are quarterly; monthly data are not available.

  Data Characteristics: Employment data are reported in thousands of employees.
  Payroll data are reported in thousands of dollars.

  Updating Schedule: Updates become available with the quarterly release of new data, 
  typically 2-3 months after the reference quarter.
