# EP Survey Data Model Configuration
# Data model: files, schemas, relationships
config_version: 1

series:
  path: "ep.series"
  index: "series_id"
  estimated_size_gb: 0.1
  schema:
    series_id:
      type: "string"
      length: 15
      nullable: false
      example_value: "EPU516041451110"
    seasonal:
      type: "string"
      length: 1
      nullable: false
      example_value: "U"
    occupation_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "516041"
    industry_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "451110"
    series_title:
      type: "string"
      length: 200
      nullable: true
      example_value: "Employment projections for Shoe and leather workers and repairers in Sporting goods stores"
    footnote_codes:
      type: "string"
      length: 10
      nullable: true
      example_value: ""
    begin_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2022"
    begin_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"
    end_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2032"
    end_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"

data_files:
  - id: "main"
    pattern: "ep.data.*"
    index: "series_id"
    estimated_size_gb: 0.2
    schema:
      series_id:
        type: "string"
        length: 15
        nullable: false
        example_value: "EPU516041451110"
      year:
        type: "int32"
        min: 2000
        max: 2050
        nullable: false
        example_value: 2032
      period:
        type: "string"
        length: 3
        pattern: "^(A\\d{2})$"
        nullable: false
        example_value: "A01"
      value:
        type: "decimal"
        precision: 18
        scale: 4
        nullable: true
        example_value: 25.4
      footnote_codes:
        type: "string"
        length: 10
        nullable: true
        example_value: ""

lookups:
  - id: "occupation"
    path: "ep.occupation"
    index: "occupation_code"
    description: "Maps occupation codes to occupation names"
    schema:
      occupation_code:
        type: "string"
        length: 6
        nullable: false
        example_value: "516041"
      occupation_name:
        type: "string"
        length: 200
        nullable: false
        example_value: "Shoe and leather workers and repairers"
      display_level:
        type: "string"
        length: 1
        nullable: false
        example_value: "0"
      selectable:
        type: "string"
        length: 1
        nullable: false
        example_value: "T"
      sort_sequence:
        type: "string"
        length: 5
        nullable: false
        example_value: "516041"

  - id: "industry"
    path: "ep.industry"
    index: "industry_code"
    description: "Maps industry codes to industry names"
    schema:
      industry_code:
        type: "string"
        length: 6
        nullable: false
        example_value: "451110"
      industry_name:
        type: "string"
        length: 200
        nullable: false
        example_value: "Sporting goods stores"
      display_level:
        type: "string"
        length: 1
        nullable: false
        example_value: "0"
      selectable:
        type: "string"
        length: 1
        nullable: false
        example_value: "T"
      sort_sequence:
        type: "string"
        length: 6
        nullable: false
        example_value: "451110"

  - id: "footnote"
    path: "ep.footnote"
    index: "footnote_code"
    description: "Maps footnote codes to footnote text"
    schema:
      footnote_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "C"
      footnote_text:
        type: "string"
        length: 500
        nullable: true
        example_value: ""

relationships:
  - from: { file: "main", column: "series_id" }
    to: { file: "series", column: "series_id" }
    type: "many-to-one"
  - from: { file: "series", column: "occupation_code" }
    to: { file: "occupation", column: "occupation_code" }
    type: "many-to-one"
  - from: { file: "series", column: "industry_code" }
    to: { file: "industry", column: "industry_code" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "occupation", columns: ["occupation_code"] }
    - { file: "industry", columns: ["industry_code"] }
    - { file: "footnote", columns: ["footnote_code"] }
  required_fields:
    - { file: "series", columns: ["series_id", "seasonal", "occupation_code", "industry_code", "begin_year", "begin_period", "end_year", "end_period"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
