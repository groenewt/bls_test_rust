definition: |
  The following is a definition of: EMPLOYMENT PROJECTIONS

  Program Description: Bureau of Labor Statistics projections of industry and occupational employment
  are developed in a series of six interrelated steps, each of which is based on 
  a different procedure or model and assumptions: labor force, aggregate economy,
  final demand (GDP) by consuming sector and product, industry output, industry 
  employment, and employment and openings by occupation. The results produced by
  each step are key inputs to following steps, and the sequence may be repeated 
  multiple times to allow feedback and to ensure consistency.

  Summary Data Available: The Employment Projections program develops employment, projected 
  employment, employment change, job openings, education, training, and wage
  data for each detailed National Employment Matrix occupation. Employment, projected 
  employment, and employment change data are also available for summary occupations.

  Updates: The database is updated twice per year; wages are updated in April and projections are updated in September.
