# CH Survey Runtime Configuration
config_version: 1

feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  enable_parallel_processing: true
  enable_lookup_caching: true
  enable_statistics_collection: true
  enable_profiling: false

environment_overrides:
  - key: "BLS_CH_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_CH_MAX_THREADS"
    maps_to: "resources.max_threads"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_PARTITION_STRATEGY"
    maps_to: "partition_hints.strategy"
  - key: "BLS_CH_CHUNK_SIZE_MB"
    maps_to: "io.chunk_size_mb"
  - key: "BLS_CH_USE_MMAP"
    maps_to: "features.use_mmap"

logging:
  level: "info"  # trace|debug|info|warn|error
  structured: true
  
development:
  enable_debug_output: false
  save_intermediate_files: false
  verbose_logging: false