# CH Survey Processing Configuration
config_version: 1

strategy:
  mode: "mmap"  # Memory mapping strategy for large files
  max_concurrency: 1

resources:
  max_threads: 8  # Higher parallelization for large dataset
  memory_limit_gb: 16
  
io:
  chunk_size_mb: 100  # Larger chunks for large files
  buffer_pool_size: 16

features:
  use_mmap: true  # Benefit from mmap for large files
  enable_statistics: true
  enable_profiling: true

transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_decimal(value, 18, 10)"
  - id: "validate_series_id"
    expr: "match(series_id, '^CH[US][0-9A-Z]{15}$')"