config_version: 1
format: "parquet"
parquet:
  compression: "snappy"
  compression_level: 3
  row_group_size: 50000
  enable_dictionary: true
  bloom_filters: false

partitioning:
  partition_by: ["year"]
  max_file_size_mb: 512

naming:
  dataset: "bls_ci"
  version: "v1"

evolution:
  mode: "compatible"
  allow_nullability_change: false

destination:
  base_path: "data/processed/bls/CI"