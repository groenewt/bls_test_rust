# LE Survey Data Model Configuration
# Data model: files, schemas, relationships
config_version: 1

series:
  path: "le.series"
  index: "series_id"
  estimated_size_gb: 0.02
  schema:
    series_id:
      type: "string"
      length: 17
      nullable: false
      example_value: "LEU0000000000"
    area_code:
      type: "string"
      length: 4
      nullable: false
      example_value: "0000"
    item_code:
      type: "string"
      length: 7
      nullable: false
      example_value: "0000000"
    series_title:
      type: "string"
      length: 200
      nullable: true
      example_value: "LE series title"
    footnote_codes:
      type: "string"
      length: 10
      nullable: true
      example_value: ""
    begin_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "1980"
    begin_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "M01"
    end_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2025"
    end_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "M06"

data_files:
  - id: "main"
    pattern: "le.data.*"
    index: "series_id"
    estimated_size_gb: 0.2
    schema:
      series_id:
        type: "string"
        length: 17
        nullable: false
        example_value: "LEU0000000000"
      year:
        type: "int32"
        min: 1900
        max: 2100
        nullable: false
        example_value: 2025
      period:
        type: "string"
        length: 3
        pattern: "^(M\\d{2}|Q\\d{2}|A01)$"
        nullable: false
        example_value: "M06"
      value:
        type: "decimal"
        precision: 18
        scale: 4
        nullable: true
        example_value: 123.4567
      footnote_codes:
        type: "string"
        length: 10
        nullable: true
        example_value: ""

lookups:
  - id: "area"
    path: "le.area"
    index: "area_code"
    description: "Area lookup table"
    schema:
      area_code:
        type: "string"
        length: 4
        nullable: false
        example_value: "A100"
      area_name:
        type: "string"
        length: 80
        nullable: false
        example_value: "U.S. city average"

  - id: "footnote"
    path: "le.footnote"
    index: "footnote_code"
    description: "Footnotes"
    schema:
      footnote_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "C"
      footnote_text:
        type: "string"
        length: 100
        nullable: true
        example_value: "context note"

  - id: "item"
    path: "le.item"
    index: "item_code"
    description: "Item lookup table"
    schema:
      item_code:
        type: "string"
        length: 7
        nullable: false
        example_value: "0000000"
      item_name:
        type: "string"
        length: 100
        nullable: false
        example_value: "Item name"

  - id: "period"
    path: "le.period"
    index: "period"
    description: "Period of observation"
    schema:
      period:
        type: "string"
        length: 3
        nullable: false
        example_value: "M01"
      period_abbr:
        type: "string"
        length: 5
        nullable: false
        example_value: "JAN"
      period_name:
        type: "string"
        length: 20
        nullable: false
        example_value: "January"

relationships:
  - from: { file: "main", column: "series_id" }
    to: { file: "series", column: "series_id" }
    type: "many-to-one"
  - from: { file: "series", column: "area_code" }
    to: { file: "area", column: "area_code" }
    type: "many-to-one"
  - from: { file: "series", column: "item_code" }
    to: { file: "item", column: "item_code" }
    type: "many-to-one"
  - from: { file: "main", column: "period" }
    to: { file: "period", column: "period" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "area", columns: ["area_code"] }
    - { file: "footnote", columns: ["footnote_code"] }
    - { file: "item", columns: ["item_code"] }
    - { file: "period", columns: ["period"] }
  required_fields:
    - { file: "series", columns: ["series_id", "area_code", "item_code"] }
    - { file: "main", columns: ["series_id", "year", "period"] }

types:
  LESeriesId: { base: "string", length: 17, pattern: "^LE[0-9A-Z]+$" }
  LEAreaCode: { base: "string", length: 4, pattern: "^[0-9A-Z]{4}$" }
  LEItemCode: { base: "string", length: 7, pattern: "^[0-9]{6,7}$" }
  LEPeriod: { base: "string", length: 3, pattern: "^(M\\d{2}|Q\\d{2}|A01)$" }
  LEValue: { base: "decimal", precision: 18, scale: 4 }
