config_version: 1
expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "category_code", "datatype_code", "case_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 2011, max: 2067 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "series", column: "begin_year", min: 2011, max: 2067 }
    - { file: "series", column: "end_year", min: 2011, max: 2067 }
  
  enums:
    - { file: "main", column: "period", values: ["A01", "Q01", "Q02", "Q03", "Q04"] }
    - { file: "series", column: "begin_period", values: ["A01", "Q01", "Q02", "Q03", "Q04"] }
    - { file: "series", column: "end_period", values: ["A01", "Q01", "Q02", "Q03", "Q04"] }
  
  regex:
    - { file: "main", column: "series_id", pattern: "^cs[U]\\d{15}$" }
    - { file: "series", column: "series_id", pattern: "^cs[U]\\d{15}$" }
  
  length:
    - { file: "main", column: "series_id", exact: 17 }
    - { file: "series", column: "series_id", exact: 17 }
    - { file: "series", column: "category_code", exact: 3 }
    - { file: "series", column: "datatype_code", exact: 1 }
    - { file: "series", column: "case_code", exact: 1 }
  
  cross_field:
    - field: "end_year"
      rule: "greater_than_or_equal"
      compare_field: "begin_year"
      file: "series"
      message: "End year must be >= begin year"

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "min(year)", "max(year)", "distinct(category_code)"]
  persist: true

policy:
  mode: "fail_on_error"  # warn_only|fail_on_error
  sample_on_fail_rows: 50
  max_errors: 5000  # Stop if too many errors (increased for larger dataset)

validation_rules:
  data_file:
    # Value validation
    - field: "value"
      rule: "range"
      min: -10000000000000000.0
      max: 10000000000000000.0
      action: "flag"  # Flag but don't reject
    
    # Year validation
    - field: "year"
      rule: "range"
      min: 2011
      max: 2055
      action: "reject"
    
    # Series ID validation
    - field: "series_id"
      rule: "pattern"
      pattern: "^cs[U]\\d{15}$"
      action: "flag"
    
    # Period validation
    - field: "period"
      rule: "values"
      allowed: ["A01", "Q01", "Q02", "Q03", "Q04"]
      action: "flag"
  
  series_file:
    # Series ID validation
    - field: "series_id"
      rule: "pattern"
      pattern: "^cs[U]\\d{15}$"
      action: "flag"
      message: "Invalid series ID format: should be cs[U] followed by 15 digits"
    
    - field: "series_id"
      rule: "length"
      exact: 17
      action: "reject"
      message: "Series ID must be exactly 17 characters"
    
    - field: "series_id"
      rule: "required"
      action: "reject"
      message: "Series ID cannot be null"
    
    # Begin year validation
    - field: "begin_year"
      rule: "range"
      min: 2011
      max: 2067
      action: "reject"
      message: "Begin year must be between 2011 and 2067"
    
    - field: "begin_year"
      rule: "numeric"
      action: "reject"
      message: "Begin year must be numeric"
    
    # End year validation
    - field: "end_year"
      rule: "range"
      min: 2011
      max: 2067
      action: "reject"
      message: "End year must be between 2011 and 2067"
    
    - field: "end_year"
      rule: "numeric"
      action: "reject"
      message: "End year must be numeric"
    
    - field: "end_year"
      rule: "greater_than_or_equal"
      compare_field: "begin_year"
      action: "reject"
      message: "End year must be >= begin year"
    
    # Begin period validation
    - field: "begin_period"
      rule: "values"
      allowed: ["A01", "Q01", "Q02", "Q03", "Q04"]
      action: "flag"
      message: "Invalid begin period value"
    
    # End period validation
    - field: "end_period"
      rule: "values"
      allowed: ["A01", "Q01", "Q02", "Q03", "Q04"]
      action: "flag"
      message: "Invalid end period value"

completeness:
  required_fields:
    main: ["series_id", "year", "period"]
    series: ["series_id", "category_code", "datatype_code", "case_code", "begin_year", "begin_period", "end_year", "end_period"]
  nullable_fields:
    main: ["value", "footnote_codes"]
    series: ["footnote_codes"]

uniqueness:
  constraints:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }