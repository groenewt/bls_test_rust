config_version: 1
strategy:
  mode: "mmap"  # Use memory mapping for large files
  max_concurrency: 1

resources:
  max_threads: 8  # Increased parallelization for large-sized data
  memory_limit_gb: 16
  
io:
  chunk_size_mb: 100
  buffer_pool_size: 16
  
features:
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: false

transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_decimal(value, 18, 4)"
  - id: "validate_series_id"
    expr: "series_id matches '^cs[U]\\d{15}$'"