definition: |
  The following is a definition of: PRODUCER PRICE INDEX REVISION (PD)

  Survey Description: The Producer Price Index Revision indexes reflect
  price movements for the net outputs of producers organized according to the 
  Standard Industrial Classification System (SIC). Thus, the PC 
  (current indexes) and PD (discontinued indexes) are compatible with a 
  wide assortment of economic time series including: productivity, 
  production, employment, wages, and earnings. Producer Price Index coverage
  currently includes nearly all industries in the goods-producing sectors of
  the American economy--mining, manufacturing, agriculture, fishing, and 
  forestry--as well as gas, electricity, and goods competitive with those made
  in the producing sectors, such as waste and scrap materials.

  The PD database contains times series data that are not in calculation. 
  Every January and July, the database is updated to include historical data 
  for newly discontinued time series. Coverage includes over 500 mining and 
  manufacturing industries and approximately 50 services industries.

  BLS collects over 100,000 price quotations each month covering over 500 
  industries and over 10,000 products and product categories. All indexes 
  are stored with one decimal place.