# PD Survey Production Environment Overrides
config_version: 1

# Production-specific processing settings
processing:
  features:
    enable_profiling: false
    enable_statistics: true

# Production output settings
output:
  destination:
    base_path: "data/processed/bls/PD"

# Production quality settings
quality:
  policy:
    mode: "continue"  # Continue processing for large survey but log all errors
    sample_on_fail_rows: 100

# Production runtime settings
runtime:
  logging:
    level: "warn"  # Less verbose logging in production
  development:
    enable_debug_output: false
    save_intermediate_files: false
    verbose_logging: false
  feature_flags:
    enable_hot_reloads: false
  monitoring:
    enable_metrics: true
    track_memory_usage: true
    track_processing_time: true