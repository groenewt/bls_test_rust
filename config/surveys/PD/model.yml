# PD Survey Data Model Configuration
# Data model: files, schemas, relationships
config_version: 1

series:
  path: "pd.series"
  index: "series_id"
  estimated_size_gb: 0.3
  schema:
    series_id:
      type: "string"
      length: 17
      nullable: false
      example_value: "PDU1011#122"
    industry_code:
      type: "string"
      length: 4
      nullable: false
      example_value: "1011"
    product_code:
      type: "string"
      length: 9
      nullable: false
      example_value: "#122"
    seasonal:
      type: "string"
      length: 1
      nullable: false
      example_value: "U"
    bench_date:
      type: "string"
      length: 4
      nullable: false
      example_value: "8412"
    begin_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "1984"
    begin_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "M12"
    end_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "1989"
    end_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "M13"

data_files:
  - id: "main"
    pattern: "pd.data.*"
    index: "series_id"
    estimated_size_gb: 2.0
    schema:
      series_id:
        type: "string"
        length: 17
        nullable: false
        example_value: "PDU1011#122"
      year:
        type: "int32"
        min: 1900
        max: 2100
        nullable: false
        example_value: 1994
      period:
        type: "string"
        length: 3
        pattern: "^(M\\d{2}|Q\\d{2}|S\\d{2})$"
        nullable: false
        example_value: "M01"
      value:
        type: "decimal"
        precision: 18
        scale: 1
        nullable: true
        example_value: 82.0
      footnote_codes:
        type: "string"
        length: 10
        nullable: true
        example_value: ""

lookups:
  - id: "footnote"
    path: "pd.footnote"
    index: "footnote_code"
    description: "Maps footnote codes to footnote text"
    schema:
      footnote_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "P"
      footnote_text:
        type: "string"
        length: 100
        nullable: true
        example_value: "Preliminary"

  - id: "industry"
    path: "pd.industry"
    index: "industry_code"
    description: "Maps industry codes to industry names"
    schema:
      industry_code:
        type: "string"
        length: 4
        nullable: false
        example_value: "1011"
      industry_name:
        type: "string"
        length: 100
        nullable: false
        example_value: "Iron ores"

  - id: "period"
    path: "pd.period"
    index: "period_code"
    description: "Maps period codes to period names"
    schema:
      period_code:
        type: "string"
        length: 3
        nullable: false
        example_value: "M01"
      period_abbr:
        type: "string"
        length: 5
        nullable: false
        example_value: "JAN"
      period_name:
        type: "string"
        length: 20
        nullable: false
        example_value: "January"

  - id: "product"
    path: "pd.product"
    index: "product_code"
    description: "Maps product codes to product names"
    schema:
      product_code:
        type: "string"
        length: 9
        nullable: false
        example_value: "#122"
      product_name:
        type: "string"
        length: 200
        nullable: false
        example_value: "Crude iron ore and iron ore concentrates"

relationships:
  - from: { file: "main", column: "series_id" }
    to: { file: "series", column: "series_id" }
    type: "many-to-one"
  - from: { file: "series", column: "industry_code" }
    to: { file: "industry", column: "industry_code" }
    type: "many-to-one"
  - from: { file: "series", column: "product_code" }
    to: { file: "product", column: "product_code" }
    type: "many-to-one"
  - from: { file: "main", column: "period" }
    to: { file: "period", column: "period_code" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "footnote", columns: ["footnote_code"] }
    - { file: "industry", columns: ["industry_code"] }
    - { file: "period", columns: ["period_code"] }
    - { file: "product", columns: ["product_code"] }
  required_fields:
    - { file: "series", columns: ["series_id", "industry_code", "product_code", "seasonal", "begin_year", "begin_period", "end_year", "end_period"] }
    - { file: "main", columns: ["series_id", "year", "period"] }

types:
  PDSeriesId: { base: "string", length: 17, pattern: "^PD[US]\\d{4}#\\d+$" }
  PDIndustryCode: { base: "string", length: 4, pattern: "^\\d{4}$" }
  PDProductCode: { base: "string", length: 9, pattern: "^#\\d+$" }
  PDPeriod: { base: "string", length: 3, pattern: "^(M\\d{2}|Q\\d{2}|S\\d{2})$" }
  PDValue: { base: "decimal", precision: 18, scale: 1 }