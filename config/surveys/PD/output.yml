# PD Survey Output Configuration
# Output formats, partitioning, compression
config_version: 1

# Required formats field as array
formats: ["csv"]

# Required output directory and filename pattern
output_dir: "data/processed/bls/PD"
filename_pattern: "{survey}_{table}_{timestamp}"
create_subdirs: true

csv:
  delimiter: ","
  quote_char: "\""
  escape_char: "\\"
  header: true
  null_value: ""

partitioning:
  enabled: true
  partition_by: ["year", "industry_code"]
  max_file_size_mb: 1024

naming:
  dataset: "bls_pd"
  version: "v1"

evolution:
  mode: "compatible"
  allow_nullability_change: false

destination:
  base_path: "data/processed/bls/PD"

transformations:
  sort_by: ["series_id", "year", "period"]
  deduplicate: true
  deduplicate_on: ["series_id", "year", "period", "footnote_codes"]

statistics:
  enabled: true
  columns: ["year", "period", "value"]