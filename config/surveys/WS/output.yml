# WS Survey Output Configuration
# Output formats, partitioning, compression
config_version: 1

# Required formats field as array
formats: ["csv"]

# Required output directory and filename pattern
output_dir: "data/processed/bls/WS"
filename_pattern: "{survey}_{table}_{timestamp}"
create_subdirs: true

csv:
  delimiter: ","
  quote_char: "\""
  escape_char: "\\"
  header: true
  null_value: ""

partitioning:
  enabled: false
  partition_by: []
  max_file_size_mb: 512

naming:
  dataset: "bls_ws"
  version: "v1"

evolution:
  mode: "compatible"
  allow_nullability_change: false

destination:
  base_path: "data/processed/bls/WS"

transformations:
  sort_by: ["series_id", "year", "period"]
  deduplicate: true
  deduplicate_on: ["series_id", "year", "period", "footnote_codes"]

statistics:
  enabled: true
  columns: ["year", "period", "value"]

data_series:
  basic_load:
    format: "csv"
    partitioning:
      enabled: false
    transformations:
      sort_by: ["series_id", "year", "period"]
      deduplicate: true
      deduplicate_on: ["series_id", "year", "period", "footnote_codes"]
    statistics:
      enabled: true
      columns: ["year", "period", "value"]

data_dict:
  basic_load:
    format: "csv"
    output_file: "ws_series_dict.csv"
    partitioning:
      enabled: false
    mapping:
      measure_code:
        lookup_table: "measure"
        lookup_key: "measure_code"
        lookup_value: "measure_text"
        create_field: "measure_name"
        on_missing: "UNKNOWN_MEASURE"
        cache: true
      seasonal:
        lookup_table: "seasonal"
        lookup_key: "seasonal_code"
        lookup_value: "seasonal_text"
        create_field: "seasonal_name"
        on_missing: "UNKNOWN_SEASONAL"
        cache: true
      begin_period:
        lookup_table: "period"
        lookup_key: "period"
        lookup_value: "period_name"
        create_field: "begin_period_name"
        on_missing: "keep_original"
        cache: true
      end_period:
        lookup_table: "period"
        lookup_key: "period"
        lookup_value: "period_name"
        create_field: "end_period_name"
        on_missing: "keep_original"
        cache: true
      footnote_codes:
        lookup_table: "footnote"
        lookup_key: "footnote_code"
        lookup_value: "footnote_text"
        create_field: "footnote_texts"
        multiple: true
        separator: " "
        on_missing: "skip"
        cache: true
    transformations:
      sort_by: ["series_id"]
      deduplicate: false
      deduplicate_on: ["series_id"]
    statistics:
      enabled: true
      columns: ["series_id", "measure_code", "begin_year", "end_year"]
      output_file: "ws_series_dict_stats.json"