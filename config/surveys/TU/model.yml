      footnote_text: { type: "string", length: 100, nullable: false }

relationships:
  - from: { file: "main", column: "series_id" }
    to: { file: "series", column: "series_id" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
  required_fields:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "stattype_code", "datays_code"] }

types:
  aliases:
    Year: { base: "int32", range: [2003, 2055] }
    TimeUseValue: { base: "decimal", precision: 18, scale: 4 }