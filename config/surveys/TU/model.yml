  - id: "ecytd"
    path: "tu.ecytd"
    index: "ecytd_code"
    schema:
      ecytd_code: { type: "string", length: 1, nullable: false }
      ecytd_text: { type: "string", length: 100, nullable: false }
  
  - id: "elder"
    path: "tu.elder"
    index: "elder_code"
    schema:
      elder_code: { type: "string", length: 1, nullable: false }
