  - id: "pertype"
    path: "tu.pertype"
    index: "pertype_code"
    schema:
      pertype_code: { type: "string", length: 2, nullable: false }
      pertype_text: { type: "string", length: 100, nullable: false }
  
  - id: "footnote"
    path: "tu.footnote"
    index: "footnote_code"
    schema:
