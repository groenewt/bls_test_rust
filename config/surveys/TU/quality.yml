# TU Survey Quality Configuration
# Data quality expectations, validations, and thresholds
config_version: 1
expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "stattype_code", "datays_code"] }
  ranges:
    - { file: "main", column: "year", min: 2003, max: 2055 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
  enums:
    - { file: "series", column: "seasonal", values: ["S", "U"] }
  regex:
    - { file: "main", column: "period", pattern: "^(A01|Q0[1-4])$" }
    - { file: "series", column: "series_id", pattern: "^TU[U]\\d{16}$" }
  uniqueness:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "min(year)", "max(year)"]
  persist: true
policy:
  mode: "fail_on_error"
  sample_on_fail_rows: 50
  max_errors: 1000

row_count:
  min: 1
  warn_below: 1000
