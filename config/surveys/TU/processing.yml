# TU Survey Processing Configuration
# Strategy, resources, chunking, mmap, cache
config_version: 1

# Direct strategy value (not nested)
strategy: "chunked"

# Flattened configuration fields
max_threads: 4
chunk_size: 52428800  # 50MB in bytes
memory_limit: 8192    # 8GB in MB
parallel: true        # Multi-threaded processing

# Chunking configuration
chunking:
  size: 52428800      # 50MB in bytes
  strategy: "sequential"
  overlap: null

# Memory mapping configuration
mmap:
  enabled: true
  threshold: null
  prefetch: null

# Cache configuration  
cache:
  enabled: true
  size: 8388608       # 8MB cache size
  ttl: 3600           # 1 hour TTL

# Preserved transforms
transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_decimal(value, 18, 4)"