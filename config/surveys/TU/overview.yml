definition: |
  The following is a definition of: AMERICAN TIME USE SURVEY

  Program Description: The American Time Use Survey (ATUS) is the Nation's 
  first federally administered, continuous survey on time use in the United States. 
  The goal of the survey is to measure how people divide their time among life's activities.

  Summary Data Available: Time Use data are available for the civilian, 
  noninstitutional population age 15 and older living in private households. 
  Individuals are randomly selected from a subset of households that have completed 
  their eighth and final month of interviews for the Current Population Survey (CPS). 
  Data are collected on activities such as paid work, household activities, 
  eldercare, childcare, volunteer activities, socializing, sports, and leisure.