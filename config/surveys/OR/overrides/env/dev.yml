# OR Survey Development Environment Overrides
config_version: 1

# Development-specific processing settings
processing:
  features:
    enable_profiling: true  # Enable profiling in dev
    enable_statistics: true

# Development output settings
output:
  destination:
    base_path: "data/dev/processed/bls/OR"

# Development quality settings
quality:
  policy:
    mode: "warn_only"  # More lenient in development
    sample_on_fail_rows: 15  # Higher sample for OR complexity

# Development runtime settings
runtime:
  logging:
    level: "debug"  # More verbose logging in dev
  development:
    enable_debug_output: true
    save_intermediate_files: true
    verbose_logging: true
  feature_flags:
    enable_hot_reloads: true
    enable_occupational_debug: true  # OR-specific debug feature