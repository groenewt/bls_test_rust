# OR Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/or"
  include: [
    "or.series",
    "or.data.1.AllData",
    "or.additive",
    "or.aspect",
    "or.category",
    "or.datatype",
    "or.estimate",
    "or.footnote",
    "or.industry",
    "or.job_characteristic",
    "or.occupation",
    "or.ownership",
    "or.requirement",
    "or.seasonal"
  ]
  exclude: ["*.tmp", ".*", "*~", "*.bak"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 512
  partition_by: ["year"]
  
mmap:
  enable_for_mb_greater_than: 100
  
# Lookup file loading strategy
lookup_strategy:
  preload: ["occupation", "industry", "ownership"]  # frequently used
  lazy: ["footnote", "seasonal", "category", "datatype"]  # load on demand
  mmap: []
  cache_all: false
