# LU Survey IO Configuration
# Input discovery, patterns, partition hints (BLS YAML style for adapter)
config_version: 1

discovery:
  root: "data/raw/bls/lu"
  include: ["lu.series", "lu.data.*", "lu.footnote", "lu.period"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year"]

mmap:
  enable_for_mb_greater_than: 200

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
