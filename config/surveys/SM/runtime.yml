config_version: 1
feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  enable_statistics: true
  enable_profiling: true
  enable_checkpoints: true

environment_overrides:
  - key: "BLS_SM_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_SM_MAX_THREADS"
    maps_to: "resources.max_threads"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_PARTITION_STRATEGY"
    maps_to: "partition_hints.strategy"
  - key: "BLS_SM_CHUNK_SIZE_MB"
    maps_to: "io.chunk_size_mb"
  - key: "BLS_SM_USE_MMAP"
    maps_to: "features.use_mmap"
  - key: "BLS_SM_MAX_ERRORS"
    maps_to: "error_handling.max_errors"

logging:
  level: "info"
  structured: true

# Error handling configuration
error_handling:
  on_error: "continue"
  max_errors: 5000
  log_errors: true
  error_file: "sm_errors.log"
  
  checkpoint:
    enabled: true
    interval_records: 100000
    checkpoint_dir: "checkpoints/sm"

# Lookup configuration
lookup_config:
  preload: ["state", "area", "supersector"]
  lazy: ["footnote", "period", "industry", "data_type", "seasonal"]
  mmap: []
  cache_all: true