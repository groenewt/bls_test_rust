config_version: 1
# Production environment overrides for SM survey

# Full resources for production
resources:
  max_threads: 16
  memory_limit_gb: 16

# Large chunks for production efficiency
io:
  chunk_size_mb: 100
  buffer_pool_size: 16

# Disable profiling in production
features:
  enable_profiling: false

# Strict error handling for production
error_handling:
  on_error: "continue"
  max_errors: 5000

# Warning level logging for production
logging:
  level: "warn"

# Large partitions for production
partitioning:
  max_file_size_mb: 2048

# Production-specific checkpoint settings
checkpoint:
  enabled: true
  interval_records: 100000