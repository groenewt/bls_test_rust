config_version: 1
format: "parquet"
csv:
  delimiter: ","
  quote_char: "\""
  escape_char: "\\"
  header: true

partitioning:
  partition_by: ["year"]
  max_file_size_mb: 512

naming:
  dataset: "bls_sm"
  version: "v1"

evolution:
  mode: "compatible"
  allow_nullability_change: false

destination:
  base_path: "data/processed/bls/SM"

# Legacy output configurations for backward compatibility
data_series:
  basic_load:
    format: "csv"
    partitioning:
      enabled: true
      partition_by: ["year"]
    transformations:
      sort_by: ["series_id", "year", "period"]
      deduplicate: true
      deduplicate_on: ["series_id", "year", "period", "footnote_codes"]
    statistics:
      enabled: true
      columns: ["year", "period", "value"]

data_dict:
  basic_load:
    format: "csv"
    partitioning:
      enabled: false
    output_file: "sm_series_dict.csv"
    transformations:
      sort_by: ["series_id"]
      deduplicate: false
      deduplicate_on: ["series_id"]
    statistics:
      enabled: true
      columns: ["series_id", "state_code", "area_code", "industry_code", "begin_year", "end_year"]
      output_file: "sm_series_dict_stats.json"
    
    # Mapping configuration for lookups
    mapping:
      state_code:
        lookup_table: "state"
        lookup_key: "state_code"
        lookup_value: "state_name"
        create_field: "state_name"
        on_missing: "UNKNOWN_STATE"
        cache: true
      
      area_code:
        lookup_table: "area"
        lookup_key: "area_code"
        lookup_value: "area_name"
        create_field: "area_name"
        on_missing: "UNKNOWN_AREA"
        cache: true
      
      industry_code:
        lookup_table: "industry"
        lookup_key: "industry_code"
        lookup_value: "industry_name"
        create_field: "industry_name"
        on_missing: "UNKNOWN_INDUSTRY"
        cache: true
      
      supersector_code:
        lookup_table: "supersector"
        lookup_key: "supersector_code"
        lookup_value: "supersector_name"
        create_field: "supersector_name"
        on_missing: "UNKNOWN_SUPERSECTOR"
        cache: true
      
      data_type_code:
        lookup_table: "data_type"
        lookup_key: "data_type_code"
        lookup_value: "data_type_text"
        create_field: "data_type_text"
        on_missing: "UNKNOWN_DATA_TYPE"
        cache: true
      
      seasonal:
        lookup_table: "seasonal"
        lookup_key: "seasonal_code"
        lookup_value: "seasonal_text"
        create_field: "seasonal_text"
        on_missing: "UNKNOWN_SEASONAL"
        cache: true
      
      footnote_codes:
        lookup_table: "footnote"
        lookup_key: "footnote_code"
        lookup_value: "footnote_text"
        create_field: "footnote_texts"
        multiple: true
        separator: " "
        on_missing: "skip"
        cache: true