config_version: 1
expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "state_code", "area_code", "supersector_code", "industry_code", "data_type_code", "seasonal", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 1991, max: 2055 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "series", column: "begin_year", min: 1991, max: 2067 }
    - { file: "series", column: "end_year", min: 1991, max: 2067 }
  
  enums:
    - { file: "main", column: "period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12"] }
    - { file: "series", column: "begin_period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12"] }
    - { file: "series", column: "end_period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12"] }
  
  regex:
    - { file: "main", column: "series_id", pattern: "^SM[SU]\\d{28}$" }
    - { file: "series", column: "series_id", pattern: "^SM[SU]\\d{28}$" }
    - { file: "series", column: "state_code", pattern: "^[0-9]{2}$" }
    - { file: "series", column: "area_code", pattern: "^[0-9]{5}$" }
    - { file: "series", column: "industry_code", pattern: "^[0-9]{8}$" }
  
  length:
    - { file: "series", column: "series_id", exact: 30 }
    - { file: "series", column: "state_code", exact: 2 }
    - { file: "series", column: "area_code", exact: 5 }
    - { file: "series", column: "industry_code", exact: 8 }
  
  lookup_exists:
    - { file: "series", column: "state_code", lookup_table: "state" }
    - { file: "series", column: "area_code", lookup_table: "area" }
    - { file: "series", column: "industry_code", lookup_table: "industry" }
    - { file: "series", column: "supersector_code", lookup_table: "supersector" }
    - { file: "series", column: "data_type_code", lookup_table: "data_type" }
    - { file: "series", column: "seasonal", lookup_table: "seasonal" }
  
  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }
    - { file: "main", validation: "series_id IS NOT NULL AND year IS NOT NULL AND period IS NOT NULL", message: "Required fields cannot be null" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "min(year)", "max(year)", "distinct(state_code)", "distinct(area_code)"]
  persist: true

policy:
  mode: "fail_on_error"
  sample_on_fail_rows: 50

# Detailed validation rules with actions
validation_rules:
  data_series:
    - field: "value"
      rule: "range"
      min: -10000000000000000.0
      max: 10000000000000000.0
      action: "flag"
      message: "Value outside expected range"
    
    - field: "year"
      rule: "range"
      min: 1991
      max: 2055
      action: "reject"
      message: "Year must be between 1991 and 2055"
    
    - field: "series_id"
      rule: "pattern"
      pattern: "^SM[SU]\\d{28}$"
      action: "flag"
      message: "Invalid series ID format"
    
    - field: "period"
      rule: "values"
      allowed: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12"]
      action: "flag"
      message: "Invalid period value"

  series_dict:
    - field: "series_id"
      rule: "pattern"
      pattern: "^SM[SU]\\d{28}$"
      action: "flag"
      message: "Invalid series ID format: should be SM[S/U] followed by 28 digits"
    
    - field: "series_id"
      rule: "length"
      exact: 30
      action: "reject"
      message: "Series ID must be exactly 30 characters"
    
    - field: "series_id"
      rule: "required"
      action: "reject"
      message: "Series ID cannot be null"
    
    - field: "state_code"
      rule: "length"
      exact: 2
      action: "reject"
      message: "State code must be exactly 2 characters"
    
    - field: "state_code"
      rule: "pattern"
      pattern: "^[0-9]{2}$"
      action: "flag"
      message: "State code should be 2 digits"
    
    - field: "state_code"
      rule: "lookup_exists"
      lookup_table: "state"
      action: "flag"
      message: "State code not found in state lookup table"
    
    - field: "area_code"
      rule: "length"
      exact: 5
      action: "reject"
      message: "Area code must be exactly 5 characters"
    
    - field: "area_code"
      rule: "pattern"
      pattern: "^[0-9]{5}$"
      action: "flag"
      message: "Area code should be 5 digits"
    
    - field: "industry_code"
      rule: "length"
      exact: 8
      action: "reject"
      message: "Industry code must be exactly 8 characters"
    
    - field: "industry_code"
      rule: "pattern"
      pattern: "^[0-9]{8}$"
      action: "flag"
      message: "Industry code should be 8 digits"
    
    - field: "begin_year"
      rule: "range"
      min: 1991
      max: 2067
      action: "reject"
      message: "Begin year must be between 1991 and 2067"
    
    - field: "begin_year"
      rule: "numeric"
      action: "reject"
      message: "Begin year must be numeric"
    
    - field: "end_year"
      rule: "range"
      min: 1991
      max: 2067
      action: "reject"
      message: "End year must be between 1991 and 2067"
    
    - field: "end_year"
      rule: "numeric"
      action: "reject"
      message: "End year must be numeric"
    
    - field: "end_year"
      rule: "greater_than_or_equal"
      compare_field: "begin_year"
      action: "reject"
      message: "End year must be >= begin year"
    
    - field: "begin_period"
      rule: "values"
      allowed: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12"]
      action: "flag"
      message: "Invalid begin period value"
    
    - field: "end_period"
      rule: "values"
      allowed: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12"]
      action: "flag"
      message: "Invalid end period value"
    
    - field: "end_year"
      rule: "date_logic_check"
      check_fields: ["begin_year"]
      validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
      action: "flag"
      message: "End date must be after or equal to begin date"

# Completeness and uniqueness constraints
completeness:
  required_fields:
    data_series: ["series_id", "year", "period"]
    series_dict: ["series_id", "state_code", "area_code", "supersector_code", "industry_code", "data_type_code", "seasonal", "begin_year", "begin_period", "end_year", "end_period"]
  
  nullable_fields:
    data_series: ["value", "footnote_codes"]
    series_dict: ["footnote_codes"]

uniqueness:
  data_series: ["series_id", "year", "period", "footnote_codes"]
  series_dict: ["series_id"]