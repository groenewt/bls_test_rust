# JT Survey Input/Output Configuration
# Input discovery, patterns, partition hints (aligned to reference schema)
config_version: 1

discovery:
  root: "data/raw/bls/jt"
  include: [
    "jt.series",
    "jt.data.*",
    "jt.area",
    "jt.dataelement",
    "jt.footnote",
    "jt.industry",
    "jt.period",
    "jt.ratelevel",
    "jt.seasonal",
    "jt.sizeclass",
    "jt.state"
  ]
  exclude: ["*.tmp", ".*", "*~", "*.bak"]

combining:
  enabled: false
  strategy: "none"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "size_based"
  max_partition_size_mb: 256
  partition_by: []
  
mmap:
  enable_for_mb_greater_than: 200
  
lookup_strategy:
  preload: ["period", "ratelevel", "seasonal"]
  lazy: ["footnote"]
  mmap: ["industry"]
  cache_all: true
