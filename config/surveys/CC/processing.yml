# CC Survey Processing Configuration
# Strategy, resources, chunking, mmap, cache
config_version: 1

strategy:
  mode: "chunked"  # Process in chunks due to medium size
  max_concurrency: 1

resources:
  max_threads: 4  # Increased parallelization for medium-sized data
  memory_limit_gb: 16

io:
  chunk_size_mb: 50
  buffer_pool_size: 8

features:
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: false

transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_decimal(value, 18, 4)"
  - id: "clean_series_id"
    expr: "trim(series_id)"