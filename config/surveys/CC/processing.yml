# CC Survey Processing Configuration
# Strategy, resources, chunking, mmap, cache
config_version: 1

# Direct strategy value (not nested)
strategy: "chunked"

# Flattened configuration fields
max_threads: 4
chunk_size: 67108864  # 64MB in bytes
memory_limit: 8192    # 8GB in MB
parallel: true       # Multi-threaded for small-medium survey

# Chunking configuration
chunking:
  size: 67108864      # 64MB in bytes
  strategy: "sequential"
  overlap: null

# Memory mapping configuration
mmap:
  enabled: true       # Beneficial for CC survey
  threshold: null
  prefetch: null

# Cache configuration  
cache:
  enabled: true
  size: 8388608       # 8MB cache size
  ttl: 3600          # 1 hour TTL
