# CC Survey Quality Configuration
# Data quality expectations, validations, and thresholds
config_version: 1

# Required checks field for QualityConfig
checks:
  - name: "series_id_not_null"
    check_type: "completeness"
    parameters:
      columns: ["series_id"]
    severity: "error"

  - name: "year_range_check"
    check_type: "validity"
    parameters:
      column: "year"
      min: 1986
      max: 2055
    severity: "error"

  - name: "period_values_check"
    check_type: "validity"
    parameters:
      column: "period"
      allowed_values: ["Q01", "Q02", "Q03", "Q04", "Q05"]
    severity: "error"

  - name: "series_id_format_check"
    check_type: "validity"
    parameters:
      column: "series_id"
      pattern: "^CC[US]\\d{15}$"
    severity: "warning"

  - name: "sector_code_not_null"
    check_type: "completeness"
    parameters:
      columns: ["sector_code"]
    severity: "error"

  - name: "benefit_code_format_check"
    check_type: "validity"
    parameters:
      column: "benefit_code"
      pattern: "^[0-9]{5}$"
    severity: "warning"

  - name: "industryocc_code_format_check"
    check_type: "validity"
    parameters:
      column: "industryocc_code"
      pattern: "^[0-9]{6}$"
    severity: "warning"

  - name: "value_range_check"
    check_type: "validity"
    parameters:
      column: "value"
      min: -10000000000000000.0
      max: 10000000000000000.0
    severity: "warning"

  - name: "begin_year_range_check"
    check_type: "validity"
    parameters:
      column: "begin_year"
      min: 1986
      max: 2067
    severity: "error"

  - name: "end_year_range_check"
    check_type: "validity"
    parameters:
      column: "end_year"
      min: 1986
      max: 2067
    severity: "error"

  - name: "series_uniqueness_check"
    check_type: "uniqueness"
    parameters:
      columns: ["series_id"]
    severity: "error"

  - name: "data_uniqueness_check"
    check_type: "uniqueness"
    parameters:
      columns: ["series_id", "year", "period"]
    severity: "error"

# Minimal required quality schema additions
expectations: {}

row_count:
  min: 1

metrics:
  collect: []
  persist: false

policy:
  mode: "warn_only"
  sample_on_fail_rows: 20
