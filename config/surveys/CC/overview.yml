# CC Survey Overview Configuration
# Survey metadata and context information
config_version: 1

survey:
  code: "CC"
  name: "Employer Costs for Employee Compensation"
  description: "The Employer Costs for Employee Compensation (ECEC) measures the cost of labor, including wages and salaries and employer costs for employee benefits."
  size_class: "medium"
  characteristics:
    frequency: "quarterly"
    coverage: "Civilian economy: private industry (excluding farms and households) and State and local governments (excluding Federal)."
    time_series_count: "ECEC compensation, wages and salaries, and benefit cost series"
    classification_system: "1990 Census of Occupations; SIC (historical)"
    update_schedule: "About eight weeks after the end of the reference quarter"
    begin_year: 1986
    survey_methodology: "Probability sample of ~30,000 occupations in private industry and ~3,750 in State and local governments; establishments classified by SIC (historical)."
    calculation_basis: "Employee benefit costs are calculated as cents-per-hour-worked; compensation includes wages and salaries plus benefits."

contacts:
  - role: "owner"
    name: "groenewt"
    email: ""

documentation:
  primary: "docs/bls/survey/cc.txt"
  data_dictionary: ""
  notes: |
    - Data location: data/raw/bls/cc
    - Files are ASCII with space-separated elements
    - Costs per hour stored to nearest penny; percents have one decimal place
    - Annual data available for early years; quarterly data begins June 2002

tags: ["compensation", "benefits", "labor_costs", "quarterly", "ecec"]

definition: |
  The Employer Costs for Employee Compensation (ECEC) is a measure of the cost of
  labor. The compensation series includes wages and salaries plus employer costs
  for individual employee benefits. The survey covers all occupations in the civilian
  economy, including private industry (excluding farms and households) and State and
  local governments (excluding Federal). Data are published by major occupational and
  industry groups, as well as by region and bargaining status.
