# CC Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/cc"
  include: ["cc.series", "cc.data.*", "cc.sector", "cc.benefit", "cc.costfactor", "cc.footnote", "cc.industryocc"]
  exclude: ["*.tmp", ".*", "*~", "*.bak"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year", "sector_code"]
  
mmap:
  enable_for_mb_greater_than: 100
  
# Lookup file loading strategy
lookup_strategy:
  preload: ["sector", "benefit", "costfactor"]  # Small, frequently used
  lazy: ["footnote", "industryocc"]  # Load on demand
  mmap: []  # Use for large files
  cache_all: true  # Small enough to keep in memory