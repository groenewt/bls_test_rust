# GG Survey Runtime Configuration
# Feature flags, env overrides mapping, logging
config_version: 1

feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  enable_checkpoints: true  # Enable checkpoints for medium-sized data
  enable_statistics_collection: true
  enable_profiling: false

environment_overrides:
  - key: "BLS_GG_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_GG_MAX_THREADS"
    maps_to: "resources.max_threads"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_PARTITION_STRATEGY"
    maps_to: "partition_hints.strategy"
  - key: "BLS_GG_CHUNK_SIZE_MB"
    maps_to: "io.chunk_size_mb"
  - key: "BLS_GG_MAX_ERRORS"
    maps_to: "policy.max_errors"

logging:
  level: "info"  # trace|debug|info|warn|error
  structured: true
  log_file: "gg_processing.log"

# Checkpoint settings for recovery
checkpoint:
  enabled: true
  interval_records: 50000
  checkpoint_dir: "checkpoints/gg"
  cleanup_on_success: true

# Error handling recovery settings
error_handling:
  on_error: "continue"  # continue|abort
  max_errors: 2000
  log_errors: true
  error_file: "gg_errors.log"
# Performance monitoring
monitoring:
  enabled: true  # Required field for MonitoringConfig
  metrics_endpoint: null
  health_check_interval: 60
