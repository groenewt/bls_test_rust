config_version: 1
expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "seasonal", "periodicity_code", "area_code", "industry_code", "altenergy_code", "own_code", "sizeclass_code", "dataelement_code", "ratelevel_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 2010, max: 2055 }
    - { file: "main", column: "value", min: 0, max: 10000000 }  # Employment counts can't be negative
    - { file: "series", column: "begin_year", min: 2010, max: 2055 }
    - { file: "series", column: "end_year", min: 2010, max: 2055 }
  
  enums:
    - { file: "series", column: "seasonal", values: ["S", "U"] }
    - { file: "series", column: "periodicity_code", values: ["Q"] }
    - { file: "main", column: "period", values: ["Q01", "Q02", "Q03", "Q04"] }
    - { file: "series", column: "begin_period", values: ["Q1", "Q2", "Q3", "Q4"] }
    - { file: "series", column: "end_period", values: ["Q1", "Q2", "Q3", "Q4"] }
  
  regex:
    - { file: "main", column: "series_id", pattern: "^GG[US]Q\\d{19}$" }
    - { file: "series", column: "series_id", pattern: "^GG[US]Q\\d{19}$" }
    - { file: "main", column: "period", pattern: "^Q0[1-4]$" }
  
  length:
    - { file: "series", column: "series_id", exact: 23 }
    - { file: "series", column: "seasonal", exact: 1 }
    - { file: "series", column: "periodicity_code", exact: 1 }
    - { file: "series", column: "area_code", exact: 5 }
    - { file: "series", column: "industry_code", exact: 6 }
    - { file: "series", column: "altenergy_code", exact: 2 }
    - { file: "series", column: "own_code", exact: 1 }
    - { file: "series", column: "sizeclass_code", exact: 1 }
    - { file: "series", column: "dataelement_code", exact: 2 }
    - { file: "series", column: "ratelevel_code", exact: 1 }
    - { file: "series", column: "begin_year", exact: 4 }
    - { file: "series", column: "begin_period", exact: 2 }
    - { file: "series", column: "end_year", exact: 4 }
    - { file: "series", column: "end_period", exact: 2 }
  
  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }
    - { file: "series", validation: "(end_year > begin_year) OR (end_year == begin_year AND end_period >= begin_period)", message: "End date must be after or equal to begin date" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "min(year)", "max(year)", "distinct(industry_code)"]
  persist: true

policy:
  mode: "fail_on_error"  # warn_only|fail_on_error
  sample_on_fail_rows: 50
  max_errors: 2000  # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "gg_errors.log"

# Data quality rules by action type
rules:
  flag:  # Flag but don't reject
    - { field: "value", rule: "range", min: 0, max: 10000000, message: "Employment count outside reasonable range" }
    - { field: "series_id", rule: "pattern", pattern: "^GG[US]Q\\d{19}$", message: "Invalid series ID format" }
    - { field: "period", rule: "values", allowed: ["Q01", "Q02", "Q03", "Q04"], message: "Invalid period value" }
    - { field: "begin_period", rule: "values", allowed: ["Q1", "Q2", "Q3", "Q4"], message: "Invalid begin period value" }
    - { field: "end_period", rule: "values", allowed: ["Q1", "Q2", "Q3", "Q4"], message: "Invalid end period value" }
  
  reject:  # Reject record
    - { field: "year", rule: "range", min: 2010, max: 2055, message: "Year outside valid range" }
    - { field: "series_id", rule: "length", exact: 23, message: "Series ID must be exactly 23 characters" }
    - { field: "series_id", rule: "required", message: "Series ID cannot be null" }
    - { field: "area_code", rule: "length", exact: 5, message: "Area code must be exactly 5 characters" }
    - { field: "industry_code", rule: "length", exact: 6, message: "Industry code must be exactly 6 characters" }
    - { field: "begin_year", rule: "range", min: 2010, max: 2055, message: "Begin year must be between 2010 and 2055" }
    - { field: "begin_year", rule: "numeric", message: "Begin year must be numeric" }
    - { field: "end_year", rule: "range", min: 2010, max: 2055, message: "End year must be between 2010 and 2055" }
    - { field: "end_year", rule: "numeric", message: "End year must be numeric" }
    - { field: "end_year", rule: "greater_than_or_equal", compare_field: "begin_year", message: "End year must be >= begin year" }