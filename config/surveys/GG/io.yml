# GG Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/gg"
  include: ["gg.series", "gg.data.*", "gg.altenergy", "gg.area", "gg.dataelement", "gg.footnote", "gg.greenquartile", "gg.industry", "gg.own", "gg.periodicity", "gg.ratelevel", "gg.seasonal", "gg.size"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year", "industry_code"]

mmap:
  enable_for_mb_greater_than: 100
  
lookup_config:
  preload: ["area", "industry", "own"]  # Small, frequently used
  lazy: ["footnote", "altenergy", "dataelement", "periodicity", "ratelevel", "seasonal", "size"]  # Load on demand
  mmap: []  # use it for large files
  cache_all: true  # Small enough to keep in memory

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
