definition: |
  The following is a definition of: GREEN GOODS AND SERVICES SURVEY (GG)

  Program Description: The Green Goods and Services (GGS) program provides 
  national and State estimates of GGS employment levels and rates by North 
  American Industrial Classification System (NAICS) industry code and ownership.

  Summary Data Available: The GGS program produces estimates of employment and 
  establishments associated with the production of green goods or the provision 
  of green services. These data help users understand the scope of green 
  economic activity and employment in the United States.

  The survey methodology involves sampling approximately 120,000 randomly 
  selected establishments per year from the Quarterly Census of Employment 
  and Wages (QCEW) sample frame. This provides comprehensive coverage of 
  establishments across industries to identify those involved in green 
  goods and services production.

  Data Characteristics: Employment levels and rates are calculated based on 
  establishments' involvement in producing green goods or providing green 
  services, classified according to the 2007 NAICS codes. The data provides 
  insights into the environmental sector's contribution to overall employment.