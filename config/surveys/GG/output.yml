config_version: 1
format: "csv"  # Default format from original config

csv:
  delimiter: ","
  quote_char: "\""
  escape_char: "\\"
  header: true

partitioning:
  enabled: true
  partition_by: ["year"]
  max_file_size_mb: 512

naming:
  dataset: "bls_gg"
  version: "v1"

evolution:
  mode: "compatible"
  allow_nullability_change: false

destination:
  base_path: "data/processed/bls/GG"

# Output configurations for different data types
outputs:
  data_series:
    format: "csv"
    partitioning:
      enabled: true
      partition_by: ["year"]
    transformations:
      sort_by: ["series_id", "year", "period"]
      deduplicate: true
      deduplicate_on: ["series_id", "year", "period", "footnote_codes"]
    statistics:
      enabled: true
      columns: ["year", "period", "value"]
  
  data_dict:
    format: "csv"
    partitioning:
      enabled: false  # Single file output for series metadata
    output_file: "gg_series_dict.csv"
    transformations:
      sort_by: ["series_id"]
      deduplicate: false
    statistics:
      enabled: true
      columns: ["series_id", "industry_code", "area_code", "begin_year", "end_year"]
      output_file: "gg_series_dict_stats.json"