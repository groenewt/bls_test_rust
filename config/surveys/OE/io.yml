# OE Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/oe"
  include: ["oe.series", "oe.data.*", "oe.area", "oe.datatype", "oe.occupation", "oe.period"]
  exclude: ["*.tmp", ".*", "*~", "*.bak"]

combining:
  enabled: false
  strategy: "none"
  thresholds:
    small_file_mb: 50

partition_hints:
  strategy: "size_based"
  max_partition_size_mb: 512
  partition_by: ["year"]
  
#mmap usage threshold for large files
mmap:
  enable_for_mb_greater_than: 200
  
# Lookup file loading strategy
lookup_strategy:
  preload: ["occupation"]
  lazy: ["datatype", "period"]
  mmap: ["area"]
  cache_all: false
