# defaults.yml
# Consumer Expenditure Survey - Organizational/team defaults
# Migrated from cx.yml on 2025-08-07

config_version: 1

# Default processing settings for CX survey (flattened structure)
processing:
  strategy: "chunked"
  max_threads: 4
  memory_limit: 8192    # 8GB in MB
  parallel: true

# Default output settings (flattened structure)
output:
  formats: ["csv"]
  output_dir: "data/processed/bls/CX"
  create_subdirs: true

# Default quality settings (flattened structure)
quality:
  validation:
    fail_on_error: true
    max_errors: 1000

# Default runtime settings (flattened structure)
runtime:
  features:
    enable_checkpoints: true
    enable_statistics: true
    enable_profiling: false
  
  monitoring:
    enabled: true