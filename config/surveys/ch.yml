          type: Text
          example_value: "1 - 2 hours"

    industry:
      file_path: "ch.industry"
      name: Industry
      description: "Industry for which data are observed"
      index_col: "industry_code"
      schema:
        industry_code:
          length: 6
          type: str
          example_value: "000000"
        industry_text:
