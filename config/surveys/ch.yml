          type: Text
          example_value: "Industry division or selected characteristics by age"

    category:
      file_path: "ch.category"
      name: Category
      description: "Industry, event, or characteristic for which data are available"
      index_col: "category_code"
      schema:
        case_code:
          length: 1
          type: str
          example_value: "3"
        category_code:
          length: 3
          type: str
          example_value: "00X"
        category_text:
          length: 100
          type: Text
          example_value: "Mining"

    datatype:
      file_path: "ch.datatype"
      name: Datatype
      description: "Datatype of the observation"
      index_col: "datatype_code"
