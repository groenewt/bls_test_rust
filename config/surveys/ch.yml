      series_id:
        length: 17
        type: Text
        example_value: "CHU00X00XXXX3E100"
      year:
        length: 4
        type: values
        example_value: "2003"
      period:
        length: 3
        type: Text
        example_value: "A01"
      value:
        length: 12
        type: values
        example_value: "0.6770580361"
      footnote_codes:
        length: 10
        type: Text
        example_value: ""

lookup_files:
  lookup_config:
    preload: [age, case, datatype, gender, hour, los, ownership, race, special, state, time, weekday, footnote]  # Small, frequently used
    lazy: [category, event, industry, nature, occupation, pob, source]  # Load on demand (larger files)
    mmap: []  # use it for large files
    cache_all: true  # Keep in memory
