# .config/surveys/ch.yml
# name: Occupational Injuries and Illnesses - Characteristics Data Processing Configuration
# description:
# author: groenewt
# date: 2025-08-07
# notes:
#         - data location: .data.raw/bls/ch
#         - Data files are in ASCII text format
#         - Spaces separate data elements in an original BLS file
#         - full doc: .docs/bls/survey/ch.txt
# changes:

#General Survey Information
survey:
  code: ch #survey code (ex.ap,sm,tu)- see docs (.docs/surveys/* for all surveys)
  name: Occupational Injuries and Illnesses - Characteristics Data #friendly survey name
  size_class: large #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  description: "Detailed breakouts of injury and illness data by various characteristics."
  definition: "
The following is a definition of:  Occupational Injuries and Illnesses - 
characteristics data (ch)

Survey Description:  Besides injury and illness counts, survey respondents 
also are asked to provide additional information for a subset of the most 
serious nonfatal cases logged, namely, those that involved at least 1 day 
away from work, beyond the day of injury or onset of illness. Employers 
answer several questions about these cases, including the demographics of 
the worker disabled, the nature of the disabling condition, and the event 
and source producing that condition. 

Summary Data Available: Detailed breakouts of injury and illness data by
a variety of characteristics, including age, category, event, gender,
industry, length of service, nature, occupation, part of body, race, and
source are available.

Frequency of Observations: Annual data are available.

Data Characteristics:  Data are reported to one decimal place.

Updating Schedule: OSHS Characteristics data are published annually.
                "
  characteristics:
    frequency: annual
    coverage: "Detailed breakouts of injury and illness data by a variety of characteristics, including age, category, event, gender, industry, length of service, nature, occupation, part of body, race, and source."
    time_series_count: "Large number of series" #COUNT OF LINE NUMBER IN SERIES FILE (-1 for header)
    classification_system: "Occupational injuries and illnesses categories"
    update_schedule: "Published annually"
    begin_year: 2002
    survey_methodology: "Survey respondents provide additional information for a subset of the most serious nonfatal cases logged, namely, those that involved at least 1 day away from work, beyond the day of injury or onset of illness."
    calculation_basis: "Data are reported to one decimal place"

