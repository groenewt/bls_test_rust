config_version: 1
discovery:
  root: "data/raw/bls/cm"
  include: ["cm.series", "cm.data.*", "map/cm.aspect", "cm.area", "cm.datatype", "cm.estimate", "cm.footnote", "cm.industry", "cm.occupation", "cm.owner", "cm.seasonal", "cm.subcell"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year", "datatype_code"]

mmap:
  enable_for_mb_greater_than: 100

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
