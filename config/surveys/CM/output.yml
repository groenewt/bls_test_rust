config_version: 1
format: "csv"
csv:
  delimiter: ","
  quote_char: "\""
  escape_char: "\\"
  header: true
  null_value: ""

partitioning:
  partition_by: ["year"]
  max_file_size_mb: 512

naming:
  dataset: "bls_cm"
  version: "v1"

evolution:
  mode: "compatible"
  allow_nullability_change: false

destination:
  base_path: "data/processed/bls/CM"

outputs:
  data_series:
    basic_load:
      format: "csv"
      partitioning:
        enabled: true
        partition_by: ["year"]
      transformations:
        sort_by: ["series_id", "year", "period"]
        deduplicate: true
        deduplicate_on: ["series_id", "year", "period", "footnote_codes"]
      statistics:
        enabled: true
        columns: ["year", "period", "value"]
    
    aspect_load:
      format: "csv"
      partitioning:
        enabled: true
        partition_by: ["year"]
      transformations:
        sort_by: ["series_id", "year", "period", "aspect_type"]
        deduplicate: true
        deduplicate_on: ["series_id", "year", "period", "aspect_type"]
      statistics:
        enabled: true
        columns: ["year", "period", "aspect_type", "value"]
  
  data_dict:
    basic_load:
      format: "csv"
      partitioning:
        enabled: false
      output_file: "cm_series_dict.csv"
      transformations:
        sort_by: ["series_id"]
        deduplicate: false
        deduplicate_on: ["series_id"]
      statistics:
        enabled: true
        columns: ["series_id", "owner_code", "industry_code", "occupation_code", "begin_year", "end_year"]
        output_file: "cm_series_dict_stats.json"