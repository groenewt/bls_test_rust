        type: "string"
        length: 1
        nullable: false
      category_code:
        type: "string"
        length: 3
        nullable: false
      category_text:
        type: "string"
        length: 100
        nullable: false
      display_level:
        type: "string"
        length: 1
        nullable: false
      selectable:
        type: "string"
        length: 1
        nullable: false
      sort_sequence:
        type: "string"
        length: 3
        nullable: false
  - id: "datatype"
    path: "cb.datatype"
    index: "datatype_code"
    description: "Maps datatype codes to datatype names"
    schema:
