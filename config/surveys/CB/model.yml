# CB Survey Model Configuration
# Data model: files, schemas, relationships
config_version: 1

series:
  path: "cb.series"
  index: "series_id"
  estimated_size_gb: 1.0
  schema:
    series_id:
      type: "string"
      length: 17
      nullable: false
      example_value: "CBU00X11XXXX3E100"
    seasonal:
      type: "string"
      length: 1
      nullable: false
      example_value: "U"
    category_code:
      type: "string"
      length: 3
      nullable: false
      example_value: "00X"
    datatype_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "3"
    case_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "E"
    age_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "00XXXX"
    los_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "0XXXXX"
    medical_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "CNYXXX"
    race_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "0XXXXX"
    gender_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "0XXXXX"
    pob_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "0XXXXX"
    event_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "0000XX"
    source_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "0000XX"
    occupation_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "000000"
    nature_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "0000XX"
    industry_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "000000"
    time_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "000000"
    hour_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "000000"
    weekday_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "000000"
    special_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "000000"
    ownership_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "1"
    state_code:
      type: "string"
      length: 2
      nullable: false
      example_value: "00"
    footnote_codes:
      type: "string"
      length: 10
      nullable: true
      example_value: ""
    begin_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2022"
    begin_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"
    end_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2022"
    end_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"

data_files:
  - id: "main"
    pattern: "cb.data.*"
    index: "series_id"
    schema:
      series_id:
        type: "string"
        length: 17
        nullable: false
        example_value: "CBU00X00XXXX3E100"
      year:
        type: "int32"
        min: 2022
        max: 2100
        nullable: false
        example_value: "2022"
      period:
        type: "string"
        length: 3
        nullable: false
        example_value: "A01"
      value:
        type: "decimal"
        precision: 18
        scale: 4
        nullable: true
        example_value: "10.2"
      footnote_codes:
        type: "string"
        length: 10
        nullable: true
        example_value: ""

lookups:
  - id: "age"
    path: "cb.age"
    index: "age_code"
    description: "Maps age codes to age names"
    schema:
      age_code:
        type: "string"
        length: 6
        nullable: false
      age_text:
        type: "string"
        length: 100
        nullable: false
  - id: "case"
    path: "cb.case"
    index: "case_code"
    description: "Maps case codes to case names"
    schema:
      case_code:
        type: "string"
        length: 1
        nullable: false
      case_text:
        type: "string"
        length: 100
        nullable: false
  - id: "category"
    path: "cb.category"
    index: "category_code"
    description: "Maps category codes to category names"
    schema:
