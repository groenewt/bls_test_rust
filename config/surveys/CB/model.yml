relationships:
  - from: { file: "main", column: "series_id" }
    to: { file: "series", column: "series_id" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
  required_fields:
    - { file: "series", columns: ["series_id", "category_code", "datatype_code", "case_code"] }
    - { file: "main", columns: ["series_id", "year", "period"] }

types:
  Year: { base: "int32", range: [2022, 2100] }
  SeriesId: { base: "string", length: 17, pattern: "^CB[SU]\\d{15}$" }
  Period: { base: "string", length: 3, enum: ["A01"] }