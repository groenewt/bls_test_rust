# CB Survey Quality Configuration
# Validations, expectations, thresholds
config_version: 1

expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "category_code", "datatype_code", "case_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 2022, max: 2100 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "series", column: "begin_year", min: 2022, max: 2067 }
    - { file: "series", column: "end_year", min: 2022, max: 2067 }
  
  enums:
    - { file: "main", column: "period", values: ["A01"] }
    - { file: "series", column: "seasonal", values: ["S", "U"] }
    - { file: "series", column: "begin_period", values: ["A01"] }
    - { file: "series", column: "end_period", values: ["A01"] }
  
  regex:
    - { file: "main", column: "series_id", pattern: "^CB[SU]\\d{15}$" }
    - { file: "series", column: "series_id", pattern: "^CB[SU]\\d{15}$" }
  
  length:
    - { file: "series", column: "series_id", exact: 17 }
    - { file: "series", column: "category_code", exact: 3 }
    - { file: "series", column: "case_code", exact: 1 }
    - { file: "series", column: "datatype_code", exact: 1 }
    - { file: "series", column: "ownership_code", exact: 1 }
    - { file: "series", column: "state_code", exact: 2 }
    - { file: "series", column: "begin_year", exact: 4 }
    - { file: "series", column: "end_year", exact: 4 }
    - { file: "series", column: "begin_period", exact: 3 }
    - { file: "series", column: "end_period", exact: 3 }
  
  lookup_exists:
    - { file: "series", column: "category_code", lookup_table: "category" }
    - { file: "series", column: "case_code", lookup_table: "case" }
    - { file: "series", column: "datatype_code", lookup_table: "datatype" }
    - { file: "series", column: "age_code", lookup_table: "age" }
    - { file: "series", column: "gender_code", lookup_table: "gender" }
    - { file: "series", column: "race_code", lookup_table: "race" }
    - { file: "series", column: "industry_code", lookup_table: "industry" }
    - { file: "series", column: "occupation_code", lookup_table: "occupation" }
    - { file: "series", column: "state_code", lookup_table: "state" }
    - { file: "series", column: "ownership_code", lookup_table: "ownership" }
  
  cross_field:
    - { file: "series", field: "end_year", rule: "greater_than_or_equal", compare_field: "begin_year" }
    - { file: "series", validation: "(end_year >= begin_year) OR (end_year is null and begin_year is null)" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "distinct(year)", "distinct(period)"]
  persist: true

policy:
  mode: "fail_on_error"
  sample_on_fail_rows: 50

validation_rules:
  data_series:
    - field: "value"
      rule: "range"
      min: -10000000000000000.0
      max: 10000000000000000.0
      action: "flag"
    - field: "year"
      rule: "range"
      min: 2022
      max: 2055
      action: "reject"
    - field: "series_id"
      rule: "pattern"
      pattern: "^CB[SU]\\d{15}$"
      action: "flag"
    - field: "period"
      rule: "values"
      allowed: ["A01"]
      action: "flag"
  
  series_dict:
    - field: "series_id"
      rule: "pattern"
      pattern: "^CB[SU]\\d{15}$"
      action: "flag"
      message: "Invalid series ID format: should be CB[S/U] followed by 15 digits"
    - field: "series_id"
      rule: "length"
      exact: 17
      action: "reject"
      message: "Series ID must be exactly 17 characters"
    - field: "series_id"
      rule: "required"
      action: "reject"
      message: "Series ID cannot be null"
    - field: "category_code"
      rule: "length"
      exact: 3
      action: "reject"
      message: "Category code must be exactly 3 characters"
    - field: "category_code"
      rule: "lookup_exists"
      lookup_table: "category"
      action: "flag"
      message: "Category code not found in category lookup table"
    - field: "case_code"
      rule: "length"
      exact: 1
      action: "reject"
      message: "Case code must be exactly 1 character"
    - field: "case_code"
      rule: "lookup_exists"
      lookup_table: "case"
      action: "flag"
      message: "Case code not found in case lookup table"
    - field: "begin_year"
      rule: "range"
      min: 2022
      max: 2067
      action: "reject"
      message: "Begin year must be between 2022 and 2067"
    - field: "begin_year"
      rule: "numeric"
      action: "reject"
      message: "Begin year must be numeric"
    - field: "end_year"
      rule: "range"
      min: 2022
      max: 2067
      action: "reject"
      message: "End year must be between 2022 and 2067"
    - field: "end_year"
      rule: "numeric"
      action: "reject"
      message: "End year must be numeric"
    - field: "end_year"
      rule: "greater_than_or_equal"
      compare_field: "begin_year"
      action: "reject"
      message: "End year must be >= begin year"
    - field: "begin_period"
      rule: "values"
      allowed: ["A01"]
      action: "flag"
      message: "Invalid begin period value"
    - field: "end_period"
      rule: "values"
      allowed: ["A01"]
      action: "flag"
      message: "Invalid end period value"
    - field: "end_year"
      rule: "date_logic_check"
      check_fields: ["begin_year"]
      validation: "(end_year >= begin_year) OR (end_year is null and begin_year is null)"
      action: "flag"
      message: "End date must be after or equal to begin date"

completeness_checks:
  required_fields:
    series: ["series_id", "category_code", "datatype_code", "case_code", "begin_year", "begin_period", "end_year", "end_period"]
    main: ["series_id", "year", "period"]
  nullable_fields:
    series: ["age_code", "los_code", "medical_code", "race_code", "gender_code", "pob_code", "event_code", "source_code", "occupation_code", "nature_code", "industry_code", "time_code", "hour_code", "weekday_code", "special_code", "footnote_codes"]
    main: ["value", "footnote_codes"]

uniqueness_constraints:
  series: ["series_id"]
  main: ["series_id", "year", "period"]