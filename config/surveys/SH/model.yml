# SH Survey Data Model Configuration
# Data model: files, schemas, relationships
config_version: 1

series:
  path: "sh.series"
  index: "series_id"
  estimated_size_gb: 0.05
  schema:
    series_id:
      type: "string"
      length: 17
      nullable: false
      example_value: "SHU00000001"
    division_code:
      type: "string"
      length: 2
      nullable: false
      example_value: "00"
    industry_code:
      type: "string"
      length: 4
      nullable: false
      example_value: "0000"
    data_type_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "1"
    case_type_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "T"
    begin_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "1989"
    begin_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"
    end_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2000"
    end_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"

data_files:
  - id: "main"
    pattern: "sh.data.*"
    index: "series_id"
    estimated_size_gb: 0.2
    schema:
      series_id:
        type: "string"
        length: 17
        nullable: false
        example_value: "SHU00000001"
      year:
        type: "int32"
        min: 1950
        max: 2055
        nullable: false
        example_value: 1989
      period:
        type: "string"
        length: 3
        pattern: "^(A01)$"
        nullable: false
        example_value: "A01"
      value:
        type: "decimal"
        precision: 18
        scale: 1
        nullable: true
        example_value: 0.4
      footnote_codes:
        type: "string"
        length: 10
        nullable: true
        example_value: ""

lookups:
  - id: "case_type"
    path: "sh.case.type"
    index: "case_type_code"
    description: "Maps case type codes to text"
    schema:
      case_type_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "1"
      case_type_text:
        type: "string"
        length: 50
        nullable: true
        example_value: "Cases"

  - id: "data_type"
    path: "sh.data.type"
    index: "data_type_code"
    description: "Maps data type codes to text"
    schema:
      data_type_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "3"
      data_type_text:
        type: "string"
        length: 60
        nullable: true
        example_value: "Incidence rate"

  - id: "division"
    path: "sh.division"
    index: "division_code"
    description: "Maps division codes to names"
    schema:
      division_code:
        type: "string"
        length: 2
        nullable: false
        example_value: "70"
      division_name:
        type: "string"
        length: 50
        nullable: true
        example_value: "Manufacturing"

  - id: "footnote"
    path: "sh.footnote"
    index: "footnote_code"
    description: "Maps footnote codes to footnote text"
    schema:
      footnote_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "C"
      footnote_text:
        type: "string"
        length: 100
        nullable: true
        example_value: "Confidential"

  - id: "industry"
    path: "sh.industry"
    index: "industry_code"
    description: "Maps industry codes to names (with division)"
    schema:
      division_code:
        type: "string"
        length: 2
        nullable: false
        example_value: "09"
      industry_code:
        type: "string"
        length: 4
        nullable: false
        example_value: "0180"
      industry_name:
        type: "string"
        length: 50
        nullable: true
        example_value: "Industry name"

  - id: "period"
    path: "sh.period"
    index: "period"
    description: "Maps period codes to period names"
    schema:
      period:
        type: "string"
        length: 3
        nullable: false
        example_value: "A01"
      period_abbr:
        type: "string"
        length: 5
        nullable: false
        example_value: "ANN"
      period_name:
        type: "string"
        length: 20
        nullable: false
        example_value: "Annual"

relationships:
  - from: { file: "main", column: "series_id" }
    to:   { file: "series", column: "series_id" }
    type: "many-to-one"
  - from: { file: "series", column: "division_code" }
    to:   { file: "division", column: "division_code" }
    type: "many-to-one"
  - from: { file: "series", column: "industry_code" }
    to:   { file: "industry", column: "industry_code" }
    type: "many-to-one"
  - from: { file: "series", column: "data_type_code" }
    to:   { file: "data_type", column: "data_type_code" }
    type: "many-to-one"
  - from: { file: "series", column: "case_type_code" }
    to:   { file: "case_type", column: "case_type_code" }
    type: "many-to-one"
  - from: { file: "main", column: "period" }
    to:   { file: "period", column: "period" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "division", columns: ["division_code"] }
    - { file: "industry", columns: ["industry_code"] }
    - { file: "data_type", columns: ["data_type_code"] }
    - { file: "case_type", columns: ["case_type_code"] }
    - { file: "footnote", columns: ["footnote_code"] }
    - { file: "period", columns: ["period"] }
  required_fields:
    - { file: "series", columns: ["series_id", "division_code", "industry_code", "data_type_code", "case_type_code", "begin_year", "begin_period", "end_year", "end_period"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
