# SH Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/sh"
  include: [
    "sh.series",
    "sh.data.*",
    "sh.case.type",
    "sh.data.type",
    "sh.division",
    "sh.footnote",
    "sh.industry",
    "sh.period"
  ]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 256
  partition_by: ["year"]

mmap:
  enable_for_mb_greater_than: 100

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
