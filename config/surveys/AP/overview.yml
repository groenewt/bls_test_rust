documentation:
  primary: "docs/bls/survey/ap.md"
  data_dictionary: ""
  notes: |
    - Data location: data/raw/bls/ap
    - Data files are in ASCII text format
    - Spaces separate data elements in original BLS files
    - Average prices are stored to three decimal places
    - Monthly data available for up to 6 household fuel categories, 6 motor fuel categories, and around 100 food categories
