# AP Survey Overview Configuration
# Survey metadata and context information
config_version: 1

survey:
  code: "AP"
  name: "Average Price Data"
  description: "Average consumer prices for selected items, collected monthly from retail stores."
  size_class: "small"
  characteristics:
    frequency: "monthly"
    coverage: "Average consumer prices for household fuel and motor fuel are available for the U.S. city average, 23 urban areas, 4 regions, 12 region/size class groupings, and 9 divisions. Average consumer prices for food are available for the U.S. city average, and four regions."
    time_series_count: "1,482 series"
    classification_system: "Consumer goods and services categories"
    update_schedule: "Monthly release, typically mid-month"
    begin_year: 1978
    survey_methodology: "Prices, except for electricity, are collected monthly by BLS representatives in the 75 urban areas priced for the CPI. Electricity prices are collected for the BLS for the same 75 areas on a monthly basis by the Department of Energy using mail questionnaires. All fuel prices include applicable Federal, State, and local taxes; prices for natural gas and electricity also include fuel and purchased gas adjustments."
    calculation_basis: "Average of prices collected during reference period"

contacts:
  - role: "owner"
    name: "groenewt"
