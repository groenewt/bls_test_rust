# AP Survey Processing Configuration
# Strategy, resources, chunking, mmap, cache
config_version: 1

# Direct strategy value (not nested)
strategy: "in_memory"

# Flattened configuration fields
max_threads: 2
chunk_size: 10485760  # 10MB in bytes
memory_limit: 2048     # 2GB in MB
parallel: false       # Single-threaded for small survey

# Chunking configuration
chunking:
  size: 10485760       # 10MB in bytes
  strategy: "sequential"
  overlap: null

# Memory mapping configuration
mmap:
  enabled: false       # Too small to benefit from mmap
  threshold: null
  prefetch: null

# Cache configuration  
cache:
  enabled: true
  size: 1048576        # 1MB cache size
  ttl: 3600           # 1 hour TTL