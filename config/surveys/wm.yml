processing:
  # Strategy for medium survey
  strategy: chunked  # Process in chunks due to size
  max_threads: 4     # Increased parallelization for medium-sized data
  
  # Chunk settings
  chunk_size_mb: 50
  buffer_pool_size: 8
  
  # Performance hints
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: false

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: true  # Partition by year for time-series analysis
        partition_by: [year]
      use_mmap: true
      series_size_class: Medium
      list_data_files: [ wm.data.1.AllData, wm.aspect ]
      partition_strategy:
        partion_by: "area_code"
        file_format: "wm.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period, footnote_codes]

          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 2017
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^WM[SU]\\d{27}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "A01" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: true
      series_size_class: Large
      output_file: "wm_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # Area code mapping
        area_code:
          lookup_table: "area"
          lookup_key: "area_code"
          lookup_value: "area_text"
          create_field: "area_name"
          on_missing: "UNKNOWN_AREA"
          cache: true
        
        # Occupation code mapping
        occupation_code:
          lookup_table: "occupation"
          lookup_key: "occupation_code"
          lookup_value: "occupation_text"
          create_field: "occupation_name"
          on_missing: "UNKNOWN_OCCUPATION"
          cache: true
        
        # Industry code mapping
        industry_code:
          lookup_table: "industry"
          lookup_key: "industry_code"
          lookup_value: "industry_text"
          create_field: "industry_name"
          on_missing: "UNKNOWN_INDUSTRY"
          cache: true
        
        # Level code mapping
        level_code:
          lookup_table: "level"
          lookup_key: "level_code"
          lookup_value: "level_text"
          create_field: "level_name"
          on_missing: "UNKNOWN_LEVEL"
          cache: true
        
        # Subcell code mapping
        subcell_code:
          lookup_table: "subcell"
          lookup_key: "subcell_code"
          lookup_value: "subcell_text"
          create_field: "subcell_name"
          on_missing: "UNKNOWN_SUBCELL"
          cache: true
        
        # Ownership code mapping
        ownership_code:
          lookup_table: "ownership"
          lookup_key: "ownership_code"
          lookup_value: "ownership_text"
          create_field: "ownership_name"
          on_missing: "UNKNOWN_OWNERSHIP"
          cache: true
        
        # Estimate code mapping
        estimate_code:
          lookup_table: "estimate"
          lookup_key: "estimate_code"
          lookup_value: "estimate_text"
          create_field: "estimate_name"
          on_missing: "UNKNOWN_ESTIMATE"
          cache: true
        
        # Datatype code mapping
        datatype_code:
          lookup_table: "datatype"
          lookup_key: "datatype_code"
          lookup_value: "datatype_text"
          create_field: "datatype_name"
          on_missing: "UNKNOWN_DATATYPE"
          cache: true
        
        # Seasonal mapping
        seasonal:
          lookup_table: "seasonal"
          lookup_key: "seasonal"
          lookup_value: "seasonal_text"
          create_field: "seasonal_name"
          on_missing: "UNKNOWN_SEASONAL"
          cache: true
        
        # Begin period mapping
        begin_period:
          lookup_table: "period"
          lookup_key: "period"
          lookup_value: "period_name"
          create_field: "begin_period_name"
          on_missing: keep_original
          cache: true
        
        # End period mapping
        end_period:
          lookup_table: "period"
          lookup_key: "period"
          lookup_value: "period_name"
          create_field: "end_period_name"
          on_missing: keep_original
          cache: true
        
        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^WM[SU]\\d{27}$"
            action: flag
            message: "Invalid series ID format: should be WM[S/U] followed by 27 digits"
          
          - field: series_id
            rule: length
            exact: 29
            action: reject
            message: "Series ID must be exactly 29 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # Area code validation
          - field: area_code
            rule: length
            exact: 7
            action: reject
            message: "Area code must be exactly 7 characters"
          
          - field: area_code
            rule: pattern
            pattern: "^[0-9]{7}$"
            action: flag
            message: "Area code should be 7 digits"
          
          - field: area_code
            rule: lookup_exists
            lookup_table: "area"
            action: flag
            message: "Area code not found in area lookup table"
          
          # Occupation code validation
          - field: occupation_code
            rule: length
            exact: 6
            action: reject
            message: "Occupation code must be exactly 6 characters"
          
          - field: occupation_code
            rule: pattern
            pattern: "^[0-9]{6}$"
            action: flag
            message: "Occupation code should be 6 digits"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 2017
            max: 2067
            action: reject
            message: "Begin year must be between 2017 and 2067"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 2017
            max: 2067
            action: reject
            message: "End year must be between 2017 and 2067"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "A01" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "A01" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, seasonal, area_code, ownership_code, estimate_code, industry_code, occupation_code, subcell_code, datatype_code, level_code, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ series_title, footnote_codes ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, area_code, occupation_code, begin_year, end_year ]
        output_file: "wm_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 2000    # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "wm_errors.log"
  
  # Checkpoint settings
  checkpoint:
    enabled: true  # Enable checkpoints for medium-sized data
    interval_records: 50000
    checkpoint_dir: "checkpoints/wm"