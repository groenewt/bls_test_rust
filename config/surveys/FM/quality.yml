# FM Survey Quality Configuration
# Data quality expectations, validations, and thresholds
config_version: 1

# Required checks field for QualityConfig
checks:
  - name: "series_id_not_null"
    check_type: "completeness"
    parameters:
      columns: ["series_id"]
    severity: "error"
  
  - name: "year_range_check" 
    check_type: "validity"
    parameters:
      column: "year"
      min: 2009
      max: 2067
    severity: "error"
    
  - name: "unique_series_combination"
    check_type: "uniqueness"
    parameters:
      columns: ["series_id", "year", "period"]
    severity: "error"

# Required validation field for QualityConfig
validation:
  strict_mode: true
  fail_on_error: false
  max_errors: 1000

expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period", "value"] }
    - { file: "series", columns: ["series_id", "seasonal", "ftyp_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 2009, max: 2067 }
    - { file: "main", column: "value", min: -10000000000.0, max: 10000000000.0 }
    - { file: "series", column: "begin_year", min: 2009, max: 2067 }
    - { file: "series", column: "end_year", min: 2009, max: 2067 }
  
  enums:
    - { file: "series", column: "seasonal", values: ["S", "U"] }
    - { file: "main", column: "period", values: ["A01"] }
    - { file: "series", column: "begin_period", values: ["A01"] }
    - { file: "series", column: "end_period", values: ["A01"] }
  
  regex:
    - { file: "series", column: "series_id", pattern: "^FM[U]\\d{4,8}$" }
    - { file: "main", column: "series_id", pattern: "^FM[U]\\d{4,8}$" }
  
  length:
    - { file: "series", column: "series_id", min: 6, max: 10 }
    - { file: "main", column: "series_id", min: 6, max: 10 }
  
  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "min(year)", "max(year)"]
  persist: true

policy:
  mode: "continue"
  max_errors: 1000
  sample_on_fail_rows: 50
  log_errors: true
  error_file: "fm_errors.log"

actions:
  value_range_violation: "flag"
  year_range_violation: "reject"
  series_id_format_violation: "flag"
  period_enum_violation: "flag"
  cross_field_violation: "reject"
  length_violation: "reject"
  required_field_missing: "reject"