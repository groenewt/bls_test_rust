definition: |
  The following is a definition of: MARITAL AND FAMILY LABOR FORCE STATISTICS

  Program Description: The marital and family labor force statistics (FM) database
  from the Current Population Survey reflects data published each year in the news
  release, "Employment Characteristics of Families."

  Summary Data Available: The Current Population Survey (CPS), frequently referred
  to as the household survey, is a monthly survey of about 60,000 eligible
  households. The CPS provides information about the civilian noninstitutional
  population age 16 years and over. All persons are classified as employed,
  unemployed, or not in the labor force.

  At the present time, only data for persons are available in the FM database.
  Person data include employment status by marital status and presence and age of
  own children. For example, the FM database includes the labor force participation
  rate of mothers with children under age 6. The data are annual averages of
  information collected monthly in the survey. The annual averages are calculated
  from not seasonally adjusted monthly data. At present, the FM database has data
  beginning with 2009 annual averages.