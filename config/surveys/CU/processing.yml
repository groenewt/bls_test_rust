# CU Survey Processing Configuration
# Strategy, resources, chunking, mmap, cache
config_version: 1

# Direct strategy value (not nested)
strategy: "mmap"

# Flattened configuration fields
max_threads: 8
chunk_size: 104857600  # 100MB in bytes
memory_limit: 16384    # 16GB in MB
parallel: true         # Multi-threaded for large survey

# Chunking configuration
chunking:
  size: 104857600      # 100MB in bytes
  strategy: "sequential"
  overlap: null

# Memory mapping configuration
mmap:
  enabled: true        # Beneficial for large survey
  threshold: null
  prefetch: null

# Cache configuration  
cache:
  enabled: true
  size: 16777216      # 16MB cache size
  ttl: 3600          # 1 hour TTL

# CU-specific transforms
transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_decimal(value, 18, 4)"