config_version: 1
strategy:
  mode: "mmap"
  max_concurrency: 1

resources:
  max_threads: 8
  memory_limit_gb: 16

io:
  chunk_size_mb: 100
  buffer_pool_size: 16

features:
  use_mmap: true
  enable_statistics: true
  enable_profiling: true

transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_decimal(value, 18, 4)"