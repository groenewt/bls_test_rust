config_version: 1
discovery:
  root: "data/raw/bls/CU"
  include: ["cu.series", "cu.data.*", "cu.area", "cu.aspect", "cu.base", "cu.footnote", "cu.item", "cu.period", "cu.periodicity", "cu.seasonal"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["area_code"]

mmap:
  enable_for_mb_greater_than: 100

data_files:
  patterns:
    - "cu.data.0.Current"
    - "cu.data.1.AllItems"
    - "cu.data.2.Summaries"
    - "cu.data.3.AsizeNorthEast"
    - "cu.data.4.AsizeNorthCentral"
    - "cu.data.5.AsizeSouth"
    - "cu.data.6.AsizeWest"
    - "cu.data.7.OtherNorthEast"
    - "cu.data.8.OtherNorthCentral"
    - "cu.data.9.OtherSouth"
    - "cu.data.10.OtherWest"
    - "cu.data.11.USFoodBeverage"
    - "cu.data.12.USHousing"
    - "cu.data.13.USApparel"
    - "cu.data.14.USTransportation"
    - "cu.data.15.USMedical"
    - "cu.data.16.USRecreation"
    - "cu.data.17.USEducationAndCommunication"
    - "cu.data.18.USOtherGoodsAndServices"
    - "cu.data.19.PopulationSize"
    - "cu.data.20.USCommoditiesServicesSpecial"

lookup_loading:
  preload: ["area", "item"]
  lazy: ["footnote", "period", "seasonal", "periodicity", "base"]
  mmap: ["aspect"]
  cache_all: true