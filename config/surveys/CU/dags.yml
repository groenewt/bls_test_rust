# CU Survey DAG Configuration
# Pipeline DAG with tasks, dependencies, retries, and SLAs
config_version: 1
graph:
  tasks:
    - id: "discover"
      type: "scan"
      inputs: []
      retries: { max: 2, backoff_sec: 10 }
      sla_minutes: 5
    
    - id: "validate"
      type: "validate_model"
      inputs: ["discover"]
      retries: { max: 1, backoff_sec: 5 }
      sla_minutes: 10
    
    - id: "load_lookups"
      type: "load_lookups"
      inputs: ["validate"]
      retries: { max: 2, backoff_sec: 5 }
      sla_minutes: 15
    
    - id: "plan"
      type: "partition_plan"
      inputs: ["load_lookups"]
      retries: { max: 1, backoff_sec: 5 }
      sla_minutes: 5
    
    - id: "process_series"
      type: "execute"
      inputs: ["plan"]
      parallelism: 2
      retries: { max: 1, backoff_sec: 30 }
      sla_minutes: 60
    
    - id: "process_data"
      type: "execute"
      inputs: ["plan"]
      parallelism: 4
      retries: { max: 1, backoff_sec: 30 }
      sla_minutes: 120
    
    - id: "write_series"
      type: "output"
      inputs: ["process_series"]
      retries: { max: 2, backoff_sec: 10 }
      sla_minutes: 30
    
    - id: "write_data"
      type: "output"
      inputs: ["process_data"]
      retries: { max: 2, backoff_sec: 10 }
      sla_minutes: 60
    
    - id: "qc_series"
      type: "quality_checks"
      inputs: ["write_series"]
      retries: { max: 1, backoff_sec: 5 }
      sla_minutes: 15
    
    - id: "qc_data"
      type: "quality_checks"
      inputs: ["write_data"]
      retries: { max: 1, backoff_sec: 5 }
      sla_minutes: 30
    
    - id: "finalize"
      type: "finalize"
      inputs: ["qc_series", "qc_data"]
      retries: { max: 1, backoff_sec: 5 }
      sla_minutes: 10

  edges:
    - from: "discover"
      to: "validate"
    - from: "validate"
      to: "load_lookups"
    - from: "load_lookups"
      to: "plan"
    - from: "plan"
      to: "process_series"
    - from: "plan"
      to: "process_data"
    - from: "process_series"
      to: "write_series"
    - from: "process_data"
      to: "write_data"
    - from: "write_series"
      to: "qc_series"
    - from: "write_data"
      to: "qc_data"
    - from: "qc_series"
      to: "finalize"
    - from: "qc_data"
      to: "finalize"

# Global DAG settings
settings:
  max_active_runs: 1
  catchup: false
  depends_on_past: false
  email_on_failure: true
  email_on_retry: false
  retries: 1
  retry_delay_minutes: 5
