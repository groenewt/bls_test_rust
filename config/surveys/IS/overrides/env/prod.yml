# IS Survey Production Environment Overrides
config_version: 1

# Production-specific processing settings
processing:
  features:
    enable_profiling: false
    enable_statistics: false  # Minimal overhead in production

# Production output settings
output:
  destination:
    base_path: "data/prod/processed/bls/IS"

# Production quality settings
quality:
  policy:
    mode: "fail_on_error"  # Strict validation for production
    sample_on_fail_rows: 10  # Minimal sampling to reduce overhead

# Production runtime settings
runtime:
  logging:
    level: "warn"  # Only warnings and errors in production
  development:
    enable_debug_output: false
    save_intermediate_files: false
    verbose_logging: false
  feature_flags:
    enable_hot_reloads: false