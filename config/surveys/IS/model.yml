# IS Survey Data Model Configuration
# Data model: files, schemas, relationships
config_version: 1

series:
  path: "is.series"
  index: "series_id"
  estimated_size_gb: 0.1
  schema:
    series_id:
      type: "string"
      length: 17
      nullable: false
      example_value: "ISU00000000001100"
    supersector_code:
      type: "string"
      length: 3
      nullable: false
      example_value: "000"
    industry_code:
      type: "string"
      length: 6
      nullable: false
      example_value: "000000"
    data_type_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "0"
    case_type_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "1"
    area_code:
      type: "string"
      length: 3
      nullable: false
      example_value: "100"
    series_title:
      type: "string"
      length: 255
      nullable: true
      example_value: "Industry-level data from the Survey of Occupational Injuries and Illnesses (SOII)"
    footnote_codes:
      type: "string"
      length: 10
      nullable: true
      example_value: "Z"
    begin_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2014"
    begin_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"
    end_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2014"
    end_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "A01"

data_files:
  - id: "main"
    pattern: "is.data.*"
    index: "series_id"
    estimated_size_gb: 0.5
    schema:
      series_id:
        type: "string"
        length: 17
        nullable: false
        example_value: "ISU00000000001100"
      year:
        type: "int32"
        min: 1900
        max: 2100
        nullable: false
        example_value: 2014
      period:
        type: "string"
        length: 3
        pattern: "^(A\\d{2})$"
        nullable: false
        example_value: "A01"
      value:
        type: "decimal"
        precision: 18
        scale: 1
        nullable: true
        example_value: 0.4
      footnote_codes:
        type: "string"
        length: 10
        nullable: true
        example_value: "Z"

lookups:
  - id: "area"
    path: "is.area"
    index: "area_code"
    description: "Maps area codes to area names"
    schema:
      area_code:
        type: "string"
        length: 3
        nullable: false
        example_value: "100"
      area_name:
        type: "string"
        length: 100
        nullable: false
        example_value: "Private Industry, National"
      display_level:
        type: "string"
        length: 2
        nullable: false
        example_value: "0"
      selectable:
        type: "string"
        length: 1
        nullable: false
        example_value: "T"
      sort_sequence:
        type: "string"
        length: 5
        nullable: false
        example_value: "00000"

  - id: "case_type"
    path: "is.case.type"
    index: "case_type_code"
    description: "Maps case type codes to descriptions"
    schema:
      case_type_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "1"
      case_type_text:
        type: "string"
        length: 100
        nullable: false
        example_value: "Total recordable cases"

  - id: "data_type"
    path: "is.data.type"
    index: "data_type_code"
    description: "Maps data type codes to descriptions"
    schema:
      data_type_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "0"
      data_type_text:
        type: "string"
        length: 100
        nullable: false
        example_value: "Rate per 100 full-time workers"

  - id: "footnote"
    path: "is.footnote"
    index: "footnote_code"
    description: "Footnote codes and text"
    schema:
      footnote_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "C"
      footnote_text:
        type: "string"
        length: 100
        nullable: true
        example_value: "Rounded to zero"

  - id: "industry"
    path: "is.industry"
    index: "industry_code"
    description: "Industry codes with supersector"
    schema:
      supersector_code:
        type: "string"
        length: 3
        nullable: false
        example_value: "000"
      industry_code:
        type: "string"
        length: 6
        nullable: false
        example_value: "000000"
      industry_name:
        type: "string"
        length: 100
        nullable: false
        example_value: "All workers"
      display_level:
        type: "string"
        length: 2
        nullable: false
        example_value: "0"
      selectable:
        type: "string"
        length: 1
        nullable: false
        example_value: "T"
      sort_sequence:
        type: "string"
        length: 5
        nullable: false
        example_value: "00001"

  - id: "period"
    path: "is.period"
    index: "period"
    description: "Period codes"
    schema:
      period:
        type: "string"
        length: 3
        nullable: false
        example_value: "A01"
      period_abbr:
        type: "string"
        length: 5
        nullable: false
        example_value: "ANN"
      period_name:
        type: "string"
        length: 20
        nullable: false
        example_value: "Annual"

  - id: "supersector"
    path: "is.supersector"
    index: "supersector_code"
    description: "Supersector codes"
    schema:
      supersector_code:
        type: "string"
        length: 3
        nullable: false
        example_value: "000"
      supersector_name:
        type: "string"
        length: 100
        nullable: false
        example_value: "Total private"
      display_level:
        type: "string"
        length: 2
        nullable: false
        example_value: "0"
      selectable:
        type: "string"
        length: 1
        nullable: false
        example_value: "T"
      sort_sequence:
        type: "string"
        length: 5
        nullable: false
        example_value: "00001"

relationships:
  - from: { file: "main", column: "series_id" }
    to: { file: "series", column: "series_id" }
    type: "many-to-one"
  - from: { file: "series", column: "area_code" }
    to: { file: "area", column: "area_code" }
    type: "many-to-one"
  - from: { file: "series", column: "data_type_code" }
    to: { file: "data_type", column: "data_type_code" }
    type: "many-to-one"
  - from: { file: "series", column: "case_type_code" }
    to: { file: "case_type", column: "case_type_code" }
    type: "many-to-one"
  - from: { file: "series", column: "industry_code" }
    to: { file: "industry", column: "industry_code" }
    type: "many-to-one"
  - from: { file: "series", column: "supersector_code" }
    to: { file: "supersector", column: "supersector_code" }
    type: "many-to-one"
  - from: { file: "main", column: "period" }
    to: { file: "period", column: "period" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "area", columns: ["area_code"] }
    - { file: "case_type", columns: ["case_type_code"] }
    - { file: "data_type", columns: ["data_type_code"] }
    - { file: "footnote", columns: ["footnote_code"] }
    - { file: "industry", columns: ["industry_code"] }
    - { file: "period", columns: ["period"] }
    - { file: "supersector", columns: ["supersector_code"] }
  required_fields:
    - { file: "series", columns: ["series_id", "supersector_code", "industry_code", "data_type_code", "case_type_code", "area_code", "begin_year", "begin_period", "end_year", "end_period"] }
    - { file: "main", columns: ["series_id", "year", "period"] }

types:
  ISSeriesId: { base: "string", length: 17, pattern: "^IS[SU][0-9]{14}$" }
  ISAreaCode: { base: "string", length: 3, pattern: "^[0-9]{3}$" }
  ISIndustryCode: { base: "string", length: 6, pattern: "^[0-9]{6}$" }
  ISPeriod: { base: "string", length: 3, pattern: "^(A\\d{2})$" }
  ISValue: { base: "decimal", precision: 18, scale: 1 }
