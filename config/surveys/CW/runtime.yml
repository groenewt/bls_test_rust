config_version: 1
feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  use_memory_map_data: true
  enable_checkpoints: true
  enable_statistics_collection: true
  enable_profiling: false

environment_overrides:
  - key: "BLS_CW_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_CW_MAX_THREADS"
    maps_to: "resources.max_threads"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_PARTITION_STRATEGY"
    maps_to: "partition_hints.strategy"
  - key: "BLS_CW_CHUNK_SIZE_MB"
    maps_to: "io.chunk_size_mb"
  - key: "BLS_CW_MAX_ERRORS"
    maps_to: "error_handling.max_errors"

logging:
  level: "info"
  structured: true
  output_file: "cw_processing.log"

error_handling:
  on_error: "continue"
  max_errors: 5000
  log_errors: true
  error_file: "cw_errors.log"
  
  checkpoint:
    enabled: true
    interval_records: 100000
    checkpoint_dir: "checkpoints/cw"
    
  recovery:
    auto_retry: true
    max_retries: 3
    backoff_seconds: [5, 15, 30]
    
  notifications:
    on_failure: true
    on_success: false
    channels: ["log", "file"]

performance:
  monitoring:
    enabled: true
    metrics_interval_seconds: 60
    memory_threshold_mb: 8000
    
  optimization:
    auto_tune_threads: false
    auto_tune_chunk_size: false
    cache_lookup_tables: true