config_version: 1
strategy:
  mode: "exclusive"
  max_concurrency: 1

resources:
  max_threads: 8
  memory_limit_gb: 16

io:
  chunk_size_mb: 100
  buffer_pool_size: 16

features:
  use_mmap: true
  enable_statistics: true
  enable_profiling: false

transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_decimal(value, 18, 4)"
  - id: "validate_series_id"
    expr: "matches(series_id, '^CW[SU][RS]\\d{4}[A-Z0-9]{2,8}$')"