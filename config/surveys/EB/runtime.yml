# EB Survey Runtime Configuration
# Feature flags, env overrides mapping, logging
config_version: 1

feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  enable_checkpoints: true
  enable_parallel_processing: false

environment_overrides:
  - key: "BLS_EB_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_EB_MAX_THREADS"
    maps_to: "resources.max_threads"
  - key: "BLS_EB_CHUNK_SIZE_MB"
    maps_to: "io.chunk_size_mb"
  - key: "BLS_EB_MAX_ERRORS"
    maps_to: "policy.max_errors"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_PARTITION_STRATEGY"
    maps_to: "partition_hints.strategy"

logging:
  level: "info"
  structured: true

checkpoint:
  enabled: true
  interval_records: 10000
  checkpoint_dir: "checkpoints/eb"

error_handling:
  on_error: "continue"
  max_errors: 1000
  log_errors: true
  error_file: "eb_errors.log"

lookup_config:
  preload: ["period", "type", "seasonal"]
  lazy: ["footnote", "title"]
  mmap: []
  cache_all: true
# Performance monitoring
monitoring:
  enabled: true  # Required field for MonitoringConfig
  metrics_endpoint: null
  health_check_interval: 60
