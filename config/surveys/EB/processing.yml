config_version: 1
strategy:
  mode: "in_memory"
  max_concurrency: 1

resources:
  max_threads: 2
  memory_limit_gb: 4

io:
  chunk_size_mb: 64
  buffer_pool_size: 4

features:
  use_mmap: true
  enable_statistics: true
  enable_profiling: false

transforms:
  - id: "sort_data"
    expr: "sort_by(series_id, year, period)"
  - id: "deduplicate_data"
    expr: "deduplicate_on(series_id, year, period, footnote_codes)"