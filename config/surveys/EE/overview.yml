definition: |
  The following is a definition of: EMPLOYMENT, HOURS, AND EARNINGS--NATIONAL (EE)

  Survey Description: The Current Employment Statistics Program provides 
  employment, paid hours, and earnings information on a national basis in 
  considerable industrial detail. The Bureau of Labor Statistics cooperates 
  with State agencies in collecting data each month from a sample of 
  establishments in all nonfarm activities including government.

  The data include series for total employment, number of women employed, 
  number of production or nonsupervisory workers, average hourly earnings, 
  average weekly hours, average weekly earnings, and average weekly overtime 
  hours in manufacturing industries.

  A sample of about 375,000 employer units with over 40 percent of total 
  payroll employment is utilized for this monthly mail survey. For hours and 
  earnings of production or nonsupervisory workers in private, nonagricultural
  industries, the sample contains about 300,000 employer units.

  Summary Data Available: For all employees, women, and production or 
  nonsupervisory workers, over 1,600 published monthly employment series are 
  available. The series for all employees include over 600 industries at 
  various levels of aggregation.

  Over 1,750 published monthly series for production workers' average weekly 
  earnings, average hourly earnings, average weekly hours, and, in 
  manufacturing, average weekly overtime hours are available.
