config_version: 1
expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "category_code", "datatype_code", "casetype_code", "begin_year", "begin_period", "end_year", "end_period"] }
  ranges:
    - { file: "main", column: "year", min: 1992, max: 2055 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "series", column: "begin_year", min: 1992, max: 2067 }
    - { file: "series", column: "end_year", min: 1992, max: 2067 }
  enums:
    - { file: "main", column: "period", values: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"] }
    - { file: "series", column: "begin_period", values: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"] }
    - { file: "series", column: "end_period", values: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"] }
  regex:
    - { file: "main", column: "series_id", pattern: "^HC[U]\\w{15}$" }
    - { file: "series", column: "series_id", pattern: "^HC[U]\\w{15}$" }
    - { file: "main", column: "period", pattern: "^(A01|M\\d{2}|Q\\d{2})$" }
  length:
    - { file: "series", column: "series_id", exact: 17 }
    - { file: "main", column: "series_id", exact: 17 }
  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "min(year)", "max(year)", "distinct(period)"]
  persist: true

policy:
  mode: "fail_on_error"
  sample_on_fail_rows: 50

validation_rules:
  data_file:
    - field: "value"
      rule: "range"
      min: -10000000000000000.0
      max: 10000000000000000.0
      action: "flag"
    - field: "year"
      rule: "range"
      min: 1992
      max: 2055
      action: "reject"
    - field: "series_id"
      rule: "pattern"
      pattern: "^HC[U]\\w{15}$"
      action: "flag"
    - field: "period"
      rule: "values"
      allowed: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"]
      action: "flag"
  
  series_file:
    - field: "series_id"
      rule: "pattern"
      pattern: "^HC[U]\\w{15}$"
      action: "flag"
      message: "Invalid series ID format: should be HC[U] followed by 15 characters"
    - field: "series_id"
      rule: "length"
      exact: 17
      action: "reject"
      message: "Series ID must be exactly 17 characters"
    - field: "series_id"
      rule: "required"
      action: "reject"
      message: "Series ID cannot be null"
    - field: "begin_year"
      rule: "range"
      min: 1992
      max: 2067
      action: "reject"
      message: "Begin year must be between 1992 and 2067"
    - field: "begin_year"
      rule: "numeric"
      action: "reject"
      message: "Begin year must be numeric"
    - field: "end_year"
      rule: "range"
      min: 1992
      max: 2067
      action: "reject"
      message: "End year must be between 1992 and 2067"
    - field: "end_year"
      rule: "numeric"
      action: "reject"
      message: "End year must be numeric"
    - field: "end_year"
      rule: "greater_than_or_equal"
      compare_field: "begin_year"
      action: "reject"
      message: "End year must be >= begin year"
    - field: "begin_period"
      rule: "values"
      allowed: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"]
      action: "flag"
      message: "Invalid begin period value"
    - field: "end_period"
      rule: "values"
      allowed: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"]
      action: "flag"
      message: "Invalid end period value"

completeness:
  required_fields:
    main: ["series_id", "year", "period"]
    series: ["series_id", "category_code", "datatype_code", "casetype_code", "begin_year", "begin_period", "end_year", "end_period"]
  nullable_fields:
    main: ["value", "footnote_codes"]
    series: ["footnote_codes"]

uniqueness:
  constraints:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }