# HC Survey Quality Configuration
# Data quality expectations, validations, and thresholds
config_version: 1

# Required checks field for QualityConfig
checks:
  - name: "series_id_not_null"
    check_type: "completeness"
    parameters:
      columns: ["series_id"]
    severity: "error"
  
  - name: "year_range_check" 
    check_type: "validity"
    parameters:
      column: "year"
      min: 1992
      max: 2055
    severity: "error"
    
  - name: "unique_series_combination"
    check_type: "uniqueness"
    parameters:
      columns: ["series_id", "year", "period"]
    severity: "error"

# Required validation field for QualityConfig
validation:
  strict_mode: true
  fail_on_error: false
  max_errors: 2000

expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "category_code", "datatype_code", "casetype_code", "begin_year", "begin_period", "end_year", "end_period"] }
  ranges:
    - { file: "main", column: "year", min: 1992, max: 2055 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "series", column: "begin_year", min: 1992, max: 2067 }
    - { file: "series", column: "end_year", min: 1992, max: 2067 }
  enums:
    - { file: "main", column: "period", values: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"] }
    - { file: "series", column: "begin_period", values: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"] }
    - { file: "series", column: "end_period", values: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"] }
  regex:
    - { file: "main", column: "series_id", pattern: "^HC[U]\\w{15}$" }
    - { file: "series", column: "series_id", pattern: "^HC[U]\\w{15}$" }
    - { file: "main", column: "period", pattern: "^(A01|M\\d{2}|Q\\d{2})$" }
  length:
    - { file: "series", column: "series_id", exact: 17 }
    - { file: "main", column: "series_id", exact: 17 }
  lookup_exists:
    - { file: "series", column: "category_code", lookup_table: "category2" }
    - { file: "series", column: "datatype_code", lookup_table: "datatype" }
    - { file: "series", column: "casetype_code", lookup_table: "case" }
    - { file: "series", column: "age_code", lookup_table: "age" }
    - { file: "series", column: "race_code", lookup_table: "race" }
    - { file: "series", column: "gender_code", lookup_table: "gender" }
    - { file: "series", column: "pob_code", lookup_table: "pob" }
    - { file: "series", column: "event_code", lookup_table: "event" }
    - { file: "series", column: "source_code", lookup_table: "source" }
    - { file: "series", column: "occupation_code", lookup_table: "occupation" }
    - { file: "series", column: "nature_code", lookup_table: "nature" }
    - { file: "series", column: "industry_code", lookup_table: "industry" }
    - { file: "series", column: "los_code", lookup_table: "los" }

  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }
    - { file: "series", validation: "(end_year > begin_year) OR (end_year == begin_year AND end_period >= begin_period)", message: "End date must be after or equal to begin date" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "min(year)", "max(year)", "distinct(period)"]
  persist: true

policy:
  mode: "continue"
  max_errors: 2000
  sample_on_fail_rows: 50
  log_errors: true
  error_file: "hc_errors.log"

actions:
  value_range_violation: "flag"
  year_range_violation: "reject"
  series_id_format_violation: "flag"
  period_enum_violation: "flag"
  category_code_format_violation: "flag"
  datatype_code_format_violation: "flag"
  casetype_code_format_violation: "flag"
  lookup_missing: "flag"
  cross_field_violation: "reject"
  length_violation: "reject"
  required_field_missing: "reject"

validation_rules:
  data_file:
    - field: "value"
      rule: "range"
      min: -10000000000000000.0
      max: 10000000000000000.0
      action: "flag"
    - field: "year"
      rule: "range"
      min: 1992
      max: 2055
      action: "reject"
    - field: "series_id"
      rule: "pattern"
      pattern: "^HC[U]\\w{15}$"
      action: "flag"
    - field: "period"
      rule: "values"
      allowed: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"]
      action: "flag"
  
  series_file:
    - field: "series_id"
      rule: "pattern"
      pattern: "^HC[U]\\w{15}$"
      action: "flag"
      message: "Invalid series ID format: should be HC[U] followed by 15 characters"
    - field: "series_id"
      rule: "length"
      exact: 17
      action: "reject"
      message: "Series ID must be exactly 17 characters"
    - field: "series_id"
      rule: "required"
      action: "reject"
      message: "Series ID cannot be null"
    - field: "begin_year"
      rule: "range"
      min: 1992
      max: 2067
      action: "reject"
      message: "Begin year must be between 1992 and 2067"
    - field: "begin_year"
      rule: "numeric"
      action: "reject"
      message: "Begin year must be numeric"
    - field: "end_year"
      rule: "range"
      min: 1992
      max: 2067
      action: "reject"
      message: "End year must be between 1992 and 2067"
    - field: "end_year"
      rule: "numeric"
      action: "reject"
      message: "End year must be numeric"
    - field: "end_year"
      rule: "greater_than_or_equal"
      compare_field: "begin_year"
      action: "reject"
      message: "End year must be >= begin year"
    - field: "begin_period"
      rule: "values"
      allowed: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"]
      action: "flag"
      message: "Invalid begin period value"
    - field: "end_period"
      rule: "values"
      allowed: ["A01", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05"]
      action: "flag"
      message: "Invalid end period value"

completeness:
  required_fields:
    main: ["series_id", "year", "period"]
    series: ["series_id", "category_code", "datatype_code", "casetype_code", "begin_year", "begin_period", "end_year", "end_period"]
  nullable_fields:
    main: ["value", "footnote_codes"]
    series: ["footnote_codes"]

uniqueness:
  constraints:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }