config_version: 1
# Production environment overrides for HC survey

processing:
  resources:
    max_threads: 8
    memory_limit_gb: 16
  
  features:
    enable_profiling: false

quality:
  policy:
    mode: "fail_on_error"
    sample_on_fail_rows: 50

logging:
  level: "warn"

error_handling:
  max_errors: 2000  # Production threshold from original config

output:
  format: "parquet"  # Optimized format for production
  parquet:
    compression: "zstd"
    compression_level: 3

feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true