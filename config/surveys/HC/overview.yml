config_version: 1

survey:
  code: "HC"
  name: "Occupational Injuries and Illnesses - Characteristics Data"
  description: "Besides injury and illness counts, survey respondents also are asked to provide additional information for a subset of the most serious nonfatal cases logged, namely, those that involved at least 1 day away from work, beyond the day of injury or onset of illness. Employers answer several questions about these cases, including the demographics of the worker disabled, the nature of the disabling condition, and the event and source producing that condition."
