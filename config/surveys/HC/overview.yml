    time_series_count: "Occupational injury and illness characteristics series"
    classification_system: "Age, category, event, gender, industry, length of service, nature, occupation, part of body, race, and source"
    update_schedule: "OSHS Characteristics data are published annually"
    begin_year: 1992
    survey_methodology: "Survey respondents provide additional information for a subset of the most serious nonfatal cases logged, namely, those that involved at least 1 day away from work, beyond the day of injury or onset of illness."
    calculation_basis: "Characteristics data collection for serious workplace injury and illness cases"

