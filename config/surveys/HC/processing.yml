config_version: 1
strategy:
  mode: "chunked"
  max_concurrency: 1

resources:
  max_threads: 4
  memory_limit_gb: 8

io:
  chunk_size_mb: 50
  buffer_pool_size: 8

features:
  use_mmap: true
  enable_statistics: true
  enable_profiling: false

transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_decimal(value, 18, 4)"