# HC Survey Output Configuration
# Output formats, partitioning, compression
config_version: 1

# Required formats field as array
formats: ["csv"]

# Required output directory and filename pattern
output_dir: "data/processed/bls/HC"
filename_pattern: "{survey}_{table}_{timestamp}"
create_subdirs: true

csv:
  delimiter: ","
  quote_char: "\""
  escape_char: "\\"
  header: true
  null_value: ""

partitioning:
  enabled: true
  partition_by: ["year"]
  max_file_size_mb: 512

naming:
  dataset: "bls_hc"
  version: "v1"

evolution:
  mode: "compatible"
  allow_nullability_change: false

destination:
  base_path: "data/processed/bls/HC"

transformations:
  sort_by: ["series_id", "year", "period"]
  deduplicate: true
  deduplicate_on: ["series_id", "year", "period", "footnote_codes"]

statistics:
  enabled: true
  columns: ["year", "period", "value"]

data_series:
  basic_load:
    format: "csv"
    partitioning:
      enabled: true
      partition_by: ["year"]
    transformations:
      sort_by: ["series_id", "year", "period"]
      deduplicate: true
      deduplicate_on: ["series_id", "year", "period", "footnote_codes"]
    statistics:
      enabled: true
      columns: ["year", "period", "value"]

data_dict:
  basic_load:
    format: "csv"
    partitioning:
      enabled: false
    output_file: "hc_series_dict.csv"
    mapping:
      category_code:
        lookup_table: "category2"
        lookup_key: "category_code"
        lookup_value: "category_text"
        create_field: "category_text"
        on_missing: "UNKNOWN_CATEGORY"
        cache: true
      datatype_code:
        lookup_table: "datatype"
        lookup_key: "datatype_code"
        lookup_value: "datatype_text"
        create_field: "datatype_text"
        on_missing: "UNKNOWN_DATATYPE"
        cache: true
      casetype_code:
        lookup_table: "case"
        lookup_key: "case_code"
        lookup_value: "case_text"
        create_field: "casetype_text"
        on_missing: "UNKNOWN_CASETYPE"
        cache: true
      age_code:
        lookup_table: "age"
        lookup_key: "age_code"
        lookup_value: "age_text"
        create_field: "age_text"
        on_missing: "UNKNOWN_AGE"
        cache: true
      race_code:
        lookup_table: "race"
        lookup_key: "race_code"
        lookup_value: "race_text"
        create_field: "race_text"
        on_missing: "UNKNOWN_RACE"
        cache: true
      gender_code:
        lookup_table: "gender"
        lookup_key: "gender_code"
        lookup_value: "gender_text"
        create_field: "gender_text"
        on_missing: "UNKNOWN_GENDER"
        cache: true
      pob_code:
        lookup_table: "pob"
        lookup_key: "pob_code"
        lookup_value: "pob_text"
        create_field: "pob_text"
        on_missing: "UNKNOWN_POB"
        cache: true
      event_code:
        lookup_table: "event"
        lookup_key: "event_code"
        lookup_value: "event_text"
        create_field: "event_text"
        on_missing: "UNKNOWN_EVENT"
        cache: true
      source_code:
        lookup_table: "source"
        lookup_key: "source_code"
        lookup_value: "source_text"
        create_field: "source_text"
        on_missing: "UNKNOWN_SOURCE"
        cache: true
      occupation_code:
        lookup_table: "occupation"
        lookup_key: "occupation_code"
        lookup_value: "occupation_text"
        create_field: "occupation_text"
        on_missing: "UNKNOWN_OCCUPATION"
        cache: true
      nature_code:
        lookup_table: "nature"
        lookup_key: "nature_code"
        lookup_value: "nature_text"
        create_field: "nature_text"
        on_missing: "UNKNOWN_NATURE"
        cache: true
      industry_code:
        lookup_table: "industry"
        lookup_key: "industry_code"
        lookup_value: "industry_text"
        create_field: "industry_text"
        on_missing: "UNKNOWN_INDUSTRY"
        cache: true
      los_code:
        lookup_table: "los"
        lookup_key: "los_code"
        lookup_value: "los_text"
        create_field: "los_text"
        on_missing: "UNKNOWN_LOS"
        cache: true
      footnote_codes:
        lookup_table: "footnote"
        lookup_key: "footnote_code"
        lookup_value: "footnote_text"
        create_field: "footnote_texts"
        multiple: true
        separator: " "
        on_missing: "skip"
        cache: true
    transformations:
      sort_by: ["series_id"]
      deduplicate: false
      deduplicate_on: ["series_id"]
    statistics:
      enabled: true
      columns: ["series_id", "category_code", "datatype_code", "begin_year", "end_year"]
      output_file: "hc_series_dict_stats.json"