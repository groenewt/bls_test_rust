# MP Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/mp"
  include: ["mp.series", "mp.data.*", "mp.duration", "mp.footnote", "mp.measure", "mp.period", "mp.sector"]
  exclude: ["*.tmp", ".*", "*~", "*.bak"]

combining:
  enabled: false
  strategy: "none"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "size_based"
  max_partition_size_mb: 256
  partition_by: []
  
mmap:
  enable_for_mb_greater_than: 200
  
# Lookup file loading strategy
lookup_strategy:
  preload: ["measure", "sector"]
  lazy: ["footnote", "period", "duration"]
  mmap: []
  cache_all: true
