config_version: 1
strategy:
  mode: "chunked"
  max_concurrency: 4

resources:
  max_threads: 4
  memory_limit_gb: 8

io:
  chunk_size_mb: 50
  buffer_pool_size: 8

features:
  use_mmap: true
  enable_statistics: true
  enable_profiling: false

transforms:
  - id: "sort_data"
    expr: "sort_by([series_id, year, period])"
  - id: "deduplicate"
    expr: "deduplicate_on([series_id, year, period, footnote_codes])"