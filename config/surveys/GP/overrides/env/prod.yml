config_version: 1
# Production environment overrides for GP survey

processing:
  strategy:
    max_concurrency: 4
  resources:
    max_threads: 8
    memory_limit_gb: 16

features:
  enable_profiling: false
  use_mmap: true

logging:
  level: "warn"
  structured: true

error_handling:
  max_errors: 2000
  on_error: "continue"

quality:
  policy:
    mode: "fail_on_error"
    sample_on_fail_rows: 50

output:
  partitioning:
    max_file_size_mb: 1024

checkpoint:
  enabled: true
  interval_records: 100000