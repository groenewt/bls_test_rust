config_version: 1
expectations:
  non_null:
    - { file: "series", columns: ["series_id", "area_type_code", "state_code", "area_code", "labor_force_code", "charact_code", "begin_year", "begin_period", "end_year", "end_period"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
  
  ranges:
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "main", column: "year", min: 1981, max: 2055 }
    - { file: "series", column: "begin_year", min: 1981, max: 2067 }
    - { file: "series", column: "end_year", min: 1981, max: 2067 }
  
  enums:
    - { file: "main", column: "period", values: ["A01"] }
    - { file: "series", column: "begin_period", values: ["A01"] }
    - { file: "series", column: "end_period", values: ["A01"] }
  
  regex:
    - { file: "series", column: "series_id", pattern: "^GP[U]\\d{15}$" }
    - { file: "main", column: "series_id", pattern: "^GP[U]\\d{15}$" }
  
  length:
    - { file: "series", column: "series_id", exact: 17 }
    - { file: "main", column: "series_id", exact: 17 }
  
  cross_field:
    - { file: "series", validation: "end_year >= begin_year OR (end_year IS NULL AND begin_year IS NULL)", message: "End year must be >= begin year" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "distinct(state_code)", "distinct(year)"]
  persist: true

policy:
  mode: "fail_on_error"
  sample_on_fail_rows: 50
  max_errors: 2000

validation_rules:
  data_series:
    rules:
      - field: "value"
        rule: "range"
        min: -10000000000000000.0
        max: 10000000000000000.0
        action: "flag"
      
      - field: "year"
        rule: "range"
        min: 1981
        max: 2055
        action: "reject"
      
      - field: "series_id"
        rule: "pattern"
        pattern: "^GP[U]\\d{15}$"
        action: "flag"
      
      - field: "period"
        rule: "values"
        allowed: ["A01"]
        action: "flag"
    
    required_fields: ["series_id", "year", "period"]
    nullable_fields: ["value", "footnote_codes"]

  series_dict:
    rules:
      - field: "series_id"
        rule: "pattern"
        pattern: "^GP[U]\\d{15}$"
        action: "flag"
        message: "Invalid series ID format: should be GP[U] followed by 15 digits"
      
      - field: "series_id"
        rule: "length"
        exact: 17
        action: "reject"
        message: "Series ID must be exactly 17 characters"
      
      - field: "series_id"
        rule: "required"
        action: "reject"
        message: "Series ID cannot be null"
      
      - field: "begin_year"
        rule: "range"
        min: 1981
        max: 2067
        action: "reject"
        message: "Begin year must be between 1981 and 2067"
      
      - field: "begin_year"
        rule: "numeric"
        action: "reject"
        message: "Begin year must be numeric"
      
      - field: "end_year"
        rule: "range"
        min: 1981
        max: 2067
        action: "reject"
        message: "End year must be between 1981 and 2067"
      
      - field: "end_year"
        rule: "numeric"
        action: "reject"
        message: "End year must be numeric"
      
      - field: "end_year"
        rule: "greater_than_or_equal"
        compare_field: "begin_year"
        action: "reject"
        message: "End year must be >= begin year"
      
      - field: "begin_period"
        rule: "values"
        allowed: ["A01"]
        action: "flag"
        message: "Invalid begin period value"
      
      - field: "end_period"
        rule: "values"
        allowed: ["A01"]
        action: "flag"
        message: "Invalid end period value"
      
      - field: "end_year"
        rule: "date_logic_check"
        check_fields: ["begin_year"]
        validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
        action: "flag"
        message: "End date must be after or equal to begin date"
    
    required_fields: ["series_id", "area_type_code", "state_code", "area_code", "labor_force_code", "charact_code", "begin_year", "begin_period", "end_year", "end_period"]
    nullable_fields: ["footnote_codes"]
    unique_fields: ["series_id"]

statistics:
  enabled: true
  data_series:
    columns: ["year", "period", "value"]
  series_dict:
    columns: ["series_id", "state_code", "area_code", "labor_force_code", "begin_year", "end_year"]
    output_file: "gp_series_dict_stats.json"