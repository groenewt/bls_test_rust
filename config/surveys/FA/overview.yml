definition: |
  The following is a definition of: FATAL OCCUPATIONAL INJURIES

  Program Description: Fatal occupational injuries survey provides comprehensive
  data on workplace fatalities and safety conditions across industries and 
  occupations, helping to identify safety trends and inform policy decisions.

  Summary Data Available: Annual data on Fatal Occupational Injuries are
  collected through the Census of Fatal Occupational Injuries (CFOI) program.
  This program provides a comprehensive count of fatal work injuries occurring
  during the calendar year. The data include all work-related fatalities that
  meet the CFOI criteria for workplace injuries and illnesses.

  The Fatal Occupational Injuries data allow for analysis of workplace safety
  trends by industry, occupation, demographic characteristics, and cause of
  injury. This longitudinal data helps identify high-risk occupations and
  industries, enabling targeted safety interventions and policy development.
  The data are essential for workplace safety research, policy development,
  and regulatory oversight of occupational safety and health standards.