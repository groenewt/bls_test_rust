# CF Survey Processing Configuration
config_version: 1

strategy:
  mode: "chunked"     # in_memory|chunked|parallel|streaming|exclusive
  max_concurrency: 1

resources:
  max_threads: 4
  memory_limit_gb: 8

io:
  chunk_size_mb: 20
  buffer_pool_size: 8

features:
  use_mmap: true
  enable_statistics: true
  enable_profiling: false

transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_int32(value)"

error_handling:
  on_error: "continue"  # Continue processing other records
  max_errors: 1000      # Stop if too many errors
  log_errors: true
  error_file: "cf_errors.log"

checkpoint:
  enabled: true  # Enable for medium-sized data
  interval_records: 50000
  checkpoint_dir: "checkpoints/cf"