# PR Survey Production Environment Overrides
config_version: 1

# Production-specific settings
logging:
  level: "warn"

# Maximum resource limits for production
resources:
  max_threads: 8
  memory_limit_gb: 16

# Strict error handling for production
error_handling:
  max_errors: 1000
  on_error: "continue"

# Disable profiling in production
features:
  enable_profiling: false
  enable_statistics: true

# Production checkpoint settings
checkpoint:
  enabled: true
  interval_records: 100000