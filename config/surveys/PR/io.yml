# PR Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/pr"
  include: ["pr.series", "pr.data.*", "pr.class", "pr.duration", "pr.footnote", "pr.measure", "pr.period", "pr.seasonal", "pr.sector"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year", "sector_code"]

mmap:
  enable_for_mb_greater_than: 200

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
