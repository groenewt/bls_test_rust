    name: "groenewt"
    email: ""

documentation:
  primary: "docs/bls/survey/pr.txt"
  data_dictionary: ""
  notes: |
    - Data location: data/raw/bls/pr
    - Data files are in ASCII text format
    - Series available quarterly and annually
    - Base period for indexes: 2005 = 100
    - Full doc: docs/bls/survey/pr.txt

