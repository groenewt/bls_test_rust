          subcell_code:
            length: 2
            type: str
            example_value: "25"
          subcell_text:
            length: 100
            type: str
            example_value: "Full Time"
          display_level:
            length: 2
            type: str
            example_value: "2"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 5
            type: str
            example_value: "31"

processing:
  # Strategy for medium survey
  strategy: chunked  # Process in chunks due to size
  max_threads: 4     # Increased parallelization for medium-sized data
  
  # Chunk settings
  chunk_size_mb: 50
  buffer_pool_size: 8
  
  # Performance hints
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: false

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: true  # Partition by year for time-series analysis
        partition_by: [year]
      use_mmap: true
      series_size_class: Medium
      list_data_files: [ cm.data.0.Current, cm.data.1.AllData ]
      partition_strategy:
        partion_by: "datatype_code"
        file_format: "cm.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period, footnote_codes]

          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 2008
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^CM[U]\\d{15}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "Q01", "Q02", "Q03", "Q04" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

    aspect_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: true  # Partition by year for time-series analysis
        partition_by: [year]
      use_mmap: true
      series_size_class: Medium
      list_data_files: [ map/cm.aspect ]
      partition_strategy:
        partion_by: "aspect_type"
        file_format: "map/cm.aspect.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period, aspect_type]
          deduplicate: true
          deduplicate_on: [series_id, year, period, aspect_type]

          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 2008
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^CM[U]\\d{15}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "Q01", "Q02", "Q03", "Q04" ]
                action: flag #flag while testing
              
              - field: aspect_type
                rule: values
                allowed: [ "R0" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period, aspect_type ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, aspect_type, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: true
      series_size_class: Medium
      output_file: "cm_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # Seasonal code mapping
        seasonal:
          lookup_table: "seasonal"
          lookup_key: "seasonal"
          lookup_value: "seasonal_text"
          create_field: "seasonal_text"
          on_missing: "UNKNOWN_SEASONAL"
          cache: true
        
        # Owner code mapping
        owner_code:
          lookup_table: "owner"
          lookup_key: "owner_code"
          lookup_value: "owner_text"
          create_field: "owner_text"
          on_missing: "UNKNOWN_OWNER"
          cache: true
        
        # Industry code mapping
        industry_code:
          lookup_table: "industry"
          lookup_key: "industry_code"
          lookup_value: "industry_text"
          create_field: "industry_text"
          on_missing: "UNKNOWN_INDUSTRY"
          cache: true
        
        # Occupation code mapping
        occupation_code:
          lookup_table: "occupation"
          lookup_key: "occupation_code"
          lookup_value: "occupation_text"
          create_field: "occupation_text"
          on_missing: "UNKNOWN_OCCUPATION"
          cache: true
        
        # Subcell code mapping
        subcell_code:
          lookup_table: "subcell"
          lookup_key: "subcell_code"
          lookup_value: "subcell_text"
          create_field: "subcell_text"
          on_missing: "UNKNOWN_SUBCELL"
          cache: true
        
        # Area code mapping
        area_code:
          lookup_table: "area"
          lookup_key: "area_code"
          lookup_value: "area_text"
          create_field: "area_text"
          on_missing: "UNKNOWN_AREA"
          cache: true
        
        # Datatype code mapping
        datatype_code:
          lookup_table: "datatype"
          lookup_key: "datatype_code"
          lookup_value: "datatype_text"
          create_field: "datatype_text"
          on_missing: "UNKNOWN_DATATYPE"
          cache: true
        
        # Estimate code mapping
        estimate_code:
          lookup_table: "estimate"
          lookup_key: "estimate_code"
          lookup_value: "estimate_text"
          create_field: "estimate_text"
          on_missing: "UNKNOWN_ESTIMATE"
          cache: true
        
        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^CM[U]\\d{15}$"
            action: flag
            message: "Invalid series ID format: should be CM[U] followed by 15 digits"
          
          - field: series_id
            rule: length
            exact: 17
            action: reject
            message: "Series ID must be exactly 17 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 2008
            max: 2067
            action: reject
            message: "Begin year must be between 2008 and 2067"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 2008
            max: 2067
            action: reject
            message: "End year must be between 2008 and 2067"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "Q01", "Q02", "Q03", "Q04" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "Q01", "Q02", "Q03", "Q04" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, seasonal, owner_code, industry_code, occupation_code, subcell_code, area_code, datatype_code, estimate_code, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ series_title, footnote_codes ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, owner_code, industry_code, occupation_code, begin_year, end_year ]
        output_file: "cm_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 2000    # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "cm_errors.log"
  
  # Checkpoint settings
  checkpoint:
    enabled: true  # Enable checkpoints for medium-sized data
    interval_records: 50000
    checkpoint_dir: "checkpoints/cm"