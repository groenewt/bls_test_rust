    preload: [ area, industry, occupation, owner ]  # Small, frequently used
    lazy: [ footnote, datatype, estimate, subcell, seasonal ]  # Load on demand
    mmap: [ ] # use it for large files
    cache_all: true  # Small enough to keep in memory
  files:
    area:
        file_path: "cm.area"
        name: Area
        description: "Geographic area for the estimate"
        index_col: "area_code"
        schema:
          area_code:
            length: 5
            type: str
            example_value: "99999"
          area_text:
            length: 100
            type: str
            example_value: "National"
          display_level:
            length: 2
            type: str
            example_value: "0"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 5
            type: str
            example_value: "1"

    datatype:
        file_path: "cm.datatype"
        name: Data Type
        description: "Identifies measurement type"
        index_col: "datatype_code"
        schema:
          datatype_code:
            length: 1
            type: str
            example_value: "D"
          datatype_text:
            length: 100
            type: str
            example_value: "Cost per hour worked"
          display_level:
            length: 2
            type: str
            example_value: "0"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 5
            type: str
            example_value: "39"

    estimate:
        file_path: "cm.estimate"
        name: Estimate
        description: "Identifies the type and unit of measure for the estimate"
        index_col: "estimate_code"
        schema:
          estimate_code:
            length: 2
            type: str
            example_value: "03"
          estimate_text:
            length: 100
            type: str
            example_value: "Total Benefits"
          display_level:
            length: 2
            type: str
            example_value: "1"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 5
            type: str
            example_value: "3"

    footnote:
        file_path: "cm.footnote"
        name: Footnotes
        description: "Footnotes for the series or observations"
        index_col: "footnote_code"
        schema:
          footnote_code:
            length: 3
            type: str
            example_value: "b"
          footnote_text:
            length: 200
            type: str
            example_value: "Less than .05 percent"

    industry:
        file_path: "cm.industry"
        name: Industry
        description: "Identifies the industry sector for the estimate, as classified by NAICS"
        index_col: "industry_code"
        schema:
          industry_code:
            length: 6
            type: str
            example_value: "622000"
          industry_text:
            length: 100
            type: str
            example_value: "Hospitals"
          display_level:
            length: 2
            type: str
            example_value: "4"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 5
            type: str
            example_value: "1625"

    occupation:
        file_path: "cm.occupation"
        name: Occupation
        description: "Identifies the occupational group for the estimate as classified by SOC"
        index_col: "occupation_code"
        schema:
          occupation_code:
            length: 6
            type: str
            example_value: "414300"
          occupation_text:
            length: 100
            type: str
            example_value: "Sales and office occupations"
          display_level:
            length: 2
            type: str
            example_value: "1"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 5
            type: str
            example_value: "760"

    owner:
        file_path: "cm.owner"
        name: Ownership
        description: "Identifies the sector represented by the estimate"
        index_col: "owner_code"
        schema:
          owner_code:
            length: 1
            type: str
            example_value: "2"
          owner_text:
            length: 100
            type: str
            example_value: "Private industry workers"
          display_level:
            length: 2
            type: str
            example_value: "0"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 5
            type: str
            example_value: "2"

    seasonal:
        file_path: "cm.seasonal"
        name: Seasonal Adjustment
        description: "Seasonality indicator"
        index_col: "seasonal"
        schema:
          seasonal:
            length: 1
            type: str
            example_value: "U"
          seasonal_text:
            length: 30
            type: str
            example_value: "Not seasonally adjusted"

    subcell:
        file_path: "cm.subcell"
        name: Subcell
        description: "Job characteristic code identifying the attributes of workers or establishments"
        index_col: "subcell_code"
