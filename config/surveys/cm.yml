# changes:

#General Survey Information
survey:
  code: cm #survey code (ex.ap,sm,tu)- see docs (.docs/surveys/* for all surveys)
  name: Employer Costs for Employee Compensation #friendly survey name
  size_class: medium #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  description: "The Employer Costs for Employee Compensation (ECEC) is a measure of the cost of labor. The compensation series includes wages and salaries plus employer costs for individual employee benefits."
  definition: "
The following is a definition of: Employer Costs for Employee Compensation (CM)

Survey Description: The Employer Costs for Employee Compensation (ECEC) is a measure
of the cost of labor. The compensation series includes wages and salaries plus employer
costs for individual employee benefits. Employee benefit costs are calculated as cost-
per-hour-worked for individual benefits ranging from employer payments for Social 
Security to paid time off for holidays.

The survey covers all occupations in the civilian economy, which includes the total 
private economy (excluding farms and households), and the public sector (excluding the 
federal government). Statistics are published for the private and public sectors 
separately, and the data are combined in a measure for the civilian economy.

The data are collected from a probability sample of about 27,200 occupations with 6,600 
sample establishments in private industry and about 8,000 occupations within 1,400 
state and local government establishments. The sample establishments are classified in 
industry categories based on the North American Industrial Classification System 
(NAICS). Within an establishment, specific job categories are selected to represent 
broader occupational definitions. Jobs are classified according to the Standard 
Occupational Classification (SOC) system. 

Summary Data Available: For private industry workers, data are 
available for total compensation costs, for wages and salaries alone, and 
for individual benefit costs alone. Data are available by major occupational
and industry groups, as well as by census region, census division, and bargaining 
status. Annual estimates of the 15 largest metropolitan areas are published for the 
March reference for total compensation, wages and salaries, as well as total benefits.

For state and local government and civilian workers data are available for major 
occupational and selected industry series. 

Frequency of Observations: Data are available on a quarterly basis.

Data Characteristics: All costs per hour worked are published to the nearest
cent. All percents are published to one decimal place (including relative standard 
errors).

Updating Schedule: Updates are available about ten weeks following the end
of the reference period. Reference periods are the months of March, June, September,
and December.
                "
  characteristics:
    frequency: quarterly
    coverage: "The survey covers all occupations in the civilian economy, which includes the total private economy (excluding farms and households), and the public sector (excluding the federal government)."
    time_series_count: "Employer Costs for Employee Compensation time series data" 
    classification_system: "North American Industrial Classification System (NAICS) and Standard Occupational Classification (SOC) system"
    update_schedule: "Quarterly release, about ten weeks following the end of the reference period"
    begin_year: 2008
    survey_methodology: "The data are collected from a probability sample of about 27,200 occupations with 6,600 sample establishments in private industry and about 8,000 occupations within 1,400 state and local government establishments."
    calculation_basis: "Employee benefit costs are calculated as cost-per-hour-worked for individual benefits."

#Survey Series Information
series:
  path: "cm.series" #path to series file
  use_mmap: true
  series_size_class: Medium #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  idx_col: "series_id"
  schema:
    series_id:
      length: 17 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
      type: Text
      example_value: "CMU1010000100000P"
      map_file: "" #leave blank for none
    seasonal:
      length: 1
      type: Text
      example_value: "U"
      needs_mapping: true
      map_file: "seasonal" #leave blank for none
    owner_code:
      length: 1
      type: Text
      example_value: "1"
      needs_mapping: true
      map_file: "owner" #leave blank for none
    industry_code:
      length: 6
      type: Text
      example_value: "000000"
      needs_mapping: true
      map_file: "industry" #leave blank for none
    occupation_code:
      length: 6
      type: Text
      example_value: "000000"
      needs_mapping: true
      map_file: "occupation" #leave blank for none
    subcell_code:
      length: 2
      type: Text
      example_value: "00"
      needs_mapping: true
      map_file: "subcell" #leave blank for none
    area_code:
      length: 5
      type: Text
      example_value: "99999"
      needs_mapping: true
      map_file: "area" #leave blank for none
    datatype_code:
      length: 1
      type: Text
      example_value: "P"
      needs_mapping: true
      map_file: "datatype" #leave blank for none
    estimate_code:
      length: 2
      type: Text
      example_value: "01"
      needs_mapping: true
      map_file: "estimate" #leave blank for none
    series_title:
      length: 250
      type: Text
      example_value: "All Civilian Total compensation for All occupations; Cost per hour worked"
      needs_mapping: false
      map_file: "" #leave blank for none
    footnote_codes:
      length: 10
      type: Text
      example_value: "3"
      needs_mapping: true
      map_file: "footnote" #leave blank for none
    begin_year:
      length: 4
      type: Text
      example_value: "2008"
      needs_mapping: false
      map_file: "" #leave blank for none
    begin_period:
      length: 3
      type: Text
      example_value: "Q01"
      needs_mapping: false
      map_file: "" #leave blank for none
    end_year:
      length: 4
      type: Text
      example_value: "2012"
      needs_mapping: false
      map_file: "" #leave blank for none
    end_period:
      length: 3
      type: Text
      example_value: "Q04"
      needs_mapping: false
      map_file: "" #leave blank for none

data_file:
  general:
    use_mmap: true
    series_id_col: "series_id"
    obs_value: "value"
    schema:
      series_id:
        length: 17
        type: Text
        example_value: "CMU203S000000000D"
      year:
        length: 4
        type: values
        example_value: "2018"
      period:
        length: 3
        type: Text
        example_value: "Q01"
      value:
        length: 12
        type: values
        example_value: "9.83"
      footnote_codes:
        length: 10
        type: Text
        example_value: "E"

  aspect:
    use_mmap: true
    series_id_col: "series_id"
    obs_value: "value"
    schema:
      series_id:
        length: 17
        type: Text
        example_value: "CMU203S000000000D"
      year:
        length: 4
        type: values
        example_value: "2018"
      period:
        length: 3
        type: Text
        example_value: "Q01"
      aspect_type:
        length: 2
        type: Text
        example_value: "R0"
      value:
        length: 12
        type: values
        example_value: "3.4"
      footnote_codes:
        length: 10
        type: Text
        example_value: ""

lookup_files: #DEFINE SCHEMA AND ATTRIBUTES FOR LOOKUP FILES (maps to series)
