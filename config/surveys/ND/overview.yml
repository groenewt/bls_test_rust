  code: "ND"
  name: "Producer Price Index Revision-Discontinued Series"
  description: "Producer Price Index Revision-Current Series indexes reflect price movements for the net output of producers organized according to the North American Industry Classification System (NAICS). The ND dataset is compatible with a wide assortment of NAICS-based economic time series including productivity, production, employment, wages, and earnings."
  size_class: "large"
  characteristics:
    frequency: "monthly"
    coverage: "National industry-level producer price data for discontinued NAICS-based indexes"
    time_series_count: "Producer price index series for discontinued products/industries"
    classification_system: "NAICS (North American Industry Classification System)"
    update_schedule: "Monthly release"
