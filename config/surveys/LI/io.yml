# LI Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/li"
  include: ["li.series", "li.data.*", "li.area", "li.footnote", "li.item", "li.period"]
  exclude: ["*.tmp", ".*", "*~", "*.bak"]

combining:
  enabled: false
  strategy: "none"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "size_based"
  max_partition_size_mb: 256
  partition_by: []
  
mmap:
  enable_for_mb_greater_than: 50
  
# Lookup file loading strategy
lookup_strategy:
  preload: ["item", "period"]  # Small, frequently used
  lazy: ["footnote", "area"]   # Load on demand
  mmap: []  # Use for large files
  cache_all: true  # Small enough to keep in memory
