# JL Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/jl"
  include: ["jl.series", "jl.data.*", "jl.contacts", "jl.dataelement", "jl.industry", "jl.period", "jl.ratelevel", "jl.region"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year", "region_code"]

mmap:
  enable_for_mb_greater_than: 100

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
