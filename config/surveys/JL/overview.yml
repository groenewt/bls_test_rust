definition: |
  The following is a definition of: Job Openings and Labor Turnover Survey (JOLTS)

  Program Description: The Job Openings and Labor Turnover Survey program provides
  national estimates of rates and levels for job openings, hires, and total 
  separations. Total separations are further broken out into quits, layoffs and
  discharges, and other separations.

  Summary Data Available: The estimates are available for eleven major industry 
  divisions, nine private sector divisions and two public sector divisions, based on 
  the North American Industry Classification System (NAICS). These divisions include: 
  Mining; Construction; Durable Goods Manufacturing; Nondurable Goods Manufacturing; 
  Transportation and Public Utilities; Wholesale Trade; Retail Trade; Finance, 
  Insurance, and Real Estate; Services; Federal Government; and State and Local Government.
  
  Estimates are also available for four geographic regions (Northeast, Midwest,
  South, and West).

  The sample for the Job Openings and Labor Turnover Survey includes randomly
  selected nonfarm establishments such as factories, offices, and stores, as
  well as federal, state, and local government entities in the 50 states and the
  District of Columbia. The 16,000 establishments in the JOLTS survey are drawn
  from a universe of approximately eight million establishments compiled as 
  part of the Covered Employment and Wages, or ES-202, program.

  All data series are available from December 2000 to present. Estimates from JOLTS
  are not seasonally adjusted, and experience suggests that there is a seasonal pattern
  to job openings, hires, and separations.
