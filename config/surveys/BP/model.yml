config_version: 1
series:
  path: "bp.series"
  index: "series_id"
  estimated_size_gb: 0.1
  schema:
    series_id:
      type: "string"
      length: 13
      nullable: false
      example_value: "BPU0114101001"
    measure_code:
      type: "string"
      length: 2
      nullable: false
      example_value: "01"
    unit_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "1"
    periodicity_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "1"
    alteration_code:
      type: "string"
      length: 1
      nullable: false
      example_value: "1"
    industry_code:
      type: "string"
      length: 2
      nullable: false
      example_value: "01"
    contract_duration:
      type: "string"
      length: 1
      nullable: false
      example_value: "0"
    contract_selection:
      type: "string"
      length: 2
      nullable: false
      example_value: "01"
    seasonal:
      type: "string"
      length: 1
      nullable: false
      example_value: "U"
    begin_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "1983"
    begin_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "Q01"
    end_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "1995"
    end_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "Q04"

data_files:
  - id: "main"
    pattern: "bp.data.*"
    index: "series_id"
    schema:
      series_id:
        type: "string"
        length: 13
        nullable: false
        example_value: "BPU0114101001"
      year:
        type: "int32"
        min: 1983
        max: 2067
        nullable: false
        example_value: "1995"
      period:
        type: "string"
        length: 3
        pattern: "^Q0[1-5]$"
        nullable: false
        example_value: "Q01"
      value:
        type: "decimal"
        precision: 18
        scale: 4
        nullable: true
        example_value: "2.3"
      cont_break:
        type: "string"
        length: 1
        nullable: true
        example_value: "N"
      status:
        type: "string"
        length: 1
        nullable: true
        example_value: "F"
      footnote_exists:
        type: "string"
        length: 1
        nullable: true
        example_value: "N"

lookups:
  - id: "alteration"
    path: "bp.alteration"
    index: "alteration_code"
    schema:
      alteration_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "1"
      alteration_text:
        type: "string"
        length: 50
        nullable: false
        example_value: "Changes (increases, decreases, and no change)"
  
  - id: "duration"
    path: "bp.duration"
    index: "contract_duration"
    schema:
      contract_duration:
        type: "string"
        length: 1
        nullable: false
        example_value: "0"
      contract_duration_text:
        type: "string"
        length: 50
        nullable: false
        example_value: "All contracts"
  
  - id: "industry"
    path: "bp.industry"
    index: "industry_code"
    schema:
      industry_code:
        type: "string"
        length: 2
        nullable: false
        example_value: "01"
      industry_name:
        type: "string"
        length: 40
        nullable: false
        example_value: "All industries"
  
  - id: "measure"
    path: "bp.measure"
    index: "measure_code"
    schema:
      measure_code:
        type: "string"
        length: 2
        nullable: false
        example_value: "01"
      measure_text:
        type: "string"
        length: 90
        nullable: false
        example_value: "Settlements, 1st Year Compensation"
  
  - id: "period"
    path: "bp.period"
    index: "period"
    schema:
      period:
        type: "string"
        length: 3
        nullable: false
        example_value: "Q01"
      period_abbr:
        type: "string"
        length: 5
        nullable: false
        example_value: "QTR1"
      period_name:
        type: "string"
        length: 20
        nullable: false
        example_value: "1st Quarter"
  
  - id: "periodicity"
    path: "bp.periodicity"
    index: "periodicity_code"
    schema:
      periodicity_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "1"
      periodicity_text:
        type: "string"
        length: 40
        nullable: false
        example_value: "Four quarters ending"
  
  - id: "selection"
    path: "bp.selection"
    index: "contract_selection"
    schema:
      contract_selection:
        type: "string"
        length: 2
        nullable: false
        example_value: "01"
      contract_selection_text:
        type: "string"
        length: 80
        nullable: false
        example_value: "All contracts in period"
  
  - id: "unit"
    path: "bp.unit"
    index: "unit_code"
    schema:
      unit_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "1"
      unit_text:
        type: "string"
        length: 20
        nullable: false
        example_value: "Mean (in percent)"

relationships:
  - from: { file: "main", column: "series_id" }
    to: { file: "series", column: "series_id" }
    type: "many-to-one"
  - from: { file: "series", column: "measure_code" }
    to: { file: "measure", column: "measure_code" }
    type: "many-to-one"
  - from: { file: "series", column: "unit_code" }
    to: { file: "unit", column: "unit_code" }
    type: "many-to-one"
  - from: { file: "series", column: "periodicity_code" }
    to: { file: "periodicity", column: "periodicity_code" }
    type: "many-to-one"
  - from: { file: "series", column: "alteration_code" }
    to: { file: "alteration", column: "alteration_code" }
    type: "many-to-one"
  - from: { file: "series", column: "industry_code" }
    to: { file: "industry", column: "industry_code" }
    type: "many-to-one"
  - from: { file: "series", column: "contract_duration" }
    to: { file: "duration", column: "contract_duration" }
    type: "many-to-one"
  - from: { file: "series", column: "contract_selection" }
    to: { file: "selection", column: "contract_selection" }
    type: "many-to-one"
  - from: { file: "series", column: "begin_period" }
    to: { file: "period", column: "period" }
    type: "many-to-one"
  - from: { file: "series", column: "end_period" }
    to: { file: "period", column: "period" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
  required_fields:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "measure_code", "unit_code", "periodicity_code", "alteration_code", "industry_code", "contract_duration", "contract_selection", "begin_year", "begin_period", "end_year", "end_period"] }

types:
  aliases:
    Year: { base: "int32", range: [1983, 2067] }
    Period: { base: "string", pattern: "^Q0[1-5]$" }
    SeriesId: { base: "string", length: 13, pattern: "^BP[SU]\\d{11}$" }