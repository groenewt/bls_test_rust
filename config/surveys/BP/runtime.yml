config_version: 1

# Core RuntimeConfig fields 
features:
  async_processing: false
  parallel_io: false
  memory_optimization: false
  experimental_features: false

# Legacy fields kept for compatibility
feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  enable_checkpoint: false
  enable_profiling: false

environment_overrides:
  - key: "BLS_BP_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_PARTITION_STRATEGY"
    maps_to: "partition_hints.strategy"
  - key: "BLS_MAX_ERRORS"
    maps_to: "policy.max_errors"
  - key: "BLS_LOG_LEVEL"
    maps_to: "logging.level"

logging:
  level: "info"
  structured: true
  format: "json"
  output: "bp_processing.log"

monitoring:
  enabled: true
  metrics_endpoint: null
  health_check_interval: 60

environment:
  name: null
  debug: false
  profile: null

checkpoint:
  enabled: false
  interval_records: 10000
  checkpoint_dir: "checkpoints/bp"