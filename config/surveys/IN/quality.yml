# IN Survey Quality Configuration
# Validations, expectations, thresholds
config_version: 1

expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "seasonal", "economicseries_code", "industry_code", "country_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 1950, max: 2055 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "series", column: "begin_year", min: 1950, max: 2067 }
    - { file: "series", column: "end_year", min: 1950, max: 2067 }
  
  enums:
    - { file: "series", column: "seasonal", values: ["S", "U"] }
  
  regex:
    - { file: "main", column: "series_id", pattern: "^IN[SU]\\d{14}[MQ]$" }
    - { file: "main", column: "period", pattern: "^(M\\d{2}|Q\\d{2}|A01)$" }
    - { file: "series", column: "series_id", pattern: "^IN[SU]\\d{14}[MQ]$" }
    - { file: "series", column: "begin_period", pattern: "^(M\\d{2}|Q\\d{2}|A01)$" }
    - { file: "series", column: "end_period", pattern: "^(M\\d{2}|Q\\d{2}|A01)$" }
  
  values:
    - { file: "main", column: "period", allowed: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05", "A01"] }
    - { file: "series", column: "begin_period", allowed: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05", "A01"] }
    - { file: "series", column: "end_period", allowed: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05", "A01"] }
  
  length:
    - { file: "series", column: "series_id", exact: 17 }
  
  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "distinct(country_code)", "distinct(economicseries_code)"]
  persist: true

policy:
  mode: "fail_on_error"  # warn_only|fail_on_error
  sample_on_fail_rows: 50
  max_errors: 2000
  log_errors: true
  error_file: "in_errors.log"

validation_rules:
  data_series:
    - field: "value"
      rule: "range"
      min: -10000000000000000.0
      max: 10000000000000000.0
      action: "flag"
    - field: "year"
      rule: "range"
      min: 1950
      max: 2055
      action: "reject"
    - field: "series_id"
      rule: "pattern"
      pattern: "^IN[SU]\\d{14}[MQ]$"
      action: "flag"
    - field: "period"
      rule: "values"
      allowed: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05", "A01"]
      action: "flag"
  
  series_dict:
    - field: "series_id"
      rule: "pattern"
      pattern: "^IN[SU]\\d{14}[MQ]$"
      action: "flag"
      message: "Invalid series ID format: should be IN[S|U] followed by 14 digits and ending with M or Q"
    - field: "series_id"
      rule: "length"
      exact: 17
      action: "reject"
      message: "Series ID must be exactly 17 characters"
    - field: "series_id"
      rule: "required"
      action: "reject"
      message: "Series ID cannot be null"
    - field: "begin_year"
      rule: "range"
      min: 1950
      max: 2067
      action: "reject"
      message: "Begin year must be between 1950 and 2067"
    - field: "begin_year"
      rule: "numeric"
      action: "reject"
      message: "Begin year must be numeric"
    - field: "end_year"
      rule: "range"
      min: 1950
      max: 2067
      action: "reject"
      message: "End year must be between 1950 and 2067"
    - field: "end_year"
      rule: "numeric"
      action: "reject"
      message: "End year must be numeric"
    - field: "end_year"
      rule: "greater_than_or_equal"
      compare_field: "begin_year"
      action: "reject"
      message: "End year must be >= begin year"
    - field: "begin_period"
      rule: "values"
      allowed: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05", "A01"]
      action: "flag"
      message: "Invalid begin period value"
    - field: "end_period"
      rule: "values"
      allowed: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "Q01", "Q02", "Q03", "Q04", "Q05", "A01"]
      action: "flag"
      message: "Invalid end period value"
    - field: "end_year"
      rule: "date_logic_check"
      check_fields: ["begin_year"]
      validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
      action: "flag"
      message: "End date must be after or equal to begin date"

completeness:
  required_fields:
    data_series: ["series_id", "year", "period"]
    series_dict: ["series_id", "seasonal", "economicseries_code", "industry_code", "country_code", "begin_year", "begin_period", "end_year", "end_period"]
  nullable_fields:
    data_series: ["value", "footnote_codes"]
    series_dict: ["footnote_codes"]

uniqueness:
  data_series: ["series_id", "year", "period"]
  series_dict: ["series_id"]