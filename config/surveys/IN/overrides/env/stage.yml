# IN Survey Staging Environment Overrides
config_version: 1

# Staging-specific settings
logging:
  level: "info"

feature_flags:
  enable_profiling: false
  enable_hot_reloads: false

# Standard resource limits for staging
resources:
  max_threads: 4
  memory_limit_gb: 4

# Standard error handling for staging
error_handling:
  max_errors: 2000
  on_error: "continue"

# Standard chunk size for staging
io:
  chunk_size_mb: 50