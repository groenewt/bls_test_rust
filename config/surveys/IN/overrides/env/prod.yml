# IN Survey Production Environment Overrides
config_version: 1

# Production-specific settings
logging:
  level: "warn"

feature_flags:
  enable_profiling: false
  enable_hot_reloads: false

# Optimized resource limits for production
resources:
  max_threads: 8
  memory_limit_gb: 8

# Strict error handling for production
error_handling:
  max_errors: 1000
  on_error: "continue"

# Larger chunks for production efficiency
io:
  chunk_size_mb: 100

# Production-optimized partitioning
partition_hints:
  max_partition_size_mb: 1000