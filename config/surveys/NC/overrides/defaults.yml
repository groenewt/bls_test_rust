# NC Survey Organizational Defaults
# Org/team defaults for this survey
config_version: 1

# Default resource limits for NC survey
resources:
  max_threads: 4
  memory_limit_gb: 6

# Default error handling
error_handling:
  max_errors: 1500
  log_errors: true

# Default logging level
logging:
  level: "info"
  structured: true