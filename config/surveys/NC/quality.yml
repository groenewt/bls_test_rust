# NC Survey Quality Configuration
# Data quality expectations, validations, and thresholds
config_version: 1

# Required checks field for QualityConfig
checks:
  - name: "series_id_not_null"
    check_type: "completeness"
    parameters:
      columns: ["series_id"]
    severity: "error"
  
  - name: "year_range_check" 
    check_type: "validity"
    parameters:
      column: "year"
      min: 1997
      max: 2055
    severity: "error"
    
  - name: "unique_series_combination"
    check_type: "uniqueness"
    parameters:
      columns: ["series_id", "year", "period"]
    severity: "error"

# Required validation field for QualityConfig
validation:
  strict_mode: true
  fail_on_error: false
  max_errors: 1500

expectations:
  non_null:
    - { file: "current", columns: ["series_id", "year", "period"] }
    - { file: "alldata", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "state_code", "area_code", "mog_code", "occupation_code", "level_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "current", column: "year", min: 1997, max: 2055 }
    - { file: "alldata", column: "year", min: 1997, max: 2055 }
    - { file: "current", column: "value", min: 0.0, max: 999.99 }
    - { file: "alldata", column: "value", min: 0.0, max: 999.99 }
    - { file: "series", column: "begin_year", min: 1997, max: 2055 }
    - { file: "series", column: "end_year", min: 1997, max: 2055 }
  
  enums:
    - { file: "current", column: "period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13"] }
    - { file: "alldata", column: "period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13"] }
    - { file: "series", column: "begin_period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13"] }
    - { file: "series", column: "end_period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13"] }
  
  regex:
    - { file: "series", column: "series_id", pattern: "^NC[USN][0-9]{2}[0-9A-Z]{4}[0-9]{2}[0-9]{3}[0-9]{2}$" }
    - { file: "current", column: "series_id", pattern: "^NC[USN][0-9]{2}[0-9A-Z]{4}[0-9]{2}[0-9]{3}[0-9]{2}$" }
    - { file: "alldata", column: "series_id", pattern: "^NC[USN][0-9]{2}[0-9A-Z]{4}[0-9]{2}[0-9]{3}[0-9]{2}$" }
    - { file: "series", column: "state_code", pattern: "^[0-9]{2}$" }
    - { file: "series", column: "area_code", pattern: "^[0-9A-Z]{4}$" }
    - { file: "series", column: "mog_code", pattern: "^[0-9]{2}$" }
    - { file: "series", column: "occupation_code", pattern: "^[0-9]{3}$" }
    - { file: "series", column: "level_code", pattern: "^[0-9]{2}$" }
  
  length:
    - { file: "series", column: "series_id", exact: 17 }
    - { file: "current", column: "series_id", exact: 17 }
    - { file: "alldata", column: "series_id", exact: 17 }
    - { file: "series", column: "state_code", exact: 2 }
    - { file: "series", column: "area_code", exact: 4 }
    - { file: "series", column: "mog_code", exact: 2 }
    - { file: "series", column: "occupation_code", exact: 3 }
    - { file: "series", column: "level_code", exact: 2 }
  
  lookup_exists:
    - { file: "series", column: "state_code", lookup_table: "state" }
    - { file: "series", column: "area_code", lookup_table: "area" }
    - { file: "series", column: "level_code", lookup_table: "level" }
    - { file: "series", column: "mog_code", lookup_table: "mogocc" }
  
  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }
    - { file: "series", validation: "(end_year > begin_year) OR (end_year == begin_year AND end_period >= begin_period)", message: "End date must be after or equal to begin date" }

row_count:
  min: 1
  warn_below: 50

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "distinct(state_code)", "distinct(area_code)"]
  persist: true

policy:
  mode: "continue"
  max_errors: 1500
  sample_on_fail_rows: 50
  log_errors: true
  error_file: "nc_errors.log"

actions:
  value_range_violation: "flag"
  year_range_violation: "reject"
  series_id_format_violation: "flag"
  period_enum_violation: "flag"
  state_code_format_violation: "flag"
  area_code_format_violation: "flag"
  occupation_code_format_violation: "flag"
  level_code_format_violation: "flag"
  lookup_missing: "flag"
  cross_field_violation: "reject"
  length_violation: "reject"
  required_field_missing: "reject"