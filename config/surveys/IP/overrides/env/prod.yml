# IP Survey Production Environment Overrides
config_version: 1

# Production processing settings
processing:
  strategy:
    mode: "chunked"
    max_concurrency: 4
  resources:
    max_threads: 8
    memory_limit_gb: 16
  features:
    enable_profiling: false
    enable_statistics: true

# Production output settings
output:
  destination:
    base_path: "data/processed/bls/IP/prod"
  partitioning:
    max_file_size_mb: 1024

# Production quality settings
quality:
  policy:
    mode: "fail_on_error"
    sample_on_fail_rows: 50

# Production runtime settings
runtime:
  logging:
    level: "warn"
    structured: true
  error_handling:
    max_errors: 5000
  feature_flags:
    enable_checkpoints: true