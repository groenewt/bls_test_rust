# IP Survey Quality Configuration
# Data quality expectations, validations, and thresholds
config_version: 1

# Required checks field for QualityConfig
checks:
  - name: "series_id_not_null"
    check_type: "completeness"
    parameters:
      columns: ["series_id"]
    severity: "error"
  
  - name: "year_range_check" 
    check_type: "validity"
    parameters:
      column: "year"
      min: 1987
      max: 2055
    severity: "error"
    
  - name: "unique_series_combination"
    check_type: "uniqueness"
    parameters:
      columns: ["series_id", "year", "period"]
    severity: "error"

# Required validation field for QualityConfig
validation:
  strict_mode: true
  fail_on_error: false
  max_errors: 2000

expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "seasonal", "sector_code", "industry_code", "measure_code", "duration_code", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 1987, max: 2055 }
    - { file: "main", column: "value", min: -10000000000000000.0, max: 10000000000000000.0 }
    - { file: "series", column: "begin_year", min: 1987, max: 2067 }
    - { file: "series", column: "end_year", min: 1987, max: 2067 }
  
  enums:
    - { file: "main", column: "period", values: ["A01"] }
    - { file: "series", column: "begin_period", values: ["A01"] }
    - { file: "series", column: "end_period", values: ["A01"] }
  
  regex:
    - { file: "series", column: "series_id", pattern: "^IP[U]\\w{19}$" }
  
  length:
    - { file: "series", column: "series_id", exact: 21 }
  
  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }

row_count:
  min: 1
  warn_below: 100

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "min(year)", "max(year)", "min(value)", "max(value)"]
  persist: true

policy:
  mode: "continue"
  max_errors: 2000
  sample_on_fail_rows: 50
  log_errors: true
  error_file: "ip_errors.log"

# Note: keeping lower-level data_validation for additional rules if used by downstream tools
# Validation rules for data files
data_validation:
  main:
    rules:
      - field: "value"
        rule: "range"
        min: -10000000000000000.0
        max: 10000000000000000.0
        action: "flag"
        message: "Value outside expected range"
      
      - field: "year"
        rule: "range"
        min: 1987
        max: 2055
        action: "reject"
        message: "Year must be between 1987 and 2055"
      
      - field: "series_id"
        rule: "pattern"
        pattern: "^IP[U]\\w{19}$"
        action: "flag"
        message: "Invalid series ID format"
      
      - field: "period"
        rule: "values"
        allowed: ["A01"]
        action: "flag"
        message: "Invalid period value"
    
    required_fields: ["series_id", "year", "period"]
    nullable_fields: ["value", "footnote_codes"]

  series:
    rules:
      - field: "series_id"
        rule: "pattern"
        pattern: "^IP[U]\\w{19}$"
        action: "flag"
        message: "Invalid series ID format: should be IP[U] followed by 19 characters"
      
      - field: "series_id"
        rule: "length"
        exact: 21
        action: "reject"
        message: "Series ID must be exactly 21 characters"
      
      - field: "series_id"
        rule: "required"
        action: "reject"
        message: "Series ID cannot be null"
      
      - field: "begin_year"
        rule: "range"
        min: 1987
        max: 2067
        action: "reject"
        message: "Begin year must be between 1987 and 2067"
      
      - field: "begin_year"
        rule: "numeric"
        action: "reject"
        message: "Begin year must be numeric"
      
      - field: "end_year"
        rule: "range"
        min: 1987
        max: 2067
        action: "reject"
        message: "End year must be between 1987 and 2067"
      
      - field: "end_year"
        rule: "numeric"
        action: "reject"
        message: "End year must be numeric"
      
      - field: "end_year"
        rule: "greater_than_or_equal"
        compare_field: "begin_year"
        action: "reject"
        message: "End year must be >= begin year"
      
      - field: "begin_period"
        rule: "values"
        allowed: ["A01"]
        action: "flag"
        message: "Invalid begin period value"
      
      - field: "end_period"
        rule: "values"
        allowed: ["A01"]
        action: "flag"
        message: "Invalid end period value"
      
      - field: "end_year"
        rule: "date_logic_check"
        check_fields: ["begin_year"]
        validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
        action: "flag"
        message: "End date must be after or equal to begin date"
    
    required_fields: ["series_id", "seasonal", "sector_code", "industry_code", "measure_code", "duration_code", "begin_year", "begin_period", "end_year", "end_period"]
    nullable_fields: ["footnote_codes"]
    unique_fields: ["series_id"]