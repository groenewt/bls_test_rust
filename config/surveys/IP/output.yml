# IP Survey Output Configuration
# Output formats, partitioning, compression
config_version: 1

format: "csv"

csv:
  delimiter: ","
  quote_char: "\""
  escape_char: "\\"
  header: true

partitioning:
  partition_by: ["year"]
  max_file_size_mb: 512

naming:
  dataset: "bls_ip"
  version: "v1"

evolution:
  mode: "compatible"
  allow_nullability_change: false

destination:
  base_path: "data/processed/bls/IP"

# Data series output configuration
data_series:
  format: "csv"
  partitioning:
    enabled: true
    partition_by: ["year"]
  transformations:
    sort_by: ["series_id", "year", "period"]
    deduplicate: true
    deduplicate_on: ["series_id", "year", "period", "footnote_codes"]
  statistics:
    enabled: true
    columns: ["year", "period", "value"]

# Data dictionary output configuration  
data_dict:
  format: "csv"
  output_file: "ip_series_dict.csv"
  partitioning:
    enabled: false
  mapping:
    seasonal:
      lookup_table: "seasonal"
      lookup_key: "seasonal"
      lookup_value: "seasonal_text"
      create_field: "seasonal_text"
      on_missing: "UNKNOWN_SEASONAL"
      cache: true
    sector_code:
      lookup_table: "sector"
      lookup_key: "sector_code"
      lookup_value: "sector_text"
      create_field: "sector_text"
      on_missing: "UNKNOWN_SECTOR"
      cache: true
    industry_code:
      lookup_table: "industry"
      lookup_key: "industry_code"
      lookup_value: "industry_text"
      create_field: "industry_text"
      on_missing: "UNKNOWN_INDUSTRY"
      cache: true
    measure_code:
      lookup_table: "measure"
      lookup_key: "measure_code"
      lookup_value: "measure_text"
      create_field: "measure_text"
      on_missing: "UNKNOWN_MEASURE"
      cache: true
    duration_code:
      lookup_table: "duration"
      lookup_key: "duration_code"
      lookup_value: "duration_text"
      create_field: "duration_text"
      on_missing: "UNKNOWN_DURATION"
      cache: true
    type_code:
      lookup_table: "type"
      lookup_key: "type_code"
      lookup_value: "type_text"
      create_field: "type_text"
      on_missing: "UNKNOWN_TYPE"
      cache: true
    area_code:
      lookup_table: "area"
      lookup_key: "area_code"
      lookup_value: "area_text"
      create_field: "area_text"
      on_missing: "UNKNOWN_AREA"
      cache: true
    footnote_codes:
      lookup_table: "footnote"
      lookup_key: "footnote_code"
      lookup_value: "footnote_text"
      create_field: "footnote_texts"
      multiple: true
      separator: " "
      on_missing: "skip"
      cache: true
  transformations:
    sort_by: ["series_id"]
    deduplicate: false
    deduplicate_on: ["series_id"]
  statistics:
    enabled: true
    columns: ["series_id", "sector_code", "industry_code", "measure_code", "begin_year", "end_year"]
    output_file: "ip_series_dict_stats.json"