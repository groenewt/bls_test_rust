# HS Survey Processing Configuration
# Strategy, resources, chunking, mmap, cache
config_version: 1

# Direct strategy value (not nested)
strategy: "in_memory"

# Flattened configuration fields
max_threads: 2
chunk_size: 16777216   # 16MB in bytes
memory_limit: 4096     # 4GB in MB
parallel: false        # Single-threaded for small survey

# Chunking configuration
chunking:
  size: 16777216       # 16MB in bytes
  strategy: "sequential"
  overlap: null

# Memory mapping configuration
mmap:
  enabled: true        # Beneficial for HS survey
  threshold: null
  prefetch: null

# Cache configuration  
cache:
  enabled: true
  size: 4194304        # 4MB cache size
  ttl: 3600           # 1 hour TTL