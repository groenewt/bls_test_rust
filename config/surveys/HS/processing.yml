# HS Survey Processing Configuration
# Strategy, resources, chunking, mmap, cache
config_version: 1

strategy:
  mode: "in_memory"
  max_concurrency: 1

resources:
  max_threads: 2
  memory_limit_gb: 4
  
io:
  chunk_size_mb: 64
  buffer_pool_size: 4

features:
  use_mmap: true
  enable_statistics: true
  enable_profiling: false

transforms:
  - id: "normalize_series_id"
    expr: "upper(series_id)"
  - id: "validate_period"
    expr: "period in ['A01']"