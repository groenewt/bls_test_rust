# HS Survey Runtime Configuration
# Feature flags, env overrides mapping, logging
config_version: 1

feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  enable_checkpoints: false
  enable_profiling: false
  enable_statistics: true

environment_overrides:
  - key: "BLS_HS_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_HS_MAX_THREADS"
    maps_to: "resources.max_threads"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_HS_USE_MMAP"
    maps_to: "features.use_mmap"

logging:
  level: "info"
  structured: true

error_handling:
  on_error: "continue"
  max_errors: 1000
  log_errors: true
  error_file: "hs_errors.log"
  
checkpoint:
  enabled: false
  interval_records: 10000
  checkpoint_dir: "checkpoints/hs"

lookup_config:
  preload: ["case_type", "data_type", "division"]
  lazy: ["period"]
  mmap: ["industry"]
  cache_all: true