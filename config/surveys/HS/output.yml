# HS Survey Output Configuration
# Output formats, partitioning, compression
config_version: 1

format: "csv"

csv:
  delimiter: ","
  quote_char: "\""
  escape_char: "\\"
  header: true

partitioning:
  enabled: false
  partition_by: []
  max_file_size_mb: 100

naming:
  dataset: "bls_hs"
  version: "v1"

evolution:
  mode: "compatible"
  allow_nullability_change: false

destination:
  base_path: "data/processed/bls/HS"

outputs:
  data_series:
    format: "csv"
    filename: "hs_data.csv"
    transformations:
      sort_by: ["series_id", "year", "period"]
      deduplicate: true
      deduplicate_on: ["series_id", "year", "period", "footnote_codes"]
    
  data_dict:
    format: "csv"
    filename: "hs_series_dict.csv"
    transformations:
      sort_by: ["series_id"]
      deduplicate: false
    mapping:
      division_code:
        lookup_table: "division"
        lookup_key: "division_code"
        lookup_value: "division_name"
        create_field: "division_name"
        on_missing: "UNKNOWN_DIVISION"
        cache: true
      industry_code:
        lookup_table: "industry"
        lookup_key: "industry_code"
        lookup_value: "industry_name"
        create_field: "industry_name"
        on_missing: "UNKNOWN_INDUSTRY"
        cache: true
      data_type_code:
        lookup_table: "data_type"
        lookup_key: "data_type_code"
        lookup_value: "data_type_text"
        create_field: "data_type_text"
        on_missing: "UNKNOWN_DATA_TYPE"
        cache: true
      case_type_code:
        lookup_table: "case_type"
        lookup_key: "case_type_code"
        lookup_value: "case_type_text"
        create_field: "case_type_text"
        on_missing: "UNKNOWN_CASE_TYPE"
        cache: true
      begin_period:
        lookup_table: "period"
        lookup_key: "period"
        lookup_value: "period_name"
        create_field: "begin_period_name"
        on_missing: "UNKNOWN_PERIOD"
        cache: true
      end_period:
        lookup_table: "period"
        lookup_key: "period"
        lookup_value: "period_name"
        create_field: "end_period_name"
        on_missing: "UNKNOWN_PERIOD"
        cache: true