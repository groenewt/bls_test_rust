# WP Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/wp"
  include: ["wp.series", "wp.data.*", "wp.group", "wp.item", "wp.footnote", "wp.period", "wp.seasonal"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year", "group_code"]

mmap:
  enable_for_mb_greater_than: 100