# name: Employee Benefits Survey Processing Configuration
# description:
# author: Junie
# date: 2025-08-07
# notes:
#         - data location: .data.raw/bls/eb
#         - Data files are in ASCII text format
#         - Tabs separate data elements in an original BLS file
