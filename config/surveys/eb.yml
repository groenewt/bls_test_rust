# changes:

#General Survey Information
survey:
  code: eb #survey code (ex.ap,sm,tu)- see docs (.docs/surveys/* for all surveys)
  name: Employee Benefits Survey #friendly survey name
  size_class: small #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  description: "The Employee Benefits Survey (EBS) is an annual survey of the incidence and provisions of selected benefits provided by employers. The survey collects data from a sample of approximately 6,000 private sector and State and local government establishments."
  definition: "
The following is a definition of:  EMPLOYEE BENEFITS SURVEY

Survey Description:  The Employee Benefits Survey (EBS) is an annual survey
of the incidence and provisions of selected benefits provided by employers. 
The survey collects data from a sample of approximately 6,000 private sector
and State and local government establishments.  The data are presented as a 
percentage of employees who participate in a certain benefit, or as an 
average benefit provision (for example, the average number of paid holidays 
provided to employees per year).

The survey covers paid leave benefits such as holidays and vacations, and 
person, funeral, jury duty, military, parental, and sick leave; sickness and
accident, long-term disability, and life insurance; medical, dental, and 
vision care plans; defined benefit pension and defined contribution plans; 
flexible benefits plans; reimbursement accounts; and unpaid parental leave.
Also, data are tabulated on the incidence of several other benefits, such as
severance pay, child-care assistance, wellness programs, and employee 
assistance programs.

Summary Data Available:  Surveys of employees in medium and large private 
establishments conducted over the 1979-86 period included establishments 
that employed at least 50, 100, or 250 workers, depending on the industry 
(most service industries were excluded).  The survey conducted in 1987 
covered only State and local governments with 50 or more employees.  The 
surveys conducted in 1988 and 1989 included medium and large establishments
with 100 workers or more in all private industries.  All surveys conducted 
over the 1979-89 period excluded establishments in Alaska and Hawaii, as 
well as part-time employees.

Beginning in 1990, surveys of State and local governments and small 
establishments are conducted in even-numbered years and surveys of medium 
and large establishments are conducted in odd-numbered years.  The small 
establishment survey includes all private nonfarm establishments with fewer
than 100 workers, while the State and local government survey includes all 
governments, regardless of the number of workers.  All three surveys include
full- and part-time workers, and workers in all 50 States and the District 
of Columbia.

Data available on LABSTAT include incidence of selected benefits and the 
average benefit amount for selected provisions, from all three surveys.

Frequency of Observations:  Data are annual.

Base Periods:  Not applicable.

Data Characteristics:  All percent of workers are in whole percents; average
holidays are stored with one decimal place; average employee contributions 
to health care benefits are stored in dollars and cents; all other averages
are whole numbers.

Updating Schedule:  Updates are available annually, typically in the summer
following the reference year of the data.
                "
  characteristics:
    frequency: annual
    coverage: "Private sector and State and local government establishments"
    time_series_count: "Employee benefits data" 
    classification_system: "Benefit types, establishment types, and employee characteristics"
    update_schedule: "Annual release, typically in the summer following the reference year"
    begin_year: 1979
    survey_methodology: "Sample of approximately 6,000 private sector and State and local government establishments"
    calculation_basis: "Percentage of employees who participate in a benefit, or average benefit provision"

#Survey Series Information
series:
  path: "eb.series" #path to series file relative to data/raw/bls/eb/
  use_mmap: true
  series_size_class: Small #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  idx_col: "series_id"
  schema:
    series_id:
      length: 17 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
      type: Text
      example_value: "EBU401KINC0000ML"
      map_file: "" #leave blank for none
    title_code:
      length: 11
      type: Text
      example_value: "401KINC0000"
      needs_mapping: true
      map_file: "title" #leave blank for none
    type_code:
      length: 2
      type: Text
      example_value: "ML"
      needs_mapping: true
      map_file: "type" #leave blank for none
    begin_year:
      length: 4
      type: Text
      example_value: "1985"
      needs_mapping: false
      map_file: "" #leave blank for none
    begin_period:
      length: 3
      type: Text
      example_value: "A01"
      needs_mapping: true
      map_file: "period" #leave blank for none
    end_year:
      length: 4
      type: Text
      example_value: "1997"
      needs_mapping: false
      map_file: "" #leave blank for none
    end_period:
      length: 3
      type: Text
      example_value: "A01"
      needs_mapping: true
      map_file: "period" #leave blank for none

data_file:
  general:
    use_mmap: true
    series_id_col: "series_id"
    obs_value: "value"
    schema:
      series_id:
        length: 17
        type: Text
        example_value: "EBU401KINC0000ML"
      year:
        length: 4
        type: values
        example_value: "1985"
      period:
        length: 3
        type: Text
        example_value: "A01"
      value:
        length: 12
        type: values
        example_value: "26"
      footnote_codes:
        length: 10
        type: Text
        example_value: ""

lookup_files: #DEFINE SCHEMA AND ATTRIBUTES FOR LOOKUP FILES (maps to series)
  lookup_config:
    preload: [ period, type, seasonal ]  # Small, frequently used
    lazy: [ footnote, title ]  # Load on demand
    mmap: [ ] # use it for large files
    cache_all: true  # Small enough to keep in memory
  files:
    period:
        file_path: "eb.period"
        name: Period
        description: "Maps period codes to period names"
        index_col: "period"
        schema:
          period:
            length: 3
            type: str
            example_value: "A01"
          period_abbr:
            length: 5
            type: str
            example_value: "ANN"
          period_name:
            length: 20
            type: str
            example_value: "Annual"

    title:
        file_path: "eb.title"
        name: Title
        description: "Maps title codes to title names"
        index_col: "title_code"
        schema:
          title_code:
            length: 11
            type: str
            example_value: "401KINC0000"
          title_name:
            length: 100
            type: str
            example_value: "Incidence Of Cash Or Deferred Arrangements"

    type:
        file_path: "eb.type"
        name: Type
        description: "Maps type codes to type names"
        index_col: "type_code"
        schema:
          type_code:
            length: 2
            type: str
            example_value: "ML"
          type_name:
            length: 50
            type: str
            example_value: "Medium and Large Private Establishments"

    seasonal:
        file_path: "eb.seasonal"
        name: Seasonal Adjustment
        description: "Maps seasonal adjustment codes to seasonal adjustment descriptions"
        index_col: "seasonal_code"
        schema:
          seasonal_code:
            length: 1
            type: str
            example_value: "U"
          seasonal_text:
            length: 100
            type: str
            example_value: "Not Seasonally Adjusted"

    footnote:
        file_path: "eb.footnote"
        name: Footnotes
        description: "Maps footnote codes to footnote text"
        index_col: "footnote_code"
        schema:
          footnote_code:
            length: 1
            type: str
            example_value: "A"
          footnote_text:
            length: 100
            type: str
            example_value: "Average monthly premium"

processing:
  # Strategy for small survey
  strategy: in_memory  # Process in memory due to small size
  max_threads: 2     # Moderate parallelization for small-sized data
  
  # Performance hints
  use_mmap: true  # Use memory mapping for files
  enable_statistics: true
  enable_profiling: false

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Small enough to not need partitioning
        partition_by: [year]
      use_mmap: true
      series_size_class: Small
      list_data_files: [ eb.data.1.AllData ]
      # Schema optimization
      transformations:
        sort_by: [series_id, year, period]
        deduplicate: true
        deduplicate_on: [series_id, year, period, footnote_codes]

        validation:
          # Data quality checks
          rules:
            - field: value
              rule: range
              min: -10000000000000000.0 # MIN RANGE
              max: 10000000000000000.0 # MAX RANGE
              action: flag  # Flag but don't reject
            
            - field: year
              rule: range
              min: 1979
              max: 2055
              action: reject #(flag,ignore, reject,fatal)  *flag while testing
            
            - field: series_id
              rule: pattern
              pattern: "^EB[U]\\w{15}$"
              action: flag #flag while testing
            
            - field: period
              rule: values
              allowed: [ "A01" ]
              action: flag #flag while testing
          
          # Completeness checks
          required_fields: [ series_id, year, period ]
          nullable_fields: [ value, footnote_codes ]
        # Statistics for query optimization
        statistics:
          enabled: true
          columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: true
      series_size_class: Small
      output_file: "eb_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # Title code mapping
        title_code:
          lookup_table: "title"
          lookup_key: "title_code"
          lookup_value: "title_name"
          create_field: "title_name"
          on_missing: "UNKNOWN_TITLE"
          cache: true
        
        # Type code mapping
        type_code:
          lookup_table: "type"
          lookup_key: "type_code"
          lookup_value: "type_name"
          create_field: "type_name"
          on_missing: "UNKNOWN_TYPE"
          cache: true
        
        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^EB[U]\\w{15}$"
            action: flag
            message: "Invalid series ID format: should be EB[U] followed by 15 characters"
          
          - field: series_id
            rule: length
            exact: 17
            action: reject
            message: "Series ID must be exactly 17 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 1979
            max: 2055
            action: reject
            message: "Begin year must be between 1979 and 2055"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 1979
            max: 2055
            action: reject
            message: "End year must be between 1979 and 2055"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "A01" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "A01" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, title_code, type_code, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, title_code, type_code, begin_year, end_year ]
        output_file: "eb_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 1000    # Stop if too many errors
  log_errors: true
  error_file: "eb_errors.log"
  
  # Checkpoint settings
  checkpoint:
    enabled: true  # Enable checkpoints
    interval_records: 10000
    checkpoint_dir: "checkpoints/eb"