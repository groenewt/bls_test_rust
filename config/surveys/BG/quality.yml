# BG Survey Quality Configuration
# Data quality expectations, validations, and thresholds
config_version: 1

# Required checks field for QualityConfig
checks:
  - name: "series_id_not_null"
    check_type: "completeness"
    parameters:
      columns: ["series_id"]
    severity: "error"
  
  - name: "year_range_check" 
    check_type: "validity"
    parameters:
      column: "year"
      min: 1983
      max: 2030
    severity: "error"
    
  - name: "unique_series_combination"
    check_type: "uniqueness"
    parameters:
      columns: ["series_id", "year", "period"]
    severity: "error"

# Required validation field for QualityConfig
validation:
  strict_mode: true
  fail_on_error: false
  max_errors: 1000

expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "seasonal", "measure_code", "unit_code", "alteration_code", "sector_code", "contract_duration", "contract_selection", "begin_year", "begin_period", "end_year", "end_period"] }

  ranges:
    - { file: "main", column: "year", min: 1983, max: 2030 }
    - { file: "main", column: "value", min: -100.0, max: 100.0 }
    - { file: "series", column: "begin_year", min: 1983, max: 2030 }
    - { file: "series", column: "end_year", min: 1983, max: 2030 }

  enums:
    - { file: "main", column: "period", values: ["Q01", "Q02", "Q03", "Q04", "Q05", "Q13"] }
    - { file: "series", column: "begin_period", values: ["Q01", "Q02", "Q03", "Q04", "Q05", "Q13"] }
    - { file: "series", column: "end_period", values: ["Q01", "Q02", "Q03", "Q04", "Q05", "Q13"] }
    - { file: "series", column: "seasonal", values: ["S", "U"] }

  regex:
    - { file: "main", column: "series_id", pattern: "^BG[US]\\d{2}[01]{5}\\d{2}$" }
    - { file: "series", column: "series_id", pattern: "^BG[US]\\d{2}[01]{5}\\d{2}$" }
    - { file: "series", column: "measure_code", pattern: "^\\d{2}$" }
    - { file: "series", column: "unit_code", pattern: "^[1-9]$" }
    - { file: "series", column: "alteration_code", pattern: "^[1-9]$" }
    - { file: "series", column: "sector_code", pattern: "^[1-9]$" }
    - { file: "series", column: "contract_duration", pattern: "^[0-9]$" }
    - { file: "series", column: "contract_selection", pattern: "^\\d{2}$" }

  length:
    - { file: "main", column: "series_id", exact: 13 }
    - { file: "series", column: "series_id", exact: 13 }
    - { file: "series", column: "measure_code", exact: 2 }
    - { file: "series", column: "unit_code", exact: 1 }
    - { file: "series", column: "alteration_code", exact: 1 }
    - { file: "series", column: "sector_code", exact: 1 }
    - { file: "series", column: "contract_duration", exact: 1 }
    - { file: "series", column: "contract_selection", exact: 2 }

  lookup_exists:
    - { file: "series", column: "measure_code", lookup_table: "measure" }
    - { file: "series", column: "unit_code", lookup_table: "unit" }
    - { file: "series", column: "alteration_code", lookup_table: "alteration" }
    - { file: "series", column: "sector_code", lookup_table: "sector" }
    - { file: "series", column: "contract_duration", lookup_table: "duration" }
    - { file: "series", column: "contract_selection", lookup_table: "selection" }

  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }
    - { file: "series", validation: "(end_year > begin_year) OR (end_year == begin_year AND end_period >= begin_period)", message: "End date must be after or equal to begin date" }

row_count:
  min: 1
  warn_below: 25

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "distinct(measure_code)", "distinct(sector_code)"]
  persist: true

policy:
  mode: "continue"
  max_errors: 1000
  sample_on_fail_rows: 50
  log_errors: true
  error_file: "bg_errors.log"

actions:
  value_range_violation: "flag"
  year_range_violation: "reject"
  series_id_format_violation: "flag"
  period_enum_violation: "flag"
  measure_code_format_violation: "flag"
  unit_code_format_violation: "flag"
  alteration_code_format_violation: "flag"
  sector_code_format_violation: "flag"
  contract_duration_format_violation: "flag"
  contract_selection_format_violation: "flag"
  lookup_missing: "flag"
  cross_field_violation: "reject"
  length_violation: "reject"
  required_field_missing: "reject"