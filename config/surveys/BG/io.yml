# BG Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/bg"
  include:
    - "bg.series"
    - "bg.data.*"
    - "map/bg.alteration"
    - "map/bg.duration"
    - "map/bg.measure"
    - "map/bg.period"
    - "map/bg.sector"
    - "map/bg.selection"
    - "map/bg.unit"
  exclude: ["*.tmp", ".*", "*~", "*.bak"]

combining:
  enabled: false
  strategy: "none"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "size_based"
  max_partition_size_mb: 256
  partition_by: []
  
mmap:
  enable_for_mb_greater_than: 100
  
# Lookup file loading strategy
lookup_strategy:
  preload: ["period", "measure", "unit"]
  lazy: ["alteration", "duration", "sector", "selection"]
  mmap: []
  cache_all: true
