config_version: 1
discovery:
  root: "data/raw/bls/bg"
  include: ["bg.series", "bg.data.*", "bg.alteration", "bg.duration", "bg.measure", "bg.period", "bg.sector", "bg.selection", "bg.unit"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: false
  strategy: "none"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "size_based"
  max_partition_size_mb: 100
  partition_by: ["sector_code"]

mmap:
  enable_for_mb_greater_than: 10

lookup_config:
  preload: ["period", "measure", "unit"]
  lazy: ["alteration", "duration", "sector", "selection"]
  mmap: []
  cache_all: true