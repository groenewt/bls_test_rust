#Survey Series Information ***mapper defined after data file
series:
  path: "ap.series" #path to series file @TODO: full path?
  use_mmap: true
  series_size_class: Micro #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  idx_col: "series_id"
  schema:
    series_id:
      length: 17 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
      type: Text
      example_value: "APU0000712112" #??
      map_file: "" #leave blank for none
    area_code:
      length: 80
      type: Text
      example_value: "0000"
      needs_mapping: true
      map_file: "area" #leave blank for none
    item_code:
      length: 7 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
      type: Text
      example_value: "712112" #??
      needs_mapping: true
      map_file: "item" #leave blank for none
    series_title:
      length: 7
      type: Text
      example_value: "Potatoes, white, per lb. (453.6 gm) in U.S. city average, average price, not seasonally adjusted"
      needs_mapping: false
      map_file: "" #leave blank for none
    footnote_codes:
      length: 4 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
      type: Text
      example_value: " " #??
      needs_mapping: true
      map_file: "footnote" #leave blank for none
    begin_year:
      length: 4
      type: Text
      example_value: "1986"
      needs_mapping: false
      map_file: "" #leave blank for none
    begin_period:
      length: 3 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
      type: Text
      example_value: "M03" #??
      needs_mapping: true
      map_file: "period" #leave blank for none
    end_year:
      length: 4
      type: Text
      example_value: "2025"
      needs_mapping: false
      map_file: "" #leave blank for none
    end_period:
      length: 3
      type: Text
      example_value: "M06"
      needs_mapping: true
      map_file: "period" #leave blank for none


data_file:

  general:
    #
    use_mmap: true
    series_id_col: "series_id"
    obs_value: "value"
    schema:
      series_id:
        length: 17
        type: Text
        example_value: "APU0000701111"
      year:
        length: 4
        type: values
        example_value: "2025"
      period:
        length: 3
        type: Text
        example_value: "M06"
      value:
        length: 12
        type: values
        example_value: "0.574"
      footnote_codes:
        length: 10
        type: Text
        example_value: ""




lookup_files: #DEFINE SCHEMA AND ATTRIBUTES FOR LOOKUP FILES (maps to series)
  lookup_config:
    preload: [ area, item ]  # Small, frequently used
    lazy: [ footnote, period ]  # Load on demand
    mmap: [ ] # use it for large files
    cache_all: true  # Small enough to keep in memory
  files:
    area:
        file_path: "ap.area"
        name: Area
        description: Utilized to identify the area of the survey (various from nation, regions, states, csa's)
        index_col: "area_code"
        schema:
          area_code:
            length: 4 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
            type: str
            example_value: "A100" #??
          area_name:
            length: 80
            type: Text
            example_value: "Los Angeles-Riverside-Orange County, CA"


    footnote:
        file_path: "ap.footnote"
        name: Footnotes
        description: Footnotes
        index_col: "footnote_code"
        schema:
          footnote_code:
            length: 1 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
            type: str
            example_value: "C" #??
          footnote_text:
            length: 100 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
            type: str
            example_value: ""

    item:
        file_path: "ap.item"
        name: item
        description: specific item being observed in the data series
        index_col: "item_code"
        schema:
          item_code:
            length: 7 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
            type: str
            example_value: "703111" #??
          item_name:
            length: 100 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
            type: str
            example_value: "Ground chuck, 100% beef, per lb. (453.6 gm)" #??


    period:
      file_path: "ap.period"
      name: period
      description: Period of observation
      index_col: "period"
      schema:
        period:
          length: 3 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
          type: str
          example_value: "M01" #??
        period_abbr:
          length: 5 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
          type: str
          example_value: "JAN" #??
        period_name:
          length: 20 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
          type: str
          example_value: "January" #??

