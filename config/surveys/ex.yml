output:

  data_series:

    basic_load:
      # Format settings
      #format: parquet
      #compression: snappy  # Fast compression for small data
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for small dataset
        # Alternative: partition by year for time-series analysis
        # partition_by: [year]
      ## DISTINCT FOR 'data file type'/allowing for customizable approaches
      #PATTERN or list (explicit approach?)
      # if any data file has a different schema or size, utilize new 'section' under data_file
      use_mmap: false
      series_size_class: Micro #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
      list_data_files: [ ap.data.0.Current,ap.data.1.HouseholdFuels,ap.data.2.Gasoline,ap.data.3.Food ]
      partition_strategy:
        partion_by: "area_code"
        file_format: "ap.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period,footnote_codes]
     #     # Column encoding optimization (IF PARQUET)
     #     encoding:
     #       series_id: dictionary  # Repeated values
     #       area_code: dictionary
     #       item_code: dictionary
     #       year: delta  # Sequential years
     #       period: dictionar
     #       value: plain  # Prices vary widely


          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject

              - field: year
                rule: range
                min: 1900
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing

              - field: series_id
                rule: pattern
                pattern: "Invalid series ID format: should be AP[U/S][10] where [10:[area:4][item:6]]"
                action: flag #flag while testing

              - field: period
                rule: values
                allowed: [ "M01", "M02", "M03", "M04", "M05", "M06",
                           "M07", "M08", "M09", "M10", "M11", "M12" ,"M13"]
                action: flag #flag while testing

            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: false
      series_size_class: Micro
      output_file: "ap_series_dict.csv"

      # Mapping configuration for lookups
      mapping:
        # Area code mapping
        area_code:
          lookup_table: "area"
          lookup_key: "area_code"
          lookup_value: "area_name"
          create_field: "area_name"
          on_missing: "UNKNOWN_AREA"
          cache: true

        # Item code mapping
        item_code:
          lookup_table: "item"
          lookup_key: "item_code"
          lookup_value: "item_name"
          create_field: "item_name"
          on_missing: "UNKNOWN_ITEM"
          cache: true

        # Begin period mapping
        begin_period:
          lookup_table: "period"
          lookup_key: "period"
          lookup_value: "period_name"
          create_field: "begin_period_name"
          on_missing: keep_original
          cache: true

        # End period mapping
        end_period:
          lookup_table: "period"
          lookup_key: "period"
          lookup_value: "period_name"
          create_field: "end_period_name"
          on_missing: keep_original
          cache: true

        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true

      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]

      validation:
        # Data quality checks for series file //@TODO: Consolidate grouped 'types' with validation rules (but maybe being more explicit better?
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^AP[US]\\d{10}$"
            action: flag #flag while testing
            message: "Invalid series ID format: should be AP[U/S][10] where [10:[area:4][item:6]]"

          - field: series_id
            rule: length
            exact: 17
            action: reject
            message: "Series ID must be exactly 17 characters"

          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"

          # Area code validation
          - field: area_code
            rule: length
            exact: 4
            action: reject
            message: "Area code must be exactly 4 characters"

          - field: area_code
            rule: pattern
            pattern: "^[0-9A-Z]{4}$"
            action: flag
            message: "Area code should be 4 alphanumeric characters"

          - field: area_code
            rule: lookup_exists
            lookup_table: "area"
            action: flag
            message: "Area code not found in area lookup table"

          # Item code validation

          - field: item_code
            rule: pattern
            pattern: "^[0-9]{7}$"
            action: flag
            message: "Item code should be 7 digits"

          - field: item_name
            rule: lookup_exists
            lookup_table: "item"
            action: flag
            message: "Item code not found in item lookup table"

          # Series title validation
          - field: series_title
            rule: length
            min: 2
            max: 1012
            action: flag
            message: "Series title should be between 2 and 1012 characters"

          # Footnote codes validation
          - field: footnote_codes
            rule: length
            max: 10
            action: flag
            message: "Footnote codes field exceeds maximum length"


          # Begin year validation
          - field: begin_year
            rule: range
            min: 1776
            max: 2067
            action: reject
            message: "Begin year must be between 1776 and 2067"

          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"

          # End year validation
          - field: end_year
            rule: range
            min: 1776
            max: 2067
            action: reject
            message: "Begin year must be between 1776 and 2067"

          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"

          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"

          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "M01", "M02", "M03", "M04", "M05", "M06",
                       "M07", "M08", "M09", "M10", "M11", "M12","M13" ]
            action: flag
            message: "Invalid begin period value"




          # End period validation
          - field: end_period
            rule: values
            allowed: [ "M01", "M02", "M03", "M04", "M05", "M06",
                       "M07", "M08", "M09", "M10", "M11", "M12","M13" ]
            action: flag
            message: "Invalid end period value"


          # Cross-field validation: series_id consistency
          - field: series_id
            rule: composite_check
            check_fields: [ area_code, item_code ]
            validation: "series_id[3:7] == area_code AND series_id[7:13] == item_code"
            action: flag
            message: "Series ID components don't match area_code and item_code"

          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"

        # Completeness checks
        required_fields: [ series_id, area_code, item_code, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ series_title, footnote_codes ]

        # Uniqueness constraint
        unique_fields: [ series_id ]

      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, area_code, item_code, begin_year, end_year ]
        output_file: "ap_series_dict_stats.json"



# ============================================
# ERROR HANDLING & RECOVERY
# ============================================
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 1000    # Stop if too many errors
  log_errors: true
  error_file: "ap_errors.log"

  # Checkpoint settings (even for small files)
  checkpoint:
    enabled: false  # Not needed for 23MB
    interval_records: 10000
    checkpoint_dir: "checkpoints/ap"
