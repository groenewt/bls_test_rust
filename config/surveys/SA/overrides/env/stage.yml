# SA Survey Staging Environment Overrides
config_version: 1

# Staging-specific settings
logging:
  level: "info"

# Standard resource limits for staging
resources:
  max_threads: 4
  memory_limit_gb: 8

# Standard error handling for staging
error_handling:
  max_errors: 2000
  on_error: "continue"

# Disable profiling in staging
features:
  enable_profiling: false