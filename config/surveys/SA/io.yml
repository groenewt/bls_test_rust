# SA Survey IO Configuration
config_version: 1

discovery:
  root: "data/raw/bls/sa"
  include: ["sa.series", "sa.data.*", "sa.area", "sa.item", "sa.footnote", "sa.period"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year"]

mmap:
  enable_for_mb_greater_than: 100

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
