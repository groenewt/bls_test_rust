# CE Survey DAG Configuration
config_version: 1

graph:
  tasks:
    - id: "discover"
      type: "scan"
      inputs: []
      retries: { max: 2, backoff_sec: 10 }
      sla_minutes: 5
      
    - id: "validate"
      type: "validate_model"
      inputs: ["discover"]
      retries: { max: 1, backoff_sec: 5 }
      sla_minutes: 10
      
    - id: "plan"
      type: "partition_plan"
      inputs: ["validate"]
      retries: { max: 1, backoff_sec: 5 }
      sla_minutes: 5
      
    - id: "load_lookups"
      type: "load_lookups"
      inputs: ["plan"]
      retries: { max: 2, backoff_sec: 10 }
      sla_minutes: 15
      
    - id: "process_series"
      type: "execute"
      inputs: ["load_lookups"]
      parallelism: 2
      retries: { max: 1, backoff_sec: 30 }
      sla_minutes: 60
      
    - id: "process_data"
      type: "execute"
      inputs: ["load_lookups"]
      parallelism: 4
      retries: { max: 1, backoff_sec: 30 }
      sla_minutes: 120
      
    - id: "write_series"
      type: "output"
      inputs: ["process_series"]
      retries: { max: 2, backoff_sec: 15 }
      sla_minutes: 30
      
    - id: "write_data"
      type: "output"
      inputs: ["process_data"]
      retries: { max: 2, backoff_sec: 15 }
      sla_minutes: 60
      
    - id: "qc_series"
      type: "quality_checks"
      inputs: ["write_series"]
      retries: { max: 1, backoff_sec: 10 }
      sla_minutes: 15
      
    - id: "qc_data"
      type: "quality_checks"
      inputs: ["write_data"]
      retries: { max: 1, backoff_sec: 10 }
      sla_minutes: 30

  edges:
    - from: "discover"
      to: "validate"
    - from: "validate"
      to: "plan"
    - from: "plan"
      to: "load_lookups"
    - from: "load_lookups"
      to: "process_series"
    - from: "load_lookups"
      to: "process_data"
    - from: "process_series"
      to: "write_series"
    - from: "process_data"
      to: "write_data"
    - from: "write_series"
      to: "qc_series"
    - from: "write_data"
      to: "qc_data"

# Global DAG settings
settings:
  max_active_runs: 1
  catchup: false
  depends_on_past: false
  email_on_failure: true
  email_on_retry: false
  retries: 1
  retry_delay_minutes: 5
