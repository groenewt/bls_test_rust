# CE Survey Runtime Configuration
config_version: 1

feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  enable_checkpoints: true
  enable_parallel_processing: true

environment_overrides:
  - key: "BLS_CE_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_PARTITION_STRATEGY"
    maps_to: "partition_hints.strategy"
  - key: "BLS_CE_MAX_THREADS"
    maps_to: "resources.max_threads"
  - key: "BLS_CE_CHUNK_SIZE_MB"
    maps_to: "io.chunk_size_mb"

logging:
  level: "info"  # trace|debug|info|warn|error
  structured: true

development:
  enable_debug_output: false
  save_intermediate_files: false
  verbose_logging: false

# Error handling & recovery configuration
error_handling:
  on_error: "continue"  # continue|abort
  max_errors: 5000  # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "ce_errors.log"

# Checkpoint settings for large data processing
checkpoint:
  enabled: true  # Enable checkpoints for large data
  interval_records: 100000
  checkpoint_dir: "checkpoints/ce"

# Performance monitoring
monitoring:
  enabled: true  # Required field for MonitoringConfig
  metrics_endpoint: null
  health_check_interval: 60
