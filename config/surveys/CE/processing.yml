# CE Survey Processing Configuration
config_version: 1

strategy:
  mode: "mmap"  # in_memory|chunked|parallel|streaming|mmap
  max_concurrency: 1

resources:
  max_threads: 8  # Increased parallelization for large data
  memory_limit_gb: 16
  
io:
  chunk_size_mb: 100
  buffer_pool_size: 16

features:
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: true

transforms:
  - id: "normalize_period"
    expr: "upper(period)"
  - id: "parse_value"
    expr: "to_decimal(value, 18, 4)"
  - id: "sort_data"
    expr: "sort_by([series_id, year, period])"
  - id: "deduplicate_data"
    expr: "deduplicate_on([series_id, year, period, footnote_codes])"