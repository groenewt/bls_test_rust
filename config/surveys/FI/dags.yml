config_version: 1
graph:
  tasks:
    - id: "discover"
      type: "scan"
      inputs: []
      retries: { max: 2, backoff_sec: 10 }
      sla_minutes: 5
    
    - id: "validate"
      type: "validate_model"
      inputs: ["discover"]
      retries: { max: 1, backoff_sec: 5 }
      sla_minutes: 10
    
    - id: "plan"
      type: "partition_plan"
      inputs: ["validate"]
      retries: { max: 1, backoff_sec: 5 }
      sla_minutes: 5
    
    - id: "process_series"
      type: "execute"
      inputs: ["plan"]
      parallelism: 1
      sla_minutes: 30
    
    - id: "process_data"
      type: "execute"
      inputs: ["plan"]
      parallelism: 2
      sla_minutes: 60
    
    - id: "process_lookups"
      type: "execute"
      inputs: ["plan"]
      parallelism: 1
      sla_minutes: 15
    
    - id: "write_series"
      type: "output"
      inputs: ["process_series"]
      sla_minutes: 15
    
    - id: "write_data"
      type: "output"
      inputs: ["process_data"]
      sla_minutes: 30
    
    - id: "write_dict"
      type: "output"
      inputs: ["process_series", "process_lookups"]
      sla_minutes: 20
    
    - id: "qc"
      type: "quality_checks"
      inputs: ["write_series", "write_data", "write_dict"]
      sla_minutes: 15

  edges:
    - from: "discover"
      to: "validate"
    - from: "validate"
      to: "plan"
    - from: "plan"
      to: "process_series"
    - from: "plan"
      to: "process_data"
    - from: "plan"
      to: "process_lookups"
    - from: "process_series"
      to: "write_series"
    - from: "process_data"
      to: "write_data"
    - from: "process_series"
      to: "write_dict"
    - from: "process_lookups"
      to: "write_dict"
    - from: "write_series"
      to: "qc"
    - from: "write_data"
      to: "qc"
    - from: "write_dict"
      to: "qc"