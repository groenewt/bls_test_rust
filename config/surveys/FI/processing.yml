config_version: 1
strategy:
  mode: "chunked"  # Process in chunks due to medium size
  max_concurrency: 1

resources:
  max_threads: 4  # Increased parallelization for medium-sized data
  memory_limit_gb: 8
  
io:
  chunk_size_mb: 50
  buffer_pool_size: 8

features:
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: false

transforms:
  - id: "sort_data"
    expr: "sort_by([series_id, year, period])"
  - id: "deduplicate"
    expr: "deduplicate_on([series_id, year, period, footnote_codes])"