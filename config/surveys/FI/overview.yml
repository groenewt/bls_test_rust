definition: |
  The following is a definition of: CENSUS OF FATAL OCCUPATIONAL INJURIES

  Program Description: The Census of Fatal Occupational Injuries (CFOI) program
  collects data on fatal occupational injuries that is comprehensive, timely, and
  verifiable. The program identifies, verifies, and describes fatal occupational
  injuries.

  Summary Data Available: The CFOI program compiles a count of all fatal
  occupational injuries occurring during the calendar year. The program uses
  diverse data sources to identify fatal occupational injuries. Information on
  each workplace fatality (occupation and other worker characteristics, equipment
  or machinery involved, and circumstances of the event) is obtained from various
  sources including death certificates, workers' compensation records, reports to
  various regulatory agencies, medical examiner reports, and follow-up
  questionnaires. This multiple source approach assures counts are as complete
  and accurate as possible. For a fatality to be included in the census, the
  decedent must have been employed (working for pay, compensation, or profit) at
  the time of the event, engaged in a legal work activity, or present at the site
  of work as a requirement of employment. These criteria are generally broader
  than those used by Federal and State agencies administering specific workplace
  safety and health or workers' compensation regulations.