# ML Survey Quality Configuration
# Data quality expectations, validations, and thresholds
config_version: 1

# Required checks field for QualityConfig
checks:
  - name: "series_id_not_null"
    check_type: "completeness"
    parameters:
      columns: ["series_id"]
    severity: "error"
  
  - name: "year_range_check" 
    check_type: "validity"
    parameters:
      column: "year"
      min: 1995
      max: 2055
    severity: "error"
    
  - name: "unique_series_combination"
    check_type: "uniqueness"
    parameters:
      columns: ["series_id", "year", "period"]
    severity: "error"

# Required validation field for QualityConfig
validation:
  strict_mode: true
  fail_on_error: false
  max_errors: 1000

expectations:
  non_null:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "area_code", "industry_code", "dataelement_code", "seasonal", "begin_year", "begin_period", "end_year", "end_period"] }
  
  ranges:
    - { file: "main", column: "year", min: 1995, max: 2055 }
    - { file: "main", column: "value", min: 0, max: 1000000 }
    - { file: "series", column: "begin_year", min: 1995, max: 2067 }
    - { file: "series", column: "end_year", min: 1995, max: 2067 }
  
  enums:
    - { file: "main", column: "period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12"] }
    - { file: "series", column: "begin_period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12"] }
    - { file: "series", column: "end_period", values: ["M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12"] }
    - { file: "series", column: "seasonal", values: ["U", "S"] }
  
  regex:
    - { file: "series", column: "series_id", pattern: "^ML[SU]\\d{17}$" }
    - { file: "series", column: "area_code", pattern: "^[0-9]{5}$" }
    - { file: "series", column: "industry_code", pattern: "^[0-9]{6}$" }
    - { file: "series", column: "dataelement_code", pattern: "^[0-9]{2}$" }
  
  length:
    - { file: "series", column: "series_id", exact: 20 }
    - { file: "series", column: "area_code", exact: 5 }
    - { file: "series", column: "industry_code", exact: 6 }
    - { file: "series", column: "dataelement_code", exact: 2 }
    - { file: "series", column: "seasonal", exact: 1 }
  
  lookup_exists:
    - { file: "series", column: "area_code", lookup_table: "area" }
    - { file: "series", column: "industry_code", lookup_table: "industry" }
  
  cross_field:
    - { file: "series", validation: "end_year >= begin_year", message: "End year must be >= begin year" }
    - { file: "series", validation: "(end_year > begin_year) OR (end_year == begin_year AND end_period >= begin_period)", message: "End date must be after or equal to begin date" }

row_count:
  min: 1
  warn_below: 50

metrics:
  collect: ["row_count", "null_count", "distinct(series_id)", "distinct(area_code)", "distinct(industry_code)"]
  persist: true

policy:
  mode: "continue"
  max_errors: 1000
  sample_on_fail_rows: 25
  log_errors: true
  error_file: "ml_errors.log"

actions:
  value_range_violation: "flag"
  year_range_violation: "reject"
  series_id_format_violation: "flag"
  period_enum_violation: "flag"
  area_code_format_violation: "flag"
  industry_code_format_violation: "flag"
  dataelement_code_format_violation: "flag"
  lookup_missing: "flag"
  cross_field_violation: "reject"
  length_violation: "reject"
  required_field_missing: "reject"