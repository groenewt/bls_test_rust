definition: |
  The following is a definition of: MASS LAYOFFS

  Program Description: Mass Layoffs statistics provide information about mass
  layoff events, which involve at least 50 initial claims for unemployment
  insurance benefits from a single establishment during a consecutive 5-week
  period.

  Summary Data Available: Monthly data on Mass Layoffs are derived from
  unemployment insurance claims data combined with establishment information.
  The program identifies establishments that have at least 50 initial claims
  for unemployment insurance benefits filed against them during a consecutive
  5-week period, with at least 50 persons separated from their jobs for at
  least 31 days.

  The Mass Layoffs data include information on the number of layoff events,
  the number of initial claims associated with these events, and various
  characteristics of the establishments and workers involved. Data are
  available by industry, geographic area, and other establishment and worker
  characteristics.