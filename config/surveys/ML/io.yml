# ML Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/ml"
  include: ["ml.series", "ml.data.*", "ml.area", "ml.footnote", "ml.industry", "ml.reasons", "ml.state"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 300
  partition_by: ["year", "state_code"]

mmap:
  enable_for_mb_greater_than: 50

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
