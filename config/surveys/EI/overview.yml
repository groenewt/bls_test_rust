  code: "EI"
  name: "International Price Index"
  description: "International Price Index statistics track merchandise import and export price indexes based on several classification systems and selected import and export services indexes."
  size_class: "medium"
  characteristics:
    frequency: "monthly"
    coverage: "National import and export price data"
    time_series_count: "International Price Index series"
    classification_system: "Multiple (BEA, NAICS, Harmonized, etc.)"
    update_schedule: "Monthly release"
    begin_year: 1974
    survey_methodology: "Price indexes for merchandise imports and exports. Full coverage of merchandise imports began in February 1983 and full coverage of merchandise exports began in 1984."
    calculation_basis: "Price indexes calculated to one decimal place"

