# EI Survey Data Model Configuration
# Data model: files, schemas, relationships
config_version: 1

series:
  path: "ei.series"
  index: "series_id"
  estimated_size_gb: 0.1
  schema:
    series_id:
      type: "string"
      length: 30
      nullable: false
      example_value: "EIUCOCANMANU"
    seasonal:
      type: "string"
      length: 1
      nullable: false
      example_value: "U"
    index_code:
      type: "string"
      length: 2
      nullable: false
      example_value: "CO"
    series_name:
      type: "string"
      length: 100
      nullable: true
      example_value: "CANMANU"
    base_period:
      type: "string"
      length: 35
      nullable: true
      example_value: "2000 = 100"
    series_title:
      type: "string"
      length: 256
      nullable: true
      example_value: "All Commodities Import Price Index, Canada, Manufacturing"
    footnote_codes:
      type: "string"
      length: 10
      nullable: true
      example_value: ""
    begin_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "1990"
    begin_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "M01"
    end_year:
      type: "string"
      length: 4
      nullable: false
      example_value: "2024"
    end_period:
      type: "string"
      length: 3
      nullable: false
      example_value: "M12"

data_files:
  - id: "current"
    pattern: "ei.data.0.Current"
    index: "series_id"
    estimated_size_gb: 0.5
    schema:
      series_id:
        type: "string"
        length: 17
        nullable: false
        example_value: "EIUCOCANMANU"
      year:
        type: "int32"
        min: 1900
        max: 2100
        nullable: false
        example_value: 2024
      period:
        type: "string"
        length: 3
        pattern: "^M(0[1-9]|1[0-3])|Q(0[1-5])|S(0[1-3])$"
        nullable: false
        example_value: "M01"
      value:
        type: "decimal"
        precision: 18
        scale: 1
        nullable: true
        example_value: 97.7
      footnote_codes:
        type: "string"
        length: 10
        nullable: true
        example_value: ""

