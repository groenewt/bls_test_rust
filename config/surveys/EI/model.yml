lookups:
  - id: "footnote"
    path: "ei.footnote"
    index: "footnote_code"
    description: "Maps footnote codes to footnote text"
    schema:
      footnote_code:
        type: "string"
        length: 1
        nullable: false
        example_value: "P"
      footnote_text:
        type: "string"
        length: 200
        nullable: true
        example_value: "Preliminary"

  - id: "index"
    path: "ei.index"
    index: "index_code"
    description: "Maps index codes to index names"
    schema:
      index_code:
        type: "string"
        length: 2
        nullable: false
        example_value: "IR"
      index_name:
        type: "string"
        length: 50
        nullable: false
        example_value: "BEA End Use Import"

  - id: "period"
    path: "ei.period"
    index: "period"
    description: "Maps period codes to period names"
    schema:
      period:
        type: "string"
        length: 3
        nullable: false
        example_value: "M01"
      period_abbr:
        type: "string"
        length: 5
        nullable: false
        example_value: "JAN"
      period_name:
        type: "string"
        length: 20
        nullable: false
        example_value: "January"