# EI Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/ei"
  include: [
    "ei.series",
    "ei.data.0.Current",
    "ei.data.01.BEAImport",
    "ei.data.02.BEAExport",
    "ei.data.03.NAICSImport",
    "ei.data.04.NAICSExport",
    "ei.data.05.HarmonizedImport",
    "ei.data.06.HarmonizedExport",
    "ei.data.07.LocalityofOrigin",
    "ei.data.08.LocalityofDestination",
    "ei.data.09.TermsofTrade",
    "ei.data.10.ServicesImport",
    "ei.data.11.ServicesExport",
    "ei.data.12.ServicesInbound",
    "ei.data.13.ServicesOutbound",
    "ei.footnote",
    "ei.index",
    "ei.period",
    "ei.contacts",
    "ei.txt"
  ]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 5

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 300
  partition_by: ["year", "index_code"]

mmap:
  enable_for_mb_greater_than: 50

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
