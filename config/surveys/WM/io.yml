# WM Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/wm"
  include: ["wm.series", "wm.data.*", "wm.aspect", "wm.area", "wm.datatype", "wm.estimate", "wm.footnote", "wm.industry", "wm.level", "wm.occupation", "wm.ownership", "wm.period", "wm.seasonal", "wm.subcell"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["area_code"]

mmap:
  enable_for_mb_greater_than: 100