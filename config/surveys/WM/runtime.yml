# WM Survey Runtime Configuration
# Feature flags, env overrides mapping, logging
config_version: 1

feature_flags:
  enable_hot_reloads: false
  use_memory_map_series: true
  enable_checkpoints: true

environment_overrides:
  - key: "BLS_WM_MEMORY_LIMIT_GB"
    maps_to: "resources.memory_limit_gb"
  - key: "BLS_WM_MAX_THREADS"
    maps_to: "resources.max_threads"
  - key: "BLS_OUTPUT_FORMAT"
    maps_to: "format"
  - key: "BLS_PARTITION_STRATEGY"
    maps_to: "partition_hints.strategy"
  - key: "BLS_WM_MAX_ERRORS"
    maps_to: "error_handling.max_errors"

logging:
  level: "info"
  structured: true

error_handling:
  on_error: "continue"
  max_errors: 2000
  log_errors: true
  error_file: "wm_errors.log"
  checkpoint:
    enabled: true
    interval_records: 50000
    checkpoint_dir: "checkpoints/wm"