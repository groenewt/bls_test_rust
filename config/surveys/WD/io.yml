# WD Survey Input/Output Configuration
# Input discovery, patterns, partition hints
config_version: 1

discovery:
  root: "data/raw/bls/wd"
  include: ["wd.series", "wd.data.*", "wd.footnote", "wd.group", "wd.item", "wd.period", "wd.contacts"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 200
  partition_by: ["year", "group_code"]

mmap:
  enable_for_mb_greater_than: 50

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
