definition: |
  The following is a definition of: PRODUCER PRICE INDEX-Discontinued Commodity Series (WD)

  Program Description: The Producer Price Index - Commodity Data - discontinued (WD) 
  contains discontinued commodity series from the Producer Price Index program. These 
  series have been moved from the active WP database when they were discontinued.

  Summary Data Available: The WD database contains historical price index data for 
  commodity series that are no longer actively maintained. This includes indexes for 
  various commodity groups including farm products, processed foods, textile products, 
  fuels, chemicals, metals, machinery, and other manufactured goods.

  The data is partitioned into multiple files by commodity groups:
  - All commodities (group 00)
  - Farm products (group 01) 
  - Processed foods and feeds (group 02)
  - Textile products and apparel (group 03)
  - Hides, skins, leather (group 04)
  - Fuels and related products (group 05)
  - Chemicals and allied products (group 06)
  - Rubber and plastic products (group 07)
  - Lumber and wood products (group 08)
  - Pulp, paper, and allied products (group 09)
  - Metals and metal products (groups 10-109)
  - Machinery and equipment (groups 11-119)
  - Furniture and household durables (group 12)
  - Nonmetallic mineral products (group 13)
  - Transportation equipment (group 14)
  - Miscellaneous products (group 15)
  - Special groupings and aggregates
  - Services (groups 30-79)
  - Construction (group 80)

  These discontinued series provide historical context and continuity for 
  longitudinal analysis of commodity price trends.
