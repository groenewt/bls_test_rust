config_version: 1
series:
  path: "fw.series"
  index: "series_id"
  estimated_size_gb: 0.1
  schema:
    series_id: { type: "string", length: 17, nullable: false }
    seasonal: { type: "string", length: 1, enum: ["U"], nullable: false }
    category_code: { type: "string", length: 3, nullable: false }
    industry_code: { type: "string", length: 6, nullable: false }
    event_code: { type: "string", length: 6, nullable: false }
    source_code: { type: "string", length: 6, nullable: false }
    occupation_code: { type: "string", length: 6, nullable: false }
    datatype_code: { type: "string", length: 1, nullable: false }
    case_code: { type: "string", length: 1, nullable: false }
    area_code: { type: "string", length: 3, nullable: false }
    series_title: { type: "string", length: 200, nullable: false }
    footnote_codes: { type: "string", length: 10, nullable: true }
    begin_year: { type: "string", length: 4, nullable: false }
    begin_period: { type: "string", length: 3, nullable: false }
    end_year: { type: "string", length: 4, nullable: false }
    end_period: { type: "string", length: 3, nullable: false }

data_files:
  - id: "main"
    pattern: "fw.data.*"
    index: "series_id"
    schema:
      series_id: { type: "string", length: 17 }
      year: { type: "int32", min: 1992 }
      period: { type: "string", length: 3, pattern: "^A01$" }
      value: { type: "decimal", precision: 18, scale: 4 }
      footnote_codes: { type: "string", length: 10, nullable: true }

lookups:
  - id: "area"
    path: "fw.area"
    index: "area_code"
    schema:
      area_code: { type: "string", length: 3 }
      area_text: { type: "string", length: 100 }
      display_level: { type: "string", length: 2 }
      selectable: { type: "string", length: 1 }
      sort_sequence: { type: "string", length: 5 }
  
  - id: "case"
    path: "fw.case"
    index: "case_code"
    schema:
      case_code: { type: "string", length: 1 }
      case_text: { type: "string", length: 100 }
  
  - id: "category"
    path: "fw.category"
    index: "category_code"
    schema:
      case_code: { type: "string", length: 1 }
      category_code: { type: "string", length: 3 }
      category_text: { type: "string", length: 100 }
  
  - id: "category2"
    path: "fw.category2"
    index: "category_code"
    schema:
      category_code: { type: "string", length: 3 }
      category_text: { type: "string", length: 100 }
  
  - id: "datatype"
    path: "fw.datatype"
    index: "datatype_code"
    schema:
      datatype_code: { type: "string", length: 1 }
      datatype_text: { type: "string", length: 100 }
  
  - id: "event"
    path: "fw.event"
    index: "event_code"
    schema:
      event_code: { type: "string", length: 6 }
      event_text: { type: "string", length: 100 }
      display_level: { type: "string", length: 2 }
      selectable: { type: "string", length: 1 }
      sort_sequence: { type: "string", length: 5 }
  
  - id: "footnote"
    path: "fw.footnote"
    index: "footnote_code"
    schema:
      footnote_code: { type: "string", length: 1 }
      footnote_text: { type: "string", length: 100 }
  
  - id: "industry"
    path: "fw.industry"
    index: "industry_code"
    schema:
      industry_code: { type: "string", length: 6 }
      industry_text: { type: "string", length: 100 }
      display_level: { type: "string", length: 2 }
      selectable: { type: "string", length: 1 }
      sort_sequence: { type: "string", length: 5 }
  
  - id: "occupation"
    path: "fw.occupation"
    index: "occupation_code"
    schema:
      occupation_code: { type: "string", length: 6 }
      occupation_text: { type: "string", length: 100 }
      display_level: { type: "string", length: 2 }
      selectable: { type: "string", length: 1 }
      sort_sequence: { type: "string", length: 5 }
  
  - id: "seasonal"
    path: "fw.seasonal"
    index: "seasonal_code"
    schema:
      seasonal_code: { type: "string", length: 1 }
      seasonal_text: { type: "string", length: 100 }
  
  - id: "source"
    path: "fw.source"
    index: "source_code"
    schema:
      source_code: { type: "string", length: 6 }
      source_text: { type: "string", length: 100 }
      display_level: { type: "string", length: 2 }
      selectable: { type: "string", length: 1 }
      sort_sequence: { type: "string", length: 5 }

relationships:
  - from: { file: "main", column: "series_id" }
    to: { file: "series", column: "series_id" }
    type: "many-to-one"

constraints:
  unique:
    - { file: "series", columns: ["series_id"] }
    - { file: "main", columns: ["series_id", "year", "period"] }
  required_fields:
    - { file: "main", columns: ["series_id", "year", "period"] }
    - { file: "series", columns: ["series_id", "seasonal", "category_code", "begin_year", "begin_period", "end_year", "end_period"] }