config_version: 1
discovery:
  root: "data/raw/bls/fw"
  include: ["fw.series", "fw.data.*", "fw.area", "fw.case", "fw.category", "fw.category2", "fw.datatype", "fw.event", "fw.footnote", "fw.industry", "fw.occupation", "fw.seasonal", "fw.source"]
  exclude: ["*.tmp", ".*", "*~"]

combining:
  enabled: true
  strategy: "smart"
  thresholds:
    small_file_mb: 10

partition_hints:
  strategy: "adaptive"
  max_partition_size_mb: 500
  partition_by: ["year", "category_code"]

mmap:
  enable_for_mb_greater_than: 100
  
lookup_config:
  preload: ["area", "case", "category2", "datatype"]
  lazy: ["footnote", "event", "industry", "occupation", "source"]
  mmap: ["category"]
  cache_all: true

# Lookup file loading strategy
lookup_strategy:
  preload: []
  lazy: []
  mmap: []
  cache_all: true
