# .config/surveys/bp.yml
# name: Collective Bargaining Series - Private Sector Processing Configuration
# description:
# author: Junie
# date: 2025-08-07
# notes:
#         - data location: .data.raw/bls/bp
#         - Data files are in ASCII text format
#         - Spaces separate data elements in an original BLS file
#         - full doc: .docs/bls/survey/bp.txt
# changes:

#General Survey Information
survey:
  code: bp #survey code (ex.ap,sm,tu)- see docs (.docs/surveys/* for all surveys)
  name: Collective Bargaining Series - Private Sector #friendly survey name
  size_class: small #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  description: "This series summarizes wage-rate changes in major collective bargaining agreements (covering 1,000 workers or more) for production and related workers in manufacturing and nonsupervisory workers in nonmanufacturing."
  definition: "
The following is a definition of:  COLLECTIVE BARGAINING SERIES - PRIVATE SECTOR (BP)

Survey Description:  This series summarizes wage-rate changes in major 
collective bargaining agreements (covering 1,000 workers or more) for 
production and related workers in manufacturing and nonsupervisory workers 
in nonmanufacturing.  Compensation (wages and benefits) changes are measured
for agreements covering 5,000 workers or more.

Summary Data Available:

Wage-Rate Changes:  \"Settlements\" data measure specified net increases, 
decreases, and zero change in wage rates resulting from settlements 
negotiated in the reference period.  Changes occurring within 12 months of 
the contract effective date (\"first-year\") and all changes that occur over 
the contract term expressed as an annual rate (\"over the life\") are 
presented.  Data on \"wage-rate changes under all major agreements\" include 
increases, decreases and zero change in wage rates during the reference 
period for all workers in the series, regardless of the contract settlement 
date.  Included are changes stemming from settlements reached in the 
calendar year, from agreements reached in a prior year with changes deferred
to the reference period, and from COLA clauses.  Lump-sum payments are 
excluded from \"settlements\" data and from \"wage-rate changes under all major 
agreements\".

Compensation Changes:  These data reflect changes (net increases, decreases,
and zero change) in employee compensation (wages and benefits) resulting 
from settlements covering 5,000 workers or more which were negotiated in the
reference period.  The \"compensation rate\" change measures net increases, 
decreases, and zero change in compensation rates per work hour resulting 
from contract settlements.  Lump-sum payments are excluded.  Changes 
occurring within 12 months of the contract effective date (\"first year\") and
all changes that occur over the contract term expressed as an annual rate 
(\"over the life\") are presented.  The \"compensation cost\" change measures 
net increases, decreases, and zero change in the costs for employee 
compensation per work hour, including specified lump-sum payments, and 
reflects the timing of compensation rate changes.  Changes that occur over 
the contract term are expressed as an annual rate (\"over the life\").
                "
  characteristics:
    frequency: quarterly
    coverage: "Data on wage-rate changes in major collective bargaining agreements for production and related workers in manufacturing and nonsupervisory workers in nonmanufacturing."
    time_series_count: "Collective Bargaining Series - Private Sector"
    classification_system: "Industry classification"
    update_schedule: "Updates are available about 4 weeks after the end of each calendar quarter."
    begin_year: 1983
    survey_methodology: "Data are collected from major collective bargaining agreements covering 1,000 workers or more."
    calculation_basis: "Percent changes in wage rates and compensation"

#Survey Series Information
series:
  path: "bp.series" #path to series file
  use_mmap: true
  series_size_class: Small #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  idx_col: "series_id"
  schema:
    series_id:
      length: 13
      type: Text
      example_value: "BPU0114101001"
      map_file: ""
    measure_code:
      length: 2
      type: Text
      example_value: "01"
      needs_mapping: true
      map_file: "measure"
    unit_code:
      length: 1
      type: Text
      example_value: "1"
      needs_mapping: true
      map_file: "unit"
    periodicity_code:
      length: 1
      type: Text
      example_value: "1"
      needs_mapping: true
      map_file: "periodicity"
    alteration_code:
      length: 1
      type: Text
      example_value: "1"
      needs_mapping: true
      map_file: "alteration"
    industry_code:
      length: 2
      type: Text
      example_value: "01"
      needs_mapping: true
      map_file: "industry"
    contract_duration:
      length: 1
      type: Text
      example_value: "0"
      needs_mapping: true
      map_file: "duration"
    contract_selection:
      length: 2
      type: Text
      example_value: "01"
      needs_mapping: true
      map_file: "selection"
    seasonal:
      length: 1
      type: Text
      example_value: "U"
      needs_mapping: false
      map_file: ""
    begin_year:
      length: 4
      type: Text
      example_value: "1983"
      needs_mapping: false
      map_file: ""
    begin_period:
      length: 3
      type: Text
      example_value: "Q01"
      needs_mapping: true
      map_file: "period"
    end_year:
      length: 4
      type: Text
      example_value: "1995"
      needs_mapping: false
      map_file: ""
    end_period:
      length: 3
      type: Text
      example_value: "Q04"
      needs_mapping: true
      map_file: "period"

data_file:
  general:
    use_mmap: true
    series_id_col: "series_id"
    obs_value: "value"
    schema:
      series_id:
        length: 13
        type: Text
        example_value: "BPU0114101001"
      year:
        length: 4
        type: values
        example_value: "1995"
      period:
        length: 3
        type: Text
        example_value: "Q01"
      value:
        length: 12
        type: values
        example_value: "2.3"
      cont_break:
        length: 1
        type: Text
        example_value: "N"
      status:
        length: 1
        type: Text
        example_value: "F"
      footnote_exists:
        length: 1
        type: Text
        example_value: "N"

lookup_files: #DEFINE SCHEMA AND ATTRIBUTES FOR LOOKUP FILES (maps to series)
  lookup_config:
    preload: [ industry, period ]  # Small, frequently used
    lazy: [ alteration, duration, measure, periodicity, selection, unit ]  # Load on demand
    mmap: [ ] # use it for large files
    cache_all: true  # Small enough to keep in memory
  files:
    alteration:
        file_path: "bp.alteration"
        name: Alteration
        description: "Maps alteration codes to alteration text"
        index_col: "alteration_code"
        schema:
          alteration_code:
            length: 1
            type: str
            example_value: "1"
          alteration_text:
            length: 50
            type: str
            example_value: "Changes (increases, decreases, and no change)"

    duration:
        file_path: "bp.duration"
        name: Contract Duration
        description: "Maps contract duration codes to contract duration text"
        index_col: "contract_duration"
        schema:
          contract_duration:
            length: 1
            type: str
            example_value: "0"
          contract_duration_text:
            length: 50
            type: str
            example_value: "All contracts"

    industry:
        file_path: "bp.industry"
        name: Industry
        description: "Maps industry codes to industry names"
        index_col: "industry_code"
        schema:
          industry_code:
            length: 2
            type: str
            example_value: "01"
          industry_name:
            length: 40
            type: str
            example_value: "All industries"

    measure:
        file_path: "bp.measure"
        name: Measure
        description: "Maps measure codes to measure text"
        index_col: "measure_code"
        schema:
          measure_code:
            length: 2
            type: str
            example_value: "01"
          measure_text:
            length: 90
            type: str
            example_value: "Settlements, 1st Year Compensation"

    period:
        file_path: "bp.period"
        name: Period
        description: "Maps period codes to period names"
        index_col: "period"
        schema:
          period:
            length: 3
            type: str
            example_value: "Q01"
          period_abbr:
            length: 5
            type: str
            example_value: "QTR1"
          period_name:
            length: 20
            type: str
            example_value: "1st Quarter"

    periodicity:
        file_path: "bp.periodicity"
        name: Periodicity
        description: "Maps periodicity codes to periodicity text"
        index_col: "periodicity_code"
        schema:
          periodicity_code:
            length: 1
            type: str
            example_value: "1"
          periodicity_text:
            length: 40
            type: str
            example_value: "Four quarters ending"

    selection:
        file_path: "bp.selection"
        name: Contract Selection
        description: "Maps contract selection codes to contract selection text"
        index_col: "contract_selection"
        schema:
          contract_selection:
            length: 2
            type: str
            example_value: "01"
          contract_selection_text:
            length: 80
            type: str
            example_value: "All contracts in period"

    unit:
        file_path: "bp.unit"
        name: Unit
        description: "Maps unit codes to unit text"
        index_col: "unit_code"
        schema:
          unit_code:
            length: 1
            type: str
            example_value: "1"
          unit_text:
            length: 20
            type: str
            example_value: "Mean (in percent)"

processing:
  # Strategy for small survey
  strategy: in_memory  # Load entirely into memory
  max_threads: 2       # Limited parallelization needed
  
  # Performance hints
  use_mmap: false  # Too small to benefit from mmap
  enable_statistics: true
  enable_profiling: false

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for small dataset
      use_mmap: false
      series_size_class: Small
      list_data_files: [ bp.data.1.AllData ]
      partition_strategy:
        partion_by: "industry_code"
        file_format: "bp.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period]
          
          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -100.0 # MIN RANGE
                max: 100.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 1983
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^BP[US]\\d{11}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "Q01", "Q02", "Q03", "Q04", "Q05" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, cont_break, status, footnote_exists ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: false
      series_size_class: Small
      output_file: "bp_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # Measure code mapping
        measure_code:
          lookup_table: "measure"
          lookup_key: "measure_code"
          lookup_value: "measure_text"
          create_field: "measure_text"
          on_missing: "UNKNOWN_MEASURE"
          cache: true
        
        # Unit code mapping
        unit_code:
          lookup_table: "unit"
          lookup_key: "unit_code"
          lookup_value: "unit_text"
          create_field: "unit_text"
          on_missing: "UNKNOWN_UNIT"
          cache: true
        
        # Periodicity code mapping
        periodicity_code:
          lookup_table: "periodicity"
          lookup_key: "periodicity_code"
          lookup_value: "periodicity_text"
          create_field: "periodicity_text"
          on_missing: "UNKNOWN_PERIODICITY"
          cache: true
        
        # Alteration code mapping
        alteration_code:
          lookup_table: "alteration"
          lookup_key: "alteration_code"
          lookup_value: "alteration_text"
          create_field: "alteration_text"
          on_missing: "UNKNOWN_ALTERATION"
          cache: true
        
        # Industry code mapping
        industry_code:
          lookup_table: "industry"
          lookup_key: "industry_code"
          lookup_value: "industry_name"
          create_field: "industry_name"
          on_missing: "UNKNOWN_INDUSTRY"
          cache: true
        
        # Contract duration mapping
        contract_duration:
          lookup_table: "duration"
          lookup_key: "contract_duration"
          lookup_value: "contract_duration_text"
          create_field: "contract_duration_text"
          on_missing: "UNKNOWN_DURATION"
          cache: true
        
        # Contract selection mapping
        contract_selection:
          lookup_table: "selection"
          lookup_key: "contract_selection"
          lookup_value: "contract_selection_text"
          create_field: "contract_selection_text"
          on_missing: "UNKNOWN_SELECTION"
          cache: true
        
        # Begin period mapping
        begin_period:
          lookup_table: "period"
          lookup_key: "period"
          lookup_value: "period_name"
          create_field: "begin_period_name"
          on_missing: keep_original
          cache: true
        
        # End period mapping
        end_period:
          lookup_table: "period"
          lookup_key: "period"
          lookup_value: "period_name"
          create_field: "end_period_name"
          on_missing: keep_original
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^BP[SU]\\d{11}$"
            action: flag
            message: "Invalid series ID format: should be BP[S/U] followed by 11 digits"
          
          - field: series_id
            rule: length
            exact: 13
            action: reject
            message: "Series ID must be exactly 13 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # Measure code validation
          - field: measure_code
            rule: length
            exact: 2
            action: reject
            message: "Measure code must be exactly 2 characters"
          
          - field: measure_code
            rule: lookup_exists
            lookup_table: "measure"
            action: flag
            message: "Measure code not found in measure lookup table"
          
          # Industry code validation
          - field: industry_code
            rule: length
            exact: 2
            action: reject
            message: "Industry code must be exactly 2 characters"
          
          - field: industry_code
            rule: lookup_exists
            lookup_table: "industry"
            action: flag
            message: "Industry code not found in industry lookup table"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 1983
            max: 2067
            action: reject
            message: "Begin year must be between 1983 and 2067"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 1983
            max: 2067
            action: reject
            message: "End year must be between 1983 and 2067"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "Q01", "Q02", "Q03", "Q04", "Q05" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "Q01", "Q02", "Q03", "Q04", "Q05" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, measure_code, unit_code, periodicity_code, alteration_code, industry_code, contract_duration, contract_selection, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, measure_code, industry_code, begin_year, end_year ]
        output_file: "bp_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 1000    # Stop if too many errors
  log_errors: true
  error_file: "bp_errors.log"
  
  # Checkpoint settings (not needed for small files)
  checkpoint:
    enabled: false
    interval_records: 10000
    checkpoint_dir: "checkpoints/bp"