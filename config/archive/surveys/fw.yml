    industry:
        file_path: "fw.industry"
        name: Industry
        description: "Maps industry codes to industry descriptions"
        index_col: "industry_code"
        schema:
          industry_code:
            length: 6
            type: str
            example_value: "000000"
          industry_text:
            length: 100
            type: str
            example_value: "Text"
          display_level:
            length: 2
            type: str
            example_value: "0"
