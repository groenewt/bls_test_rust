#General Survey Information
survey:
  code: fw #survey code (ex.ap,sm,fw)- see docs (docs/surveys/* for all surveys)
  name: Census of Fatal Occupational Injuries #friendly survey name
  size_class: medium #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  description: "The Bureau of Labor Statistics (BLS) Census of Fatal Occupational Injuries (CFOI) produces comprehensive, accurate, and timely counts of fatal work injuries."
  definition: "
The following is a definition of: CENSUS OF FATAL OCCUPATIONAL INJURIES (FW)

Survey Description:   

The Bureau of Labor Statistics (BLS) Census of Fatal Occupational Injuries (CFOI) produces 
comprehensive, accurate, and timely counts of fatal work injuries.  CFOI is a Federal-State 
cooperative program that has been active in all 50 States and the District of Columbia since 1992. 
To compile counts that are as complete as possible, CFOI uses multiple sources to identify, 
verify, and profile fatal worker injuries.  Information about each workplace fatal injury is 
obtained by cross referencing the source records, such as death certificates, workers' 
compensation reports, and Federal and State agency administrative reports.  To ensure that fatal 
injuries are work-related, cases are substantiated with two or more independent source documents, 
or a source document and a follow-up questionnaire.

CFOI publishes detailed data on case characteristics such as the event or exposure leading to the 
fatal injury, the source of the fatal injury, and worker activity at the time of the incident.  
Event or exposure, source, and other case characteristic codes are currently based on the BLS 
Occupational Injury and Illness Classification System (OIICS) 2.01, which can be viewed at our Web 
site at http://www.bls.gov/iif/oshoiics.htm.

BLS also tabulates the number of fatal occupational injuries by demographic attributes such as 
age, gender, race, ethnic origin, and occupation.  Occupation classifications are currently based 
on the 2010 Standard Occupational Classification [SOC] system.  These tabulations are also 
available by major industry sectors or by detailed industry. Industry classifications are currently 
based on the 2007 North American Industrial Classification System [NAICS].

Frequency of observations:  All data are annual.

Data characteristics:  All figures are actual numbers of fatal injuries.

Updating schedule:  Updates to the data become available approximately 8 months following the close 
of the reference year.
                "
  characteristics:
    frequency: annual
    coverage: "All 50 States and the District of Columbia"
    time_series_count: "Fatal occupational injuries data" 
    classification_system: "Occupational Injury and Illness Classification System (OIICS) 2.01, 2010 Standard Occupational Classification (SOC), 2007 North American Industrial Classification System (NAICS)"
    update_schedule: "Updates available approximately 8 months following the close of the reference year"
    begin_year: 1992
    survey_methodology: "Federal-State cooperative program that uses multiple sources to identify, verify, and profile fatal worker injuries"
    calculation_basis: "Actual numbers of fatal injuries"

#Survey Series Information
series:
  path: "fw.series" #path to series file
  use_mmap: true
  series_size_class: Medium #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  idx_col: "series_id"
  schema:
    series_id:
      length: 17 #USE DEFINED FIELD LENGTH From (docs/bls/survey/${SURVEY_CODE}.txt)
      type: Text
      example_value: "FWU00X00000080N00"
      map_file: "" #leave blank for none
    seasonal:
      length: 1
      type: Text
      example_value: "U"
      needs_mapping: true
      map_file: "seasonal" #leave blank for none
    category_code:
      length: 3
      type: Text
      example_value: "00X"
      needs_mapping: true
      map_file: "category2" #leave blank for none
    industry_code:
      length: 6
      type: Text
      example_value: "000000"
      needs_mapping: true
      map_file: "industry" #leave blank for none
    event_code:
      length: 6
      type: Text
      example_value: "0000XX"
      needs_mapping: true
      map_file: "event" #leave blank for none
    source_code:
      length: 6
      type: Text
      example_value: "0000XX"
      needs_mapping: true
      map_file: "source" #leave blank for none
    occupation_code:
      length: 6
      type: Text
      example_value: "000000"
      needs_mapping: true
      map_file: "occupation" #leave blank for none
    datatype_code:
      length: 1
      type: Text
      example_value: "8"
      needs_mapping: true
      map_file: "datatype" #leave blank for none
    case_code:
      length: 1
      type: Text
      example_value: "0"
      needs_mapping: true
      map_file: "case" #leave blank for none
    area_code:
      length: 3
      type: Text
      example_value: "N00"
      needs_mapping: true
      map_file: "area" #leave blank for none
    series_title:
      length: 200
      type: Text
      example_value: "Fatal occupational injuries"
      needs_mapping: false
      map_file: "" #leave blank for none
    footnote_codes:
      length: 10
      type: Text
      example_value: ""
      needs_mapping: true
      map_file: "footnote" #leave blank for none
    begin_year:
      length: 4
      type: Text
      example_value: "2011"
      needs_mapping: false
      map_file: "" #leave blank for none
    begin_period:
      length: 3
      type: Text
      example_value: "A01"
      needs_mapping: false
      map_file: "" #leave blank for none
    end_year:
      length: 4
      type: Text
      example_value: "2011"
      needs_mapping: false
      map_file: "" #leave blank for none
    end_period:
      length: 3
      type: Text
      example_value: "A01"
      needs_mapping: false
      map_file: "" #leave blank for none

data_file:
  general:
    use_mmap: true
    series_id_col: "series_id"
    obs_value: "value"
    schema:
      series_id:
        length: 17
        type: Text
        example_value: "FWU00X00000080N00"
      year:
        length: 4
        type: values
        example_value: "2011"
      period:
        length: 3
        type: Text
        example_value: "A01"
      value:
        length: 12
        type: values
        example_value: "4609"
      footnote_codes:
        length: 10
        type: Text
        example_value: ""

lookup_files: #DEFINE SCHEMA AND ATTRIBUTES FOR LOOKUP FILES (maps to series)
  lookup_config:
    preload: [ area, case, category2, datatype ]  # Small, frequently used
    lazy: [ footnote, event, industry, occupation, source ]  # Load on demand
    mmap: [ category ]  # use it for large files
    cache_all: true  # Small enough to keep in memory
  files:
    area:
        file_path: "fw.area"
        name: Area
        description: "Maps area codes to area names"
        index_col: "area_code"
        schema:
          area_code:
            length: 3
            type: str
            example_value: "N00"
          area_text:
            length: 100
            type: str
            example_value: "United States"
          display_level:
            length: 2
            type: str
            example_value: "0"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 5
            type: str
            example_value: "00001"

    case:
        file_path: "fw.case"
        name: Case
        description: "Maps case codes to case descriptions"
        index_col: "case_code"
        schema:
          case_code:
            length: 1
            type: str
            example_value: "9"
          case_text:
            length: 100
            type: str
            example_value: "Text"

    category:
        file_path: "fw.category"
        name: Category
        description: "Maps category codes to category descriptions"
        index_col: "category_code"
        schema:
          case_code:
            length: 1
            type: str
            example_value: "9"
          category_code:
            length: 3
            type: str
            example_value: "00X"
          category_text:
            length: 100
            type: str
            example_value: "Text"

    category2:
        file_path: "fw.category2"
        name: Category2
        description: "Maps category codes to category descriptions"
        index_col: "category_code"
        schema:
          category_code:
            length: 3
            type: str
            example_value: "00X"
          category_text:
            length: 100
            type: str
            example_value: "Text"

    datatype:
        file_path: "fw.datatype"
        name: Data Type
        description: "Maps data type codes to data type descriptions"
        index_col: "datatype_code"
        schema:
          datatype_code:
            length: 1
            type: str
            example_value: "8"
          datatype_text:
            length: 100
            type: str
            example_value: "Text"

    event:
        file_path: "fw.event"
        name: Event
        description: "Maps event codes to event descriptions"
        index_col: "event_code"
        schema:
          event_code:
            length: 6
            type: str
            example_value: "0000XX"
          event_text:
            length: 100
            type: str
            example_value: "Text"
          display_level:
            length: 2
            type: str
            example_value: "0"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 5
            type: str
            example_value: "00001"

    footnote:
        file_path: "fw.footnote"
