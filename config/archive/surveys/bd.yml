#General Survey Information
survey:
  code: bd #survey code (ex.ap,sm,tu)- see docs (.docs/surveys/* for all surveys)
  name: Business Employment Dynamics #friendly survey name
  size_class: medium #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  description: "Business Employment Dynamics statistics track changes in employment at the establishment level, revealing the dynamics underlying net changes in employment."
  definition: "
The following is a definition of:  BUSINESS EMPLOYMENT DYNAMICS

Program Description:  Business Employment Dynamics statistics track changes
in employment at the establishment level, revealing the dynamics underlying net
changes in employment.

Summary Data Available: Quarterly data on Business Employment Dynamics are
derived from the Quarterly Census of Employment and Wages program.
This program is the quarterly census of all establishments under State
unemployment insurance programs, representing about 98 percent of employment on
nonfarm payrolls.  The data include all establishments subject to the State
unemployment insurance (UI) laws and Federal agencies subject to the
Unemployment Compensation for Federal Employees (UCFE) program.  Major
exclusions from UI coverage are the self-employed workers, religious
organizations, most agricultural workers on small farms, members of the Armed
Forces and certain small nonprofit organizations.

The Business Employment Dynamics totals require that establishment data be
linked across quarters.  This longitudinal aspect of the data allows the
tracking of when establishments open, close, and expand or contract their
employees.  There are four types of job flows: employment gains at opening
establishments, employment expansions at existing establishments, employment
losses at closing establishments, and employment contractions at existing
establishments.  Increases in employment at opening and expanding
establishments sum to measure job gains.  Declines in employment at closing and
contracting establishments sum to measure job losses. The more traditional
measure of a net change in the employment is the difference between the number
of jobs gained and the number of jobs lost.
                "
  characteristics:
    frequency: quarterly
    coverage: "National, state, and industry data on employment changes"
    time_series_count: "Business Employment Dynamics series" 
    classification_system: "NAICS (North American Industry Classification System)"
    update_schedule: "Quarterly release"
    begin_year: 1992
    survey_methodology: "Derived from the Quarterly Census of Employment and Wages program, which covers about 98 percent of employment on nonfarm payrolls."
    calculation_basis: "Longitudinal tracking of establishment data across quarters"

#Survey Series Information
series:
  path: "bd.series" #path to series file
  use_mmap: true
  series_size_class: Medium #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  idx_col: "series_id"
  schema:
    series_id:
      length: 30 #USE DEFINED FIELD LENGTH From (.docus/bls/survey/${SURVEY_CODE}.txt)
      type: Text
      example_value: "BDS0000006000200090110001LQ5"
      map_file: "" #leave blank for none
    seasonal:
      length: 1
      type: Text
      example_value: "S"
      needs_mapping: false
      map_file: "" #leave blank for none
    msa_code:
      length: 5
      type: Text
      example_value: "00000"
      needs_mapping: true
      map_file: "msa" #leave blank for none
    state_code:
      length: 2
      type: Text
      example_value: "00"
      needs_mapping: true
      map_file: "state" #leave blank for none
    county_code:
      length: 3
      type: Text
      example_value: "000"
      needs_mapping: true
      map_file: "county" #leave blank for none
    industry_code:
      length: 6
      type: Text
      example_value: "000000"
      needs_mapping: true
      map_file: "industry" #leave blank for none
    unitanalysis_code:
      length: 1
      type: Text
      example_value: "1"
      needs_mapping: false
      map_file: "" #leave blank for none
    dataelement_code:
      length: 1
      type: Text
      example_value: "1"
      needs_mapping: false
      map_file: "" #leave blank for none
    sizeclass_code:
      length: 4
      type: Text
      example_value: "0001"
      needs_mapping: true
      map_file: "sizeclass" #leave blank for none
    dataclass_code:
      length: 1
      type: Text
      example_value: "L"
      needs_mapping: true
      map_file: "dataclass" #leave blank for none
    ratelevel_code:
      length: 1
      type: Text
      example_value: "Q"
      needs_mapping: false
      map_file: "" #leave blank for none
    periodicity_code:
      length: 1
      type: Text
      example_value: "5"
      needs_mapping: false
      map_file: "" #leave blank for none
    ownership_code:
      length: 1
      type: Text
      example_value: "5"
      needs_mapping: false
      map_file: "" #leave blank for none
    series_title:
      length: 200
      type: Text
      example_value: "Quarterly gross job gains for the total private sector in the U.S. (rounded to the nearest thousands)"
      needs_mapping: false
      map_file: "" #leave blank for none
    footnote_codes:
      length: 10
      type: Text
      example_value: "1"
      needs_mapping: true
      map_file: "footnote" #leave blank for none
    begin_year:
      length: 4
      type: Text
      example_value: "1992"
      needs_mapping: false
      map_file: "" #leave blank for none
    begin_period:
      length: 3
      type: Text
      example_value: "Q03"
      needs_mapping: false
      map_file: "" #leave blank for none
    end_year:
      length: 4
      type: Text
      example_value: "2024"
      needs_mapping: false
      map_file: "" #leave blank for none
    end_period:
      length: 3
      type: Text
      example_value: "Q04"
      needs_mapping: false
      map_file: "" #leave blank for none

data_file:
  general:
    use_mmap: true
    series_id_col: "series_id"
    obs_value: "value"
    schema:
      series_id:
        length: 30
        type: Text
        example_value: "BDS0000006000200090110004LQ5"
      year:
        length: 4
        type: values
        example_value: "2025"
      period:
        length: 3
        type: Text
        example_value: "Q02"
      value:
        length: 12
        type: values
        example_value: "821741"
      footnote_codes:
        length: 10
        type: Text
        example_value: ""

lookup_files: #DEFINE SCHEMA AND ATTRIBUTES FOR LOOKUP FILES (maps to series)
  lookup_config:
    preload: [ county, state, industry ]  # Small, frequently used
    lazy: [ footnote, msa, dataclass, sizeclass ]  # Load on demand
    mmap: [ ] # use it for large files
    cache_all: true  # Small enough to keep in memory
  files:
    county:
        file_path: "bd.county"
        name: County
        description: "Maps county codes to county names"
        index_col: "county_code"
        schema:
          county_code:
            length: 3
            type: str
            example_value: "000"
          county_name:
            length: 100
            type: Text
            example_value: "National"

    dataclass:
        file_path: "bd.dataclass"
        name: Data Class
        description: "Maps data class codes to data class names"
        index_col: "dataclass_code"
        schema:
          dataclass_code:
            length: 2
            type: str
            example_value: "01"
          dataclass_name:
            length: 100
            type: str
            example_value: "Gross Job Gains"
          display_level:
            length: 1
            type: str
            example_value: "0"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 3
            type: str
            example_value: "1"

    footnote:
        file_path: "bd.footnote"
        name: Footnotes
        description: "Maps footnote codes to footnote text"
        index_col: "footnote_code"
        schema:
          footnote_code:
            length: 1
            type: str
            example_value: "C"
          footnote_text:
            length: 100
            type: str
            example_value: ""

    industry:
        file_path: "bd.industry"
        name: Industry
        description: "Maps industry codes to industry names"
        index_col: "industry_code"
        schema:
          industry_code:
            length: 6
            type: str
            example_value: "000000"
          industry_name:
            length: 100
            type: str
            example_value: "Total private"
          display_level:
            length: 1
            type: str
            example_value: "0"
          selectable:
            length: 1
            type: str
            example_value: "T"
          sort_sequence:
            length: 3
            type: str
            example_value: "1"

    msa:
        file_path: "bd.msa"
        name: Metropolitan Statistical Area
        description: "Maps MSA codes to MSA names"
        index_col: "msa_code"
        schema:
          msa_code:
            length: 5
            type: str
            example_value: "00000"
          msa_name:
            length: 100
            type: str
            example_value: "National"

    sizeclass:
        file_path: "bd.sizeclass"
        name: Size Class
        description: "Maps size class codes to size class names"
        index_col: "sizeclass_code"
        schema:
          sizeclass_code:
            length: 2
            type: str
            example_value: "01"
          sizeclass_name:
            length: 100
            type: str
            example_value: "1-4 employees"

    state:
        file_path: "bd.state"
        name: State
        description: "Maps state codes to state names"
        index_col: "state_code"
        schema:
          state_code:
            length: 2
            type: str
            example_value: "00"
          state_name:
            length: 100
            type: str
            example_value: "U.S. TOTAL"

processing:
  # Strategy for medium survey
  strategy: chunked  # Process in chunks due to size
  max_threads: 4     # Increased parallelization for medium-sized data
  
  # Chunk settings
  chunk_size_mb: 50
  buffer_pool_size: 8
  
  # Performance hints
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: false

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: true  # Partition by year for time-series analysis
        partition_by: [year]
      use_mmap: true
      series_size_class: Medium
      list_data_files: [ bd.data.0.Current, bd.data.1.AllItems ]
      partition_strategy:
        partion_by: "state_code"
        file_format: "bd.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period, footnote_codes]

          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 1992
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^BD[SU]\\d{28}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "Q01", "Q02", "Q03", "Q04" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: true
      series_size_class: Medium
      output_file: "bd_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # State code mapping
        state_code:
          lookup_table: "state"
          lookup_key: "state_code"
          lookup_value: "state_name"
          create_field: "state_name"
          on_missing: "UNKNOWN_STATE"
          cache: true
        
        # County code mapping
        county_code:
          lookup_table: "county"
          lookup_key: "county_code"
          lookup_value: "county_name"
          create_field: "county_name"
          on_missing: "UNKNOWN_COUNTY"
          cache: true
        
        # Industry code mapping
        industry_code:
          lookup_table: "industry"
          lookup_key: "industry_code"
          lookup_value: "industry_name"
          create_field: "industry_name"
          on_missing: "UNKNOWN_INDUSTRY"
          cache: true
        
        # MSA code mapping
        msa_code:
          lookup_table: "msa"
          lookup_key: "msa_code"
          lookup_value: "msa_name"
          create_field: "msa_name"
          on_missing: "UNKNOWN_MSA"
          cache: true
        
        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^BD[SU]\\d{28}$"
            action: flag
            message: "Invalid series ID format: should be BD[S/U] followed by 28 digits"
          
          - field: series_id
            rule: length
            exact: 30
            action: reject
            message: "Series ID must be exactly 30 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # State code validation
          - field: state_code
            rule: length
            exact: 2
            action: reject
            message: "State code must be exactly 2 characters"
          
          - field: state_code
            rule: pattern
            pattern: "^[0-9]{2}$"
            action: flag
            message: "State code should be 2 digits"
          
          - field: state_code
            rule: lookup_exists
            lookup_table: "state"
            action: flag
            message: "State code not found in state lookup table"
          
          # County code validation
          - field: county_code
            rule: length
            exact: 3
            action: reject
            message: "County code must be exactly 3 characters"
          
          - field: county_code
            rule: pattern
            pattern: "^[0-9]{3}$"
            action: flag
            message: "County code should be 3 digits"
          
          # Industry code validation
          - field: industry_code
            rule: length
            exact: 6
            action: reject
            message: "Industry code must be exactly 6 characters"
          
          - field: industry_code
            rule: pattern
            pattern: "^[0-9]{6}$"
            action: flag
            message: "Industry code should be 6 digits"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 1992
            max: 2067
            action: reject
            message: "Begin year must be between 1992 and 2067"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 1992
            max: 2067
            action: reject
            message: "End year must be between 1992 and 2067"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "Q01", "Q02", "Q03", "Q04" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "Q01", "Q02", "Q03", "Q04" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, seasonal, state_code, county_code, industry_code, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ msa_code ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, state_code, industry_code, begin_year, end_year ]
        output_file: "bd_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 2000    # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "bd_errors.log"
  
  # Checkpoint settings
  checkpoint:
    enabled: true  # Enable checkpoints for medium-sized data
    interval_records: 50000
    checkpoint_dir: "checkpoints/bd"