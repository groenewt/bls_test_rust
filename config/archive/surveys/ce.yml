# .config/surveys/ce.yml
# name: Current Employment Statistics Survey Processing Configuration
# description:
# author: Junie
# date: 2025-08-07
# notes:
#         - data location: .data.raw/bls/ce
#         - Data files are in ASCII text format
#         - Spaces separate data elements in an original BLS file
#         - full doc: .docs/bls/survey/ce.txt
# changes:

#General Survey Information
survey:
  code: ce #survey code (ex.ap,sm,tu)- see docs (.docs/surveys/* for all surveys)
  name: Current Employment Statistics #friendly survey name
  size_class: large #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  description: "The Current Employment Statistics (CES) program provides estimates of employment, hours, and earnings information on a national basis and in considerable industry detail."
  definition: "
The following is a definition of:  CURRENT EMPLOYMENT STATISTICS: EMPLOYMENT, HOURS, AND EARNINGS—NATIONAL (CE)

Survey Description:
The Current Employment Statistics (CES) program provides estimates of employment,
hours, and earnings information on a national basis and in considerable industry
detail.  The Bureau of Labor Statistics collects payroll data each month from a sample
of business and government establishments in all nonfarm activities.

Employment data include series for total employment, number of women employees, and
number of production or nonsupervisory employees. Estimates of average hourly
earnings, average weekly hours, average weekly earnings, and average weekly overtime
hours are produced for both all employees and for production or nonsupervisory
employees. Overtime hours are produced for manufacturing industries only.

A sample of approximately 121,000 businesses and government agencies representing
approximately 631,000 worksites throughout the United States is utilized for this
monthly survey. The sample contains about 324,000 employer units.

All employment, hours and earnings series are classified according to the 2022 North
American Industry Classification System (NAICS). The industry code used in the survey
corresponds to the NAICS code, except in those cases where multiple industries have
been combined.
                "
  characteristics:
    frequency: monthly
    coverage: "National data with considerable industry detail"
    time_series_count: "Approximately 3,800 monthly series"
    classification_system: "2022 North American Industry Classification System (NAICS)"
    update_schedule: "Monthly release, typically on the third Friday following the week containing the 12th of the reference month"
    begin_year: 1990
    survey_methodology: "Sample of approximately 121,000 businesses and government agencies representing approximately 631,000 worksites throughout the United States"
    calculation_basis: "Payroll data collected from business and government establishments"

#Survey Series Information
series:
  path: "ce.series" #path to series file
  use_mmap: true
  series_size_class: Large #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  idx_col: "series_id"
  schema:
    series_id:
      length: 17
      type: Text
      example_value: "CEU0500000001"
      map_file: ""
    supersector_code:
      length: 2
      type: Text
      example_value: "05"
      needs_mapping: true
      map_file: "supersector"
    industry_code:
      length: 8
      type: Text
      example_value: "05000000"
      needs_mapping: true
      map_file: "industry"
    datatype_code:
      length: 2
      type: Text
      example_value: "01"
      needs_mapping: true
      map_file: "datatype"
    seasonal:
      length: 1
      type: Text
      example_value: "S"
      needs_mapping: true
      map_file: "seasonal"
    series_title:
      length: 104
      type: Text
      example_value: "All employees, thousands, total private, seasonally adjusted"
      needs_mapping: false
      map_file: ""
    footnote_codes:
      length: 10
      type: Text
      example_value: "I"
      needs_mapping: true
      map_file: "footnote"
    begin_year:
      length: 4
      type: Text
      example_value: "1990"
      needs_mapping: false
      map_file: ""
    begin_period:
      length: 3
      type: Text
      example_value: "M01"
      needs_mapping: true
      map_file: "period"
    end_year:
      length: 4
      type: Text
      example_value: "2025"
      needs_mapping: false
      map_file: ""
    end_period:
      length: 3
      type: Text
      example_value: "M06"
      needs_mapping: true
      map_file: "period"

data_file:
  general:
    use_mmap: true
    series_id_col: "series_id"
    obs_value: "value"
    schema:
      series_id:
        length: 17
        type: Text
        example_value: "CEU0500000001"
      year:
        length: 4
        type: values
        example_value: "2025"
      period:
        length: 3
        type: Text
        example_value: "M06"
      value:
        length: 12
        type: values
        example_value: "103623"
      footnote_codes:
        length: 10
        type: Text
        example_value: "p"

lookup_files: #DEFINE SCHEMA AND ATTRIBUTES FOR LOOKUP FILES (maps to series)
  lookup_config:
    preload: [ datatype, supersector ]  # Small, frequently used
    lazy: [ footnote, period, seasonal ]  # Load on demand
    mmap: [ industry ] # use it for large files
    cache_all: true  # Small enough to keep in memory
  files:
    datatype:
        file_path: "ce.datatype"
        name: Data Type
        description: "Maps data type codes to data type names"
        index_col: "data_type_code"
        schema:
          data_type_code:
            length: 2
            type: str
            example_value: "01"
          data_type_text:
            length: 100
            type: str
            example_value: "All employees, thousands"

    footnote:
        file_path: "ce.footnote"
        name: Footnotes
        description: "Maps footnote codes to footnote text"
        index_col: "footnote_code"
        schema:
          footnote_code:
            length: 1
            type: str
            example_value: "p"
          footnote_text:
            length: 100
            type: str
            example_value: "preliminary"

    industry:
        file_path: "ce.industry"
        name: Industry
        description: "Maps industry codes to industry names"
        index_col: "industry_code"
        schema:
          industry_code:
            length: 8
            type: str
            example_value: "05000000"
          naics_code:
            length: 13
            type: str
            example_value: "236"
          publishing_status:
            length: 2
            type: str
            example_value: "A"
          industry_name:
            length: 80
            type: str
            example_value: "Total private"
          display_level:
            length: 1
            type: str
            example_value: "0"

    period:
        file_path: "ce.period"
        name: Period
        description: "Maps period codes to period names"
        index_col: "period"
        schema:
          period:
            length: 3
            type: str
            example_value: "M01"
          period_abbr:
            length: 5
            type: str
            example_value: "JAN"
          period_name:
            length: 20
            type: str
            example_value: "January"

    seasonal:
        file_path: "ce.seasonal"
        name: Seasonal Adjustment
        description: "Maps seasonal adjustment codes to descriptions"
        index_col: "seasonal"
        schema:
          seasonal:
            length: 1
            type: str
            example_value: "S"
          seasonal_text:
            length: 30
            type: str
            example_value: "Seasonally Adjusted"

    supersector:
        file_path: "ce.supersector"
        name: Supersector
        description: "Maps supersector codes to supersector names"
        index_col: "supersector_code"
        schema:
          supersector_code:
            length: 2
            type: str
            example_value: "05"
          supersector_name:
            length: 60
            type: str
            example_value: "Total private"

processing:
  # Strategy for large survey
  strategy: mmap  # Use memory mapping for large files
  max_threads: 8  # Increased parallelization for large data
  
  # Chunk settings
  chunk_size_mb: 100
  buffer_pool_size: 16
  
  # Performance hints
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: true

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: true  # Partition by year for time-series analysis
        partition_by: [year]
      use_mmap: true
      series_size_class: Large
      list_data_files: [ ce.data.0.ALLCESSeries, ce.data.01a.CurrentSeasAE, ce.data.00a.TotalNonfarm.Employment, ce.data.05a.TotalPrivate.Employment ]
      partition_strategy:
        partion_by: "supersector_code"
        file_format: "ce.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period, footnote_codes]

          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 1939
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^CE[SU]\\d{14}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "M01", "M02", "M03", "M04", "M05", "M06",
                           "M07", "M08", "M09", "M10", "M11", "M12", "M13" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: true
      series_size_class: Large
      output_file: "ce_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # Supersector code mapping
        supersector_code:
          lookup_table: "supersector"
          lookup_key: "supersector_code"
          lookup_value: "supersector_name"
          create_field: "supersector_name"
          on_missing: "UNKNOWN_SUPERSECTOR"
          cache: true
        
        # Industry code mapping
        industry_code:
          lookup_table: "industry"
          lookup_key: "industry_code"
          lookup_value: "industry_name"
          create_field: "industry_name"
          on_missing: "UNKNOWN_INDUSTRY"
          cache: true
        
        # Data type code mapping
        datatype_code:
          lookup_table: "datatype"
          lookup_key: "data_type_code"
          lookup_value: "data_type_text"
          create_field: "datatype_name"
          on_missing: "UNKNOWN_DATATYPE"
          cache: true
        
        # Seasonal mapping
        seasonal:
          lookup_table: "seasonal"
          lookup_key: "seasonal"
          lookup_value: "seasonal_text"
          create_field: "seasonal_text"
          on_missing: "UNKNOWN_SEASONAL"
          cache: true
        
        # Begin period mapping
        begin_period:
          lookup_table: "period"
          lookup_key: "period"
          lookup_value: "period_name"
          create_field: "begin_period_name"
          on_missing: keep_original
          cache: true
        
        # End period mapping
        end_period:
          lookup_table: "period"
          lookup_key: "period"
          lookup_value: "period_name"
          create_field: "end_period_name"
          on_missing: keep_original
          cache: true
        
        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^CE[SU]\\d{14}$"
            action: flag
            message: "Invalid series ID format: should be CE[S/U] followed by 14 digits"
          
          - field: series_id
            rule: length
            exact: 17
            action: reject
            message: "Series ID must be exactly 17 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # Supersector code validation
          - field: supersector_code
            rule: length
            exact: 2
            action: reject
            message: "Supersector code must be exactly 2 characters"
          
          - field: supersector_code
            rule: pattern
            pattern: "^[0-9]{2}$"
            action: flag
            message: "Supersector code should be 2 digits"
          
          - field: supersector_code
            rule: lookup_exists
            lookup_table: "supersector"
            action: flag
            message: "Supersector code not found in supersector lookup table"
          
          # Industry code validation
          - field: industry_code
            rule: length
            exact: 8
            action: reject
            message: "Industry code must be exactly 8 characters"
          
          - field: industry_code
            rule: pattern
            pattern: "^[0-9]{8}$"
            action: flag
            message: "Industry code should be 8 digits"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 1939
            max: 2067
            action: reject
            message: "Begin year must be between 1939 and 2067"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 1939
            max: 2067
            action: reject
            message: "End year must be between 1939 and 2067"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "M01", "M02", "M03", "M04", "M05", "M06",
                       "M07", "M08", "M09", "M10", "M11", "M12", "M13" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "M01", "M02", "M03", "M04", "M05", "M06",
                       "M07", "M08", "M09", "M10", "M11", "M12", "M13" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, supersector_code, industry_code, datatype_code, seasonal, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ series_title, footnote_codes ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, supersector_code, industry_code, begin_year, end_year ]
        output_file: "ce_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 5000    # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "ce_errors.log"
  
  # Checkpoint settings
  checkpoint:
    enabled: true  # Enable checkpoints for large data
    interval_records: 100000
    checkpoint_dir: "checkpoints/ce"