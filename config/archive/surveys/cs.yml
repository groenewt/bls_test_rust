processing:
  # Strategy for large survey
  strategy: mmap  # Use memory mapping for large files
  max_threads: 8  # Increased parallelization for large-sized data
  
  # Chunk settings
  chunk_size_mb: 100
  buffer_pool_size: 16
  
  # Performance hints
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: false

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: true  # Partition by year for time-series analysis
        partition_by: [year]
      use_mmap: true
      series_size_class: Large
      list_data_files: [ cs.data.0.Current, cs.data.1.AllData ]
      partition_strategy:
        partion_by: "category_code"
        file_format: "cs.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period, footnote_codes]

          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 2011
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^cs[U]\\d{15}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "A01", "Q01", "Q02", "Q03", "Q04" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: true
      series_size_class: Large
      output_file: "cs_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # Category code mapping
        category_code:
          lookup_table: "category"
          lookup_key: "category_code"
          lookup_value: "category_text"
          create_field: "category_text"
          on_missing: "UNKNOWN_CATEGORY"
          cache: true
        
        # Case code mapping
        case_code:
          lookup_table: "case"
          lookup_key: "case_code"
          lookup_value: "case_text"
          create_field: "case_text"
          on_missing: "UNKNOWN_CASE"
          cache: true
        
        # Age code mapping
        age_code:
          lookup_table: "age"
          lookup_key: "age_code"
          lookup_value: "age_text"
          create_field: "age_text"
          on_missing: "UNKNOWN_AGE"
          cache: true
        
        # Gender code mapping
        gender_code:
          lookup_table: "gender"
          lookup_key: "gender_code"
          lookup_value: "gender_text"
          create_field: "gender_text"
          on_missing: "UNKNOWN_GENDER"
          cache: true
        
        # Race code mapping
        race_code:
          lookup_table: "race"
          lookup_key: "race_code"
          lookup_value: "race_text"
          create_field: "race_text"
          on_missing: "UNKNOWN_RACE"
          cache: true
        
        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^cs[U]\\d{15}$"
            action: flag
            message: "Invalid series ID format: should be cs[U] followed by 15 digits"
          
          - field: series_id
            rule: length
            exact: 17
            action: reject
            message: "Series ID must be exactly 17 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 2011
            max: 2067
            action: reject
            message: "Begin year must be between 2011 and 2067"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 2011
            max: 2067
            action: reject
            message: "End year must be between 2011 and 2067"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "A01", "Q01", "Q02", "Q03", "Q04" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "A01", "Q01", "Q02", "Q03", "Q04" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, category_code, datatype_code, case_code, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ footnote_codes ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, category_code, begin_year, end_year ]
        output_file: "cs_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 5000    # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "cs_errors.log"
  
  # Checkpoint settings
  checkpoint:
    enabled: true  # Enable checkpoints for large-sized data
    interval_records: 100000
    checkpoint_dir: "checkpoints/cs"