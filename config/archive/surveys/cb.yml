processing:
  # Strategy for large survey
  strategy: mmap  # Use memory-mapped processing for large dataset
  max_threads: 8  # Increased parallelization for large data
  
  # Chunk settings
  chunk_size_mb: 100
  buffer_pool_size: 16
  
  # Performance hints
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: false

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: true  # Partition by year for time-series analysis
        partition_by: [year]
      use_mmap: true
      series_size_class: Large
      list_data_files: [ cb.data.0.Current, cb.data.1.AllData ]
      partition_strategy:
        partion_by: "state_code"
        file_format: "cb.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period, footnote_codes]

          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 2022
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^CB[SU]\\d{15}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "A01" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: true
      series_size_class: Large
      output_file: "cb_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # Category code mapping
        category_code:
          lookup_table: "category"
          lookup_key: "category_code"
          lookup_value: "category_text"
          create_field: "category_name"
          on_missing: "UNKNOWN_CATEGORY"
          cache: true
        
        # Case code mapping
        case_code:
          lookup_table: "case"
          lookup_key: "case_code"
          lookup_value: "case_text"
          create_field: "case_name"
          on_missing: "UNKNOWN_CASE"
          cache: true
        
        # Age code mapping
        age_code:
          lookup_table: "age"
          lookup_key: "age_code"
          lookup_value: "age_text"
          create_field: "age_name"
          on_missing: "UNKNOWN_AGE"
          cache: true
        
        # Industry code mapping
        industry_code:
          lookup_table: "industry"
          lookup_key: "industry_code"
          lookup_value: "industry_text"
          create_field: "industry_name"
          on_missing: "UNKNOWN_INDUSTRY"
          cache: true
        
        # Occupation code mapping
        occupation_code:
          lookup_table: "occupation"
          lookup_key: "occupation_code"
          lookup_value: "occupation_text"
          create_field: "occupation_name"
          on_missing: "UNKNOWN_OCCUPATION"
          cache: true
        
        # Nature code mapping
        nature_code:
          lookup_table: "nature"
          lookup_key: "nature_code"
          lookup_value: "nature_text"
          create_field: "nature_name"
          on_missing: "UNKNOWN_NATURE"
          cache: true
        
        # Event code mapping
        event_code:
          lookup_table: "event"
          lookup_key: "event_code"
          lookup_value: "event_text"
          create_field: "event_name"
          on_missing: "UNKNOWN_EVENT"
          cache: true
        
        # Source code mapping
        source_code:
          lookup_table: "source"
          lookup_key: "source_code"
          lookup_value: "source_text"
          create_field: "source_name"
          on_missing: "UNKNOWN_SOURCE"
          cache: true
        
        # Part of body code mapping
        pob_code:
          lookup_table: "pob"
          lookup_key: "pob_code"
          lookup_value: "pob_text"
          create_field: "pob_name"
          on_missing: "UNKNOWN_POB"
          cache: true
        
        # Gender code mapping
        gender_code:
          lookup_table: "gender"
          lookup_key: "gender_code"
          lookup_value: "gender_text"
          create_field: "gender_name"
          on_missing: "UNKNOWN_GENDER"
          cache: true
        
        # Race code mapping
        race_code:
          lookup_table: "race"
          lookup_key: "race_code"
          lookup_value: "race_text"
          create_field: "race_name"
          on_missing: "UNKNOWN_RACE"
          cache: true
        
        # Length of service code mapping
        los_code:
          lookup_table: "los"
          lookup_key: "los_code"
          lookup_value: "los_text"
          create_field: "los_name"
          on_missing: "UNKNOWN_LOS"
          cache: true
        
        # Medical code mapping
        medical_code:
          lookup_table: "medical"
          lookup_key: "medical_code"
          lookup_value: "medical_text"
          create_field: "medical_name"
          on_missing: "UNKNOWN_MEDICAL"
          cache: true
        
        # Time code mapping
        time_code:
          lookup_table: "time"
          lookup_key: "time_code"
          lookup_value: "time_text"
          create_field: "time_name"
          on_missing: "UNKNOWN_TIME"
          cache: true
        
        # Hour code mapping
        hour_code:
          lookup_table: "hour"
          lookup_key: "hour_code"
          lookup_value: "hour_text"
          create_field: "hour_name"
          on_missing: "UNKNOWN_HOUR"
          cache: true
        
        # Weekday code mapping
        weekday_code:
          lookup_table: "weekday"
          lookup_key: "weekday_code"
          lookup_value: "weekday_text"
          create_field: "weekday_name"
          on_missing: "UNKNOWN_WEEKDAY"
          cache: true
        
        # Special code mapping
        special_code:
          lookup_table: "special"
          lookup_key: "special_code"
          lookup_value: "special_text"
          create_field: "special_name"
          on_missing: "UNKNOWN_SPECIAL"
          cache: true
        
        # Ownership code mapping
        ownership_code:
          lookup_table: "ownership"
          lookup_key: "ownership_code"
          lookup_value: "ownership_text"
          create_field: "ownership_name"
          on_missing: "UNKNOWN_OWNERSHIP"
          cache: true
        
        # State code mapping
        state_code:
          lookup_table: "state"
          lookup_key: "state_code"
          lookup_value: "state_name"
          create_field: "state_name"
          on_missing: "UNKNOWN_STATE"
          cache: true
        
        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^CB[SU]\\d{15}$"
            action: flag
            message: "Invalid series ID format: should be CB[S/U] followed by 15 digits"
          
          - field: series_id
            rule: length
            exact: 17
            action: reject
            message: "Series ID must be exactly 17 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # Category code validation
          - field: category_code
            rule: length
            exact: 3
            action: reject
            message: "Category code must be exactly 3 characters"
          
          - field: category_code
            rule: lookup_exists
            lookup_table: "category"
            action: flag
            message: "Category code not found in category lookup table"
          
          # Case code validation
          - field: case_code
            rule: length
            exact: 1
            action: reject
            message: "Case code must be exactly 1 character"
          
          - field: case_code
            rule: lookup_exists
            lookup_table: "case"
            action: flag
            message: "Case code not found in case lookup table"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 2022
            max: 2067
            action: reject
            message: "Begin year must be between 2022 and 2067"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 2022
            max: 2067
            action: reject
            message: "End year must be between 2022 and 2067"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "A01" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "A01" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year >= begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, category_code, datatype_code, case_code, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ age_code, los_code, medical_code, race_code, gender_code, pob_code, event_code, source_code, occupation_code, nature_code, industry_code, time_code, hour_code, weekday_code, special_code, footnote_codes ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, category_code, datatype_code, case_code, begin_year, end_year ]
        output_file: "cb_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 5000    # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "cb_errors.log"
  
  # Checkpoint settings
  checkpoint:
    enabled: true  # Enable checkpoints for large data
    interval_records: 100000
    checkpoint_dir: "checkpoints/cb"