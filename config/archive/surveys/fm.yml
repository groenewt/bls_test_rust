# name: Marital and Family Labor Force Statistics Processing Configuration
# description:
# author: groenewt
# date: 2025-08-07
# notes:
#         - data location: data/raw/bls/fm
#         - Data files are in ASCII text format
#         - Tabs separate data elements in an original BLS file
#         - full doc: docs/bls/survey/fm.txt
# changes:

#General Survey Information
survey:
  code: fm #survey code (ex.ap,sm,fm)- see docs (docs/surveys/* for all surveys)
  name: Marital and Family Labor Force Statistics #friendly survey name
  size_class: small #Micro (<10 MB), Small (10-100 MB), Medium (100-1 GB), Large (1-5 GB), Massive (5 GB +)
  description: "The marital and family labor force statistics (FM) database from the Current Population Survey reflects data published each year in the news release, 'Employment Characteristics of Families.'"
  definition: "
The following is a definition of: MARITAL AND FAMILY LABOR FORCE STATISTICS (FM)

Survey Description: The Current Population Survey (CPS), frequently referred to as the household survey, 
is a monthly survey of about 60,000 eligible households. The CPS provides information about the civilian 
noninstitutional population age 16 years and over. All persons are classified as employed, unemployed, 
or not in the labor force.

The CPS estimates are available by various demographic characteristics, including age, sex, race, 
Hispanic or Latino ethnicity, and marital status. Numerous cross-tabulations of labor force variables 
by demographic and labor force characteristics are available.

The marital and family labor force statistics (FM) database from the Current Population Survey reflects 
data published each year in the news release, 'Employment Characteristics of Families.'

At the present time, only data for persons are available in the FM database. Person data include 
employment status by marital status and presence and age of own children. For example, the FM database 
includes the labor force participation rate of mothers with children under age 6.

Data series for families, including the number of families by family type and employment and unemployment 
of family members, will be added in the future.

The data are annual averages of information collected monthly in the survey. The annual averages are 
calculated from not seasonally adjusted monthly data. At present, the FM database has data beginning 
with 2009 annual averages.
                "
  characteristics:
    frequency: annual
    coverage: "Civilian noninstitutional population age 16 years and over"
    time_series_count: "Marital and family labor force statistics" 
    classification_system: "Marital status, presence and age of own children, employment status"
    update_schedule: "Annual release"
    begin_year: 2009
    survey_methodology: "Monthly survey of about 60,000 eligible households conducted by the U.S. Census Bureau for the Bureau of Labor Statistics."
    calculation_basis: "Annual averages of information collected monthly in the survey, calculated from not seasonally adjusted monthly data."

