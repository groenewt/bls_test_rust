processing:
  # Strategy for small survey
  strategy: in_memory  # Process in memory due to small size
  max_threads: 2     # Moderate parallelization for small-sized data
  
  # Performance hints
  use_mmap: true  # Use memory mapping for files
  enable_statistics: true
  enable_profiling: false

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: true  # Partition by year for time-series analysis
        partition_by: [year]
      use_mmap: true
      series_size_class: small
      list_data_files: [ fm.data.0.Current, fm.data.1.AllData ]
      partition_strategy:
        partion_by: "ftyp_code"
        file_format: "fm.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period, footnote_codes]

          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 2009
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^FM[U]\\d{4,8}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "A01" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: true
      series_size_class: small
      output_file: "fm_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # Seasonal code mapping
        seasonal:
          lookup_table: "seasonal"
          lookup_key: "seasonal_code"
          lookup_value: "seasonal_text"
          create_field: "seasonal_text"
          on_missing: "UNKNOWN_SEASONAL"
          cache: true
        
        # Family type code mapping
        ftyp_code:
          lookup_table: "ftyp"
          lookup_key: "ftyp_code"
          lookup_value: "ftyp_text"
          create_field: "ftyp_text"
          on_missing: "UNKNOWN_FAMILY_TYPE"
          cache: true
        
        # Children code mapping
        chld_code:
          lookup_table: "chld"
          lookup_key: "chld_code"
          lookup_value: "chld_text"
          create_field: "chld_text"
          on_missing: "UNKNOWN_CHILDREN"
          cache: true
        
        # Marital status code mapping
        mari_code:
          lookup_table: "mari"
          lookup_key: "mari_code"
          lookup_value: "mari_text"
          create_field: "mari_text"
          on_missing: "UNKNOWN_MARITAL_STATUS"
          cache: true
        
        # Race code mapping
        race_code:
          lookup_table: "race"
          lookup_key: "race_code"
          lookup_value: "race_text"
          create_field: "race_text"
          on_missing: "UNKNOWN_RACE"
          cache: true
        
        # Sex code mapping
        sexs_code:
          lookup_table: "sexs"
          lookup_key: "sexs_code"
          lookup_value: "sexs_text"
          create_field: "sexs_text"
          on_missing: "UNKNOWN_SEX"
          cache: true
        
        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^FM[U]\\d{4,8}$"
            action: flag
            message: "Invalid series ID format: should be FM[U] followed by 4-8 digits"
          
          - field: series_id
            rule: length
            min: 6
            max: 10
            action: reject
            message: "Series ID must be between 6 and 10 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 2009
            max: 2067
            action: reject
            message: "Begin year must be between 2009 and 2067"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 2009
            max: 2067
            action: reject
            message: "End year must be between 2009 and 2067"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "A01" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "A01" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, seasonal, ftyp_code, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ footnote_codes ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, ftyp_code, begin_year, end_year ]
        output_file: "fm_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 1000    # Stop if too many errors
  log_errors: true
  error_file: "fm_errors.log"
  
  # Checkpoint settings
  checkpoint:
    enabled: true  # Enable checkpoints
    interval_records: 10000
    checkpoint_dir: "checkpoints/fm"