processing:
  # Strategy for medium survey
  strategy: chunked  # Process in chunks due to size
  max_threads: 4     # Increased parallelization for medium-sized data
  
  # Chunk settings
  chunk_size_mb: 50
  buffer_pool_size: 8
  
  # Performance hints
  use_mmap: true  # Use memory mapping for large files
  enable_statistics: true
  enable_profiling: false

output:
  data_series:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: true  # Partition by year for time-series analysis
        partition_by: [year]
      use_mmap: true
      series_size_class: Medium
      list_data_files: [ tu.data.0.Current, tu.data.1.AllData ]
      partition_strategy:
        partion_by: "stattype_code"
        file_format: "tu.data.%d.%s"
        load_dictionary_values: true
        # Schema optimization
        transformations:
          sort_by: [series_id, year, period]
          deduplicate: true
          deduplicate_on: [series_id, year, period, footnote_codes]

          validation:
            # Data quality checks
            rules:
              - field: value
                rule: range
                min: -10000000000000000.0 # MIN RANGE
                max: 10000000000000000.0 # MAX RANGE
                action: flag  # Flag but don't reject
              
              - field: year
                rule: range
                min: 2003
                max: 2055
                action: reject #(flag,ignore, reject,fatal)  *flag while testing
              
              - field: series_id
                rule: pattern
                pattern: "^TU[U]\\d{16}$"
                action: flag #flag while testing
              
              - field: period
                rule: values
                allowed: [ "A01", "Q01", "Q02", "Q03", "Q04" ]
                action: flag #flag while testing
            
            # Completeness checks
            required_fields: [ series_id, year, period ]
            nullable_fields: [ value, footnote_codes ]
          # Statistics for query optimization
          statistics:
            enabled: true
            columns: [ year, period, value ]

  data_dict:
    basic_load:
      # Format settings
      format: csv
      # Partitioning strategy
      partitioning:
        enabled: false  # Single file output for series metadata
      use_mmap: true
      series_size_class: Medium
      output_file: "tu_series_dict.csv"
      
      # Mapping configuration for lookups
      mapping:
        # Seasonal code mapping
        seasonal:
          lookup_table: "seasonal"
          lookup_key: "seasonal_code"
          lookup_value: "seasonal_text"
          create_field: "seasonal_text"
          on_missing: "UNKNOWN_SEASONAL"
          cache: true
        
        # Stattype code mapping
        stattype_code:
          lookup_table: "stattype"
          lookup_key: "stattype_code"
          lookup_value: "stattype_text"
          create_field: "stattype_text"
          on_missing: "UNKNOWN_STATTYPE"
          cache: true
        
        # Sex code mapping
        sex_code:
          lookup_table: "sex"
          lookup_key: "sex_code"
          lookup_value: "sex_text"
          create_field: "sex_text"
          on_missing: "UNKNOWN_SEX"
          cache: true
        
        # Age code mapping
        age_code:
          lookup_table: "age"
          lookup_key: "age_code"
          lookup_value: "age_text"
          create_field: "age_text"
          on_missing: "UNKNOWN_AGE"
          cache: true
        
        # Race code mapping
        race_code:
          lookup_table: "race"
          lookup_key: "race_code"
          lookup_value: "race_text"
          create_field: "race_text"
          on_missing: "UNKNOWN_RACE"
          cache: true
        
        # Footnote codes mapping (can be multiple)
        footnote_codes:
          lookup_table: "footnote"
          lookup_key: "footnote_code"
          lookup_value: "footnote_text"
          create_field: "footnote_texts"
          multiple: true
          separator: " "
          on_missing: skip
          cache: true
      
      transformations:
        sort_by: [ series_id ]
        deduplicate: false  # Series should be unique by definition
        deduplicate_on: [ series_id ]
      
      validation:
        # Data quality checks for series file
        rules:
          # Series ID validation
          - field: series_id
            rule: pattern
            pattern: "^TU[U]\\d{16}$"
            action: flag
            message: "Invalid series ID format: should be TU[U] followed by 16 digits"
          
          - field: series_id
            rule: length
            exact: 18
            action: reject
            message: "Series ID must be exactly 18 characters"
          
          - field: series_id
            rule: required
            action: reject
            message: "Series ID cannot be null"
          
          # Begin year validation
          - field: begin_year
            rule: range
            min: 2003
            max: 2067
            action: reject
            message: "Begin year must be between 2003 and 2067"
          
          - field: begin_year
            rule: numeric
            action: reject
            message: "Begin year must be numeric"
          
          # End year validation
          - field: end_year
            rule: range
            min: 2003
            max: 2067
            action: reject
            message: "End year must be between 2003 and 2067"
          
          - field: end_year
            rule: numeric
            action: reject
            message: "End year must be numeric"
          
          - field: end_year
            rule: greater_than_or_equal
            compare_field: begin_year
            action: reject
            message: "End year must be >= begin year"
          
          # Begin period validation
          - field: begin_period
            rule: values
            allowed: [ "A01", "Q01", "Q02", "Q03", "Q04" ]
            action: flag
            message: "Invalid begin period value"
          
          # End period validation
          - field: end_period
            rule: values
            allowed: [ "A01", "Q01", "Q02", "Q03", "Q04" ]
            action: flag
            message: "Invalid end period value"
          
          # Cross-field validation: date logic
          - field: end_year
            rule: date_logic_check
            check_fields: [ begin_year ]
            validation: "(end_year > begin_year) OR (end_year is null and begin_year is null)"
            action: flag
            message: "End date must be after or equal to begin date"
        
        # Completeness checks
        required_fields: [ series_id, seasonal, stattype_code, datays_code, begin_year, begin_period, end_year, end_period ]
        nullable_fields: [ footnote_codes ]
        
        # Uniqueness constraint
        unique_fields: [ series_id ]
      
      # Statistics for query optimization
      statistics:
        enabled: true
        columns: [ series_id, stattype_code, begin_year, end_year ]
        output_file: "tu_series_dict_stats.json"

# ERROR HANDLING & RECOVERY
error_handling:
  # Recovery strategy
  on_error: continue  # Continue processing other records
  max_errors: 2000    # Stop if too many errors (increased for larger dataset)
  log_errors: true
  error_file: "tu_errors.log"
  
  # Checkpoint settings
  checkpoint:
    enabled: true  # Enable checkpoints for medium-sized data
    interval_records: 50000
    checkpoint_dir: "checkpoints/tu"